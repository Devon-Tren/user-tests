/** Turn a raw selector into words: "#createRoomButton" → "create room button",
 *  "#joinForm > button:nth-of-type(1)" → "join form › button". */
function prettySelector(sel) {
  if (!sel) return "";
  const raw = String(sel);
  const parts = raw.split(">").map((s) => s.trim()).filter(Boolean);
  const last = parts[parts.length - 1] || raw;
  let tok = last
    .replace(/\[[^\]]*\]/g, "")
    .replace(/::?[a-z-]+(\([^)]*\))?/gi, "")
    .replace(/^[a-z][a-z0-9-]*[#.]/i, "")
    .replace(/^[#.]+/, "");
  tok = tok.replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/[-_]+/g, " ").toLowerCase().trim();
  if (!tok) return raw.length > 30 ? raw.slice(0, 29) + "…" : raw;
  const prefix = parts.length > 1 ? "… › " : "";
  return prefix + (tok.length > 36 ? tok.slice(0, 35) + "…" : tok);
}

const q = (s) => `“${s}”`;

/** One step → a plain-language sentence + glyph. */
function actionPhrase(s) {
  const sel = prettySelector(s.params && (s.params.selector || s.params.url));
  const v = s.params && s.params.value ? String(s.params.value) : "";
  switch (s.action) {
    case "click":    return { glyph: "👆", text: `clicked ${q(sel)}` };
    case "type":     return { glyph: "⌨️", text: `typed ${q(v.slice(0, 24) + (v.length > 24 ? "…" : ""))} into ${q(sel)}` };
    case "pressKey": return { glyph: "🔑", text: `pressed ${q(String((s.params && s.params.key) || sel || "a key"))}` };
    case "scroll":   return { glyph: "↕️", text: "scrolled the page" };
    case "goto":     return { glyph: "🔗", text: `opened ${sel}` };
    case "goBack":   return { glyph: "⬅️", text: "went back a page" };
    case "screenshot": return { glyph: "📷", text: "took a screenshot" };
    case "hover":    return { glyph: "🖱️", text: `hovered ${q(sel)}` };
    case "wait":     return { glyph: "⏳", text: "waited" };
    default:         return { glyph: "•", text: s.action + (sel ? " " + q(sel) : "") };
  }
}

/** Group a persona's steps into page chapters, merging consecutive repeats. */
function personaSegments(p) {
  const segs = [];
  let cur = null, lastKey = null;
  for (const s of p.steps || []) {
    if (s.action === "goto" || s.action === "goBack") {
      const page = s.action === "goto" ? shortUrl(s.params && s.params.url) : "(back)";
      cur = { page, items: [] };
      segs.push(cur);
      lastKey = null;
      continue;
    }
    if (!cur) { cur = { page: "Home", items: [] }; segs.push(cur); }
    const key = s.action + "|" + ((s.params && s.params.selector) || "") + "|" + ((s.params && s.params.value) || "");
    const prev = cur.items[cur.items.length - 1];
    if (key === lastKey && prev && !prev.finding && !s.finding) { prev.repeat++; continue; }
    lastKey = key;
    const a = actionPhrase(s);
    cur.items.push({
      step: s.step, glyph: a.glyph, text: a.text, ok: s.ok,
      why: (s.reasoning || "").replace(/\s+/g, " ").trim().slice(0, 130),
      finding: s.finding || null,
    });
  }
  return segs;
}

/** Readable story for one persona: verdict, findings, chaptered steps. */
function personaStory(p, finds) {
  const wrap = el("div", "story");
  const atStep = new Map();
  for (const f of finds) if (f.atStep != null && !atStep.has(f.atStep)) atStep.set(f.atStep, f);

  const segs = personaSegments(p);
  let shownFindings = new Set();
  for (const seg of segs) {
    if (!seg.items.length && seg.page === "(back)") continue;
    const head = el("div", "seg-head", seg.page === "(back)" ? "⬅️ went back" : `🖥 ${esc(seg.page === "Home" ? "Home screen" : seg.page)}`);
    wrap.appendChild(head);
    const box = el("div", "seg-items");
    for (const it of seg.items) {
      const row = el("div", "sitem" + (it.ok === false ? " failed" : ""));
      row.appendChild(el("span", "n", "#" + it.step));
      row.appendChild(el("span", "g", it.glyph));
      const txt = el("span", "t", esc(it.text) + (it.repeat > 1 ? ` <b style="color:var(--accent)">×${it.repeat}</b>` : ""));
      row.appendChild(txt);
      if (it.why) {
        const why = el("span", "why", esc(it.why));
        why.title = it.why;
        row.appendChild(why);
      }
      box.appendChild(row);
      const f = it.finding || atStep.get(it.step);
      if (f && !shownFindings.has(f)) {
        shownFindings.add(f);
        const code = f.code || (atStep.get(it.step) || {}).code;
        const full = code ? (finds.find((x) => x.code === code) || f) : f;
        const pin = el("div", "sfinding " + (full.severity || "major"));
        pin.innerHTML = `🚩 <b>${esc(code || "finding")}</b> — ${esc((full.title || f.title || "").slice(0, 90))}`;
        pin.addEventListener("click", () => showFinding(code, full.title || f.title));
        box.appendChild(pin);
      }
    }
    wrap.appendChild(box);
  }
  if (!segs.length) wrap.appendChild(el("div", "empty", "No steps recorded for this persona."));
  return wrap;
}

  v.style.cursor = worst.code ? "pointer" : "default";
  if (worst.code) v.addEventListener("click", () => showFinding(worst.code, worst.title));
  return v;
}

// ===========================================================================
// Architecture — the technical view of the repo under test.
//
// The server hands back mapd's graph (files, import edges, workflows, test
// gaps). Everything past that — layering, blast radius, cycles, coupling,
// risk scoring — is derived here so it never drifts from the graph on screen.
// ===========================================================================

const TEST_LABEL = { "tested-real": "real tests", "tested-nameonly": "name-only test", untested: "untested", unknown: "unknown" };
const TEST_COLOR = { "tested-real": "var(--ok)", "tested-nameonly": "var(--minor)", untested: "var(--critical)", unknown: "var(--muted)" };
const HEAT = ["rgba(110,168,255,.06)", "rgba(110,168,255,.18)", "rgba(110,168,255,.34)", "rgba(154,110,255,.48)", "rgba(255,161,77,.6)", "rgba(255,93,115,.72)"];
const NODE_BUILTINS = new Set(["fs", "path", "http", "https", "url", "os", "crypto", "events", "stream", "child_process", "util", "zlib", "net", "tls", "buffer", "assert", "worker_threads", "readline", "timers", "process", "querystring", "dns", "cluster", "perf_hooks", "string_decoder", "v8", "vm"]);

const hexA = (h, a) => {
  const m = String(h).replace("#", "");
  if (!/^[0-9a-f]{6}$/i.test(m)) return `rgba(140,170,255,${a})`;
  const v = parseInt(m, 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
};
const wfColorOf = (nd) => (nd && nd.wfs && nd.wfs.length ? WF_PALETTE[nd.wfs[0] % WF_PALETTE.length] : "#5a6b96");
const isBareSpec = (s) => !!s && !s.startsWith(".") && !s.startsWith("/") && !s.startsWith("#");
const pkgOf = (spec) => {
  const s = String(spec).replace(/^node:/, "");
  const parts = s.split("/");
  return s.startsWith("@") ? parts.slice(0, 2).join("/") : parts[0];
};
const pct = (x) => (x == null ? "—" : Math.round(x * 100) + "%");
const lg = (v) => Math.log1p(Math.max(0, v));
const median = (xs) => { if (!xs.length) return 0; const s = [...xs].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

/**
 * Derive the full analysis model from the raw mapd payload.
 * Everything is index-based against `arch.nodes`; O(n·(n+e)) closures are fine
 * because the payload is capped at 300 files server-side.
 */
function archModel(arch) {
  const nodes = arch.nodes || [];
  const n = nodes.length;
  const out = Array.from({ length: n }, () => []);
  const inn = Array.from({ length: n }, () => []);
  const seen = new Set();
  const uniqEdges = [];
  for (const e of arch.edges || []) {
    const a = e[0], b = e[1];
    if (a == null || b == null || a === b || !nodes[a] || !nodes[b]) continue;
    const k = a + ">" + b;
    if (seen.has(k)) continue;
    seen.add(k);
    uniqEdges.push([a, b]);
    out[a].push(b);
    inn[b].push(a);
  }
  const outDeg = out.map((l) => l.length);
  const inDeg = inn.map((l) => l.length);

  // --- layering: shortest hop distance from the nearest entry point --------
  const depth = new Array(n).fill(Infinity);
  nodes.forEach((nd, i) => { if (nd.entry) depth[i] = 0; });
  if (!depth.some((d) => d === 0) && n) depth[0] = 0;
  for (let pass = 0; pass < Math.min(24, n + 1); pass++) {
    let changed = false;
    for (const [a, b] of uniqEdges) {
      if (depth[a] !== Infinity && depth[a] + 1 < depth[b]) { depth[b] = depth[a] + 1; changed = true; }
    }
    if (!changed) break;
  }
  const maxReal = Math.max(0, ...depth.filter((d) => d !== Infinity));
  const detached = [];
  depth.forEach((d, i) => { if (d === Infinity) { depth[i] = maxReal + 1; detached.push(i); } });
  const maxDepth = n ? Math.max(...depth) : 0;

  // --- transitive closures ------------------------------------------------
  const bfs = (starts, adj) => {
    const hit = new Set(starts);
    const q = [...starts];
    while (q.length) for (const nx of adj[q.pop()]) if (!hit.has(nx)) { hit.add(nx); q.push(nx); }
    return hit;
  };
  const entryIdx = nodes.map((nd, i) => (nd.entry ? i : -1)).filter((i) => i >= 0);
  const reachable = bfs(entryIdx.length ? entryIdx : [0], out);
  const deps = new Array(n), dependents = new Array(n);
  for (let i = 0; i < n; i++) {
    deps[i] = bfs([i], out); deps[i].delete(i);
    dependents[i] = bfs([i], inn); dependents[i].delete(i);
  }
  const blast = dependents.map((s) => s.size);

  // --- strongly connected components (Tarjan, iterative) -------------------
  const index = new Array(n).fill(-1), low = new Array(n).fill(0), onStack = new Array(n).fill(false);
  const stack = [], sccs = [];
  let counter = 0;
  for (let s = 0; s < n; s++) {
    if (index[s] !== -1) continue;
    const work = [[s, 0]];
    while (work.length) {
      const frame = work[work.length - 1];
      const v = frame[0];
      if (frame[1] === 0) { index[v] = low[v] = counter++; stack.push(v); onStack[v] = true; }
      let recursed = false;
      while (frame[1] < out[v].length) {
        const w = out[v][frame[1]++];
        if (index[w] === -1) { work.push([w, 0]); recursed = true; break; }
        if (onStack[w]) low[v] = Math.min(low[v], index[w]);
      }
      if (recursed) continue;
      if (low[v] === index[v]) {
        const comp = [];
        for (;;) { const w = stack.pop(); onStack[w] = false; comp.push(w); if (w === v) break; }
        if (comp.length > 1) sccs.push(comp);
      }
      work.pop();
      if (work.length) { const p = work[work.length - 1][0]; low[p] = Math.min(low[p], low[v]); }
    }
  }
  const selfLoops = (arch.edges || []).filter((e) => e[0] === e[1] && nodes[e[0]]).map((e) => e[0]);

  // --- risk score: size × blast radius × surface × test gap ---------------
  const maxLoc = Math.max(1, ...nodes.map((x) => x.loc || 0));
  const maxBlast = Math.max(1, ...blast);
  const maxFns = Math.max(1, ...nodes.map((x) => (x.fns || []).length));
  const gapWeight = (t) => (t === "untested" ? 1 : t === "tested-real" ? 0 : 0.55);
  const risk = nodes.map((nd, i) => Math.round(100 * (
    0.32 * (lg(nd.loc || 0) / lg(maxLoc)) +
    0.30 * (lg(blast[i]) / lg(maxBlast)) +
    0.14 * ((nd.fns || []).length / maxFns) +
    0.24 * gapWeight(nd.test)
  )));

  // --- function-level aggregates -----------------------------------------
  const allFns = [];
  for (const nd of nodes) for (const f of nd.fns || []) allFns.push({ ...f, file: nd.path, fileName: nd.name, test: nd.test });
  const fnLocs = allFns.map((f) => f.loc || 0);
  const asyncFns = allFns.filter((f) => f.async).length;
  const exportedFns = allFns.filter((f) => f.exported).length;
  const anonFns = allFns.filter((f) => !f.name || String(f.name).startsWith("<")).length;
  const callEdges = allFns.reduce((a, f) => a + (f.calls || []).length, 0);
  const FN_BUCKETS = [[1, 10], [11, 25], [26, 50], [51, 100], [101, 200], [201, Infinity]];
  const fnHist = FN_BUCKETS.map(([lo, hi]) => ({
    label: hi === Infinity ? `${lo}+` : `${lo}–${hi}`,
    count: fnLocs.filter((v) => v >= lo && v <= hi).length,
    hot: lo >= 101,
  }));

  // --- external dependencies ---------------------------------------------
  const ext = new Map();
  for (const nd of nodes) {
    for (const spec of nd.imports || []) {
      if (!isBareSpec(spec)) continue;
      const p = pkgOf(spec);
      const rec = ext.get(p) || { pkg: p, files: new Set(), builtin: NODE_BUILTINS.has(p) || String(spec).startsWith("node:") };
      rec.files.add(nd.path);
      ext.set(p, rec);
    }
  }
  const externals = [...ext.values()].map((r) => ({ ...r, count: r.files.size, files: [...r.files] })).sort((a, b) => b.count - a.count || a.pkg.localeCompare(b.pkg));

  // --- directory rollups + coupling matrix --------------------------------
  const dirs = new Map();
  nodes.forEach((nd, i) => {
    const d = nd.dir && nd.dir !== "." ? nd.dir : "(root)";
    const rec = dirs.get(d) || { dir: d, files: 0, loc: 0, fns: 0, untested: 0, risk: 0, idx: [] };
    rec.files++; rec.loc += nd.loc || 0; rec.fns += (nd.fns || []).length;
    if (nd.test !== "tested-real") rec.untested++;
    rec.risk = Math.max(rec.risk, risk[i]);
    rec.idx.push(i);
    dirs.set(d, rec);
  });
  const dirList = [...dirs.values()].sort((a, b) => b.loc - a.loc);
  const dirIndex = new Map(dirList.map((d, i) => [d.dir, i]));
  const coupling = dirList.map(() => dirList.map(() => 0));
  for (const [a, b] of uniqEdges) {
    const da = dirIndex.get(nodes[a].dir && nodes[a].dir !== "." ? nodes[a].dir : "(root)");
    const db = dirIndex.get(nodes[b].dir && nodes[b].dir !== "." ? nodes[b].dir : "(root)");
    if (da != null && db != null) coupling[da][db]++;
  }

  const testCounts = { "tested-real": 0, "tested-nameonly": 0, untested: 0, unknown: 0 };
  for (const nd of nodes) testCounts[nd.test in testCounts ? nd.test : "unknown"]++;

  const locs = nodes.map((x) => x.loc || 0);
  return {
    arch, nodes, n, out, inn, outDeg, inDeg, uniqEdges, depth, maxDepth, detached,
    entryIdx, reachable, deps, dependents, blast, risk, sccs, selfLoops,
    allFns, fnHist, asyncFns, exportedFns, anonFns, callEdges, externals,
    dirList, coupling, testCounts,
    locStats: { max: Math.max(0, ...locs), median: Math.round(median(locs)), mean: Math.round(locs.reduce((a, b) => a + b, 0) / Math.max(1, n)) },
    density: n > 1 ? uniqEdges.length / n : 0,
    leaves: outDeg.filter((d, i) => d === 0 && inDeg[i] > 0).length,
    roots: inDeg.filter((d, i) => d === 0 && outDeg[i] > 0).length,
    orphans: nodes.filter((_, i) => !outDeg[i] && !inDeg[i]).length,
    reachLoc: [...reachable].reduce((a, i) => a + (nodes[i].loc || 0), 0),
  };
}

// ------------------------------------------------------------- widgets ---

/** Radial gauge, 0..1, with the value in the middle. */
function gauge(value, label, color = "var(--accent)", size = 92) {
  const box = el("div");
  const v = value == null ? 0 : Math.max(0, Math.min(1, value));
  const R = 15.9155, C = 2 * Math.PI * R;
  const svg = svgEl("svg", { width: size, height: size, viewBox: "0 0 42 42", class: "grow-in" });
  svg.appendChild(svgEl("circle", { cx: 21, cy: 21, r: R, fill: "none", stroke: "rgba(120,150,255,.16)", "stroke-width": 4.4 }));
  const arc = svgEl("circle", {
    cx: 21, cy: 21, r: R, fill: "none", stroke: color, "stroke-width": 4.4, "stroke-linecap": "round",
    "stroke-dasharray": `${(v * C).toFixed(2)} ${C}`, transform: "rotate(-90 21 21)",
    style: `filter:drop-shadow(0 0 5px ${color})`,
  });
  svg.appendChild(arc);
  const t = svgEl("text", { x: 21, y: 23.4, "text-anchor": "middle", fill: "var(--text)", "font-size": 9.5, "font-weight": 800 });
  t.textContent = value == null ? "—" : Math.round(v * 100) + "%";
  svg.appendChild(t);
  box.appendChild(svg);
  box.appendChild(el("div", "gauge-lab", label));
  return box;
}

/** Labelled horizontal meter with a tone class. */
function meter(label, value, right, tone = "", note = "") {
  const v = Math.max(0, Math.min(1, value || 0));
  const m = el("div", "meter",
    `<div class="top"><span>${label}</span><b>${right}</b></div>` +
    `<div class="track"><div class="fill ${tone}" style="width:${(v * 100).toFixed(1)}%"></div></div>` +
    (note ? `<div class="note">${note}</div>` : ""));
  return m;
}

function astat(value, label, sub) {
  return el("div", "astat", `<div class="v">${value}</div><div class="l">${label}</div>` + (sub ? `<div class="s">${sub}</div>` : ""));
}

function riskBadge(score) {
  const tone = score >= 70 ? ["var(--critical)", "rgba(255,93,115,.5)"] : score >= 45 ? ["var(--major)", "rgba(255,161,77,.5)"] : score >= 25 ? ["var(--minor)", "rgba(255,209,102,.45)"] : ["var(--ok)", "rgba(63,214,143,.45)"];
  return `<span class="risk-badge" style="color:${tone[0]};border-color:${tone[1]}">risk ${score}</span>`;
}

function panelWith(title, hint) {
  return el("div", "panel", `<h2>${title}${hint ? `<span class="hint" style="text-transform:none;letter-spacing:0;font-size:11px;opacity:.7;margin-left:10px">${hint}</span>` : ""}</h2>`);
}

const ARCH_EXPLAINER =
  `<b>Under the hood — static analysis, not testing.</b> The repo under test is parsed by <code>mapd</code>: every source file becomes a node, ` +
  `every resolved <code>import</code> an edge, and functions are indexed with the calls they make. Modules are laid out in <b>dependency layers</b> ` +
  `(L0 = entry points, each column one import hop deeper), <b>ringed in the colour of the workflow</b> mapd inferred for them, and drawn with a ` +
  `<b>dashed border</b> when no real automated test covers them. Everything below the graph — blast radius, cycles, directory coupling, risk score — ` +
  `is derived from that graph in your browser, so it always matches what you see. <b>Click any module</b> to pin it: the graph highlights everything ` +
  `upstream and downstream of it and the inspector below opens its functions, exports and internal call graph.`;

async function renderArchitecture() {
  const r = S.run, main = $("#main");
  main.innerHTML = "";
  if (!r) { main.appendChild(el("div", "empty", "No run selected.")); return; }
  main.appendChild(el("div", "explainer", ARCH_EXPLAINER));

  const loadingPanel = el("div", "panel", "<h2>Architecture</h2>");
  loadingPanel.appendChild(el("div", "empty", "Mapping the repo with mapd… first visit can take a few seconds."));
  main.appendChild(loadingPanel);

  let arch = null, err = null;
  try {
    const fresh = S.archFresh ? "&fresh=1" : "";
    S.archFresh = false;
    arch = await api("/api/architecture?dir=" + encodeURIComponent(r.dir) + (S.archRepo ? "&repo=" + encodeURIComponent(S.archRepo) : "") + fresh);
  } catch (e) { err = e.message; }
  if (!loadingPanel.isConnected) return; // user switched tabs mid-map
  main.innerHTML = "";
  main.appendChild(el("div", "explainer", ARCH_EXPLAINER));

  if (err || !arch || !arch.nodes || !arch.nodes.length) {
    S.lastArch = null;
    const p = el("div", "panel", "<h2>Architecture</h2>");
    p.appendChild(el("div", "banner", "⚠ " + esc(err || "mapd found no code graph for this repo (e.g. a static HTML app or a fixture).")));
    const row = el("div", "", "");
    row.style.cssText = "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap";
    const input = el("input");
    input.placeholder = "/absolute/path/to/repo — for older runs that didn't record it";
    input.style.cssText = "flex:1;min-width:260px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 12px;font-size:13px;outline:none";
    const btn = el("button", "btn", "Map it");
    const retry = () => { S.archRepo = input.value.trim() || undefined; renderArchitecture(); };
    btn.addEventListener("click", retry);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") retry(); });
    row.append(input, btn);
    p.appendChild(row);
    p.appendChild(el("div", "legend", `<span>Tip: any absolute path works — the map is built from that repo on demand, so you can point this at a project the run never touched.</span>`));
    main.appendChild(p);
    return;
  }

  S.lastArch = arch;
  const model = archModel(arch);
  const ctx = { arch, model, select: () => {}, applyFilter: () => {} };
  ctx.detail = panelWith("Module inspector", "click a module in the graph, the hotspot table or the risk map");
  ctx.detail.classList.add("arch-detail");
  ctx.detail.appendChild(el("div", "empty", "Nothing pinned yet — click a module anywhere on this page."));

  main.appendChild(archHero(ctx));
  main.appendChild(archMetrics(ctx));
  if (arch.stats.truncated) {
    main.appendChild(el("div", "banner info",
      `Large repo — the graph is capped at the ${arch.stats.shown} most connected files of ${arch.stats.fileCount} (workflow members and entry points first). Totals above are for the whole repo.`));
  }
  main.appendChild(archLegend(ctx));
  main.appendChild(archGraphPanel(ctx));
  main.appendChild(ctx.detail);
  main.appendChild(archHotspots(ctx));
  main.appendChild(archRiskMap(ctx));
  const grid = el("div", "arch-grid-2");
  grid.append(archCoupling(ctx), archTreemap(ctx));
  main.appendChild(grid);
  main.appendChild(archCycles(ctx));
  main.appendChild(archWorkflows(ctx));
  const grid2 = el("div", "arch-grid-2");
  grid2.append(archExternals(ctx), archFnDistribution(ctx));
  main.appendChild(grid2);
  main.appendChild(archFnTable(ctx));
  ctx.applyFilter();
}

    `<b>${untested}</b> module${untested === 1 ? "" : "s"} ship without a real automated test` +
    (topRisk ? `, and the highest-risk one right now is <b class="mono">${esc(topRisk.nd.path)}</b> (${topRisk.r}/100).` : ".")));
  const askRow = el("div");

  wrap.append(left, right);

    `${model.testCounts["tested-nameonly"]} name-only · ${model.testCounts.untested} untested · ${model.testCounts.unknown} unknown.`));
  const liveFrac = model.n ? model.reachable.size / model.n : 0;
  m2.appendChild(meter("Reachable from an entry point — live vs. dead-ish code", liveFrac,
    `${model.reachable.size}/${model.n}`, liveFrac > 0.8 ? "ok" : "warn",

function archLegend(ctx) {

  chips.appendChild(el("span", "chip", `<span class="dot" style="background:var(--accent);box-shadow:0 0 8px var(--accent)"></span> <b>glow</b> = entry point`));
  chips.appendChild(el("span", "chip", `<span class="dot" style="background:var(--border-hi)"></span> <b>dashed border</b> = no real tests`));

  chips.appendChild(el("span", "chip", `<span class="dot" style="background:var(--ok)"></span> <b>bar in node</b> = size relative to the biggest file`));

  const shown = (app.length ? app : pairs).slice(0, 8);
  shown.forEach(({ w, idx }, i) => {
    const chip = el("span", "chip", `<span class="dot" style="background:${WF_PALETTE[idx % WF_PALETTE.length]}"></span> <b>${esc(String(w.id))}</b> · ${w.files} files · conf ${(w.confidence || 0).toFixed(2)}`);
    chip.title = "Click to spotlight this workflow";
    chip.style.cursor = "pointer";
    if (S.archWfHL === idx) chip.style.boxShadow = "0 0 0 1.5px var(--accent)";
    chip.addEventListener("click", () => {
