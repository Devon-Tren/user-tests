// ----------------------------------------------------------------- chat ---
function renderViz(spec) {
  const box = el("div", "viz-box");
  try {
    const s = typeof spec === "string" ? JSON.parse(spec) : spec;
    if (s.type === "timeline" && s.persona) {
      const p = (S.run?.personas || []).find((x) => x.name === s.persona);
      box.appendChild(p ? personaTimelineSvg(p) : el("div", "empty", "persona not found: " + esc(s.persona)));
    } else if (s.type === "flow" && s.code) {
      const f = (S.run?.findings || []).find((x) => x.code === s.code);
      box.appendChild(f ? flowForFinding(f) : el("div", "empty", "finding not found: " + esc(s.code)));
    } else if (s.type === "severity") {
      const f = S.run?.findings.filter((x) => x.section === "main") || [];
      const c = (sev) => f.filter((x) => x.severity === sev).length;
      box.appendChild(donut({ critical: c("critical"), major: c("major"), minor: c("minor") }));
    } else if (s.type === "cost") {
      const rows = (S.run?.personas || []).map((p) => ({ label: p.name, value: p.stats.costUsd, color: "var(--major)", fmt: fmt$ }));
      box.appendChild(rows.length ? hbars(rows, { fmt: fmt$ }) : el("div", "empty", "no cost data"));
    } else box.appendChild(el("div", "empty", "unknown visual: " + esc(JSON.stringify(s))));
  } catch (e) {
    box.appendChild(el("div", "empty", "bad visual spec: " + esc(e.message)));
  }
  return box;
}

function personaTimelineSvg(p) {
  const steps = p.steps || [];
  const W = 560, rh = 24;
  const svg = svgEl("svg", { width: "100%", viewBox: `0 0 ${W} ${Math.max(1, steps.length) * rh + 8}`, style: "max-width:560px" });
  steps.forEach((s, i) => {
    const y = i * rh;
    svg.appendChild(svgEl("rect", { x: 0, y: y + 3, width: 44, height: 18, rx: 4, fill: "var(--panel2)", stroke: "var(--border)" }));
    const n = svgEl("text", { x: 22, y: y + 16, "text-anchor": "middle", fill: "var(--muted)", "font-size": 10 });
    n.textContent = s.step;
    svg.appendChild(n);
    svg.appendChild(svgEl("circle", { cx: 60, cy: y + 12, r: 4, fill: s.finding ? "var(--critical)" : (ACTION_COLOR[s.action] || "var(--muted)") }));
    const t = svgEl("text", { x: 72, y: y + 16, fill: "var(--text)", "font-size": 11 });
    t.textContent = `${s.action} ${JSON.stringify(s.params || {})}`.slice(0, 72);
    svg.appendChild(t);
    if (s.finding) {
      const f = svgEl("text", { x: 440, y: y + 16, fill: "var(--critical)", "font-size": 10 });
      f.textContent = "⚑ " + s.finding.title.slice(0, 34);
      svg.appendChild(f);
    }
  });
  return svg;
}

function flowForFinding(f) {
  const wrap = el("div");
  wrap.appendChild(el("div", "legend", `<span>Repro path for <b style="color:var(--text)">${esc(f.code)}</b> — ${esc(f.title)}</span>`));
  const ol = el("ol");
  for (const s of f.steps || []) ol.appendChild(el("li", "", esc(String(s))));
  wrap.appendChild(ol);
  return wrap;
}

function addMsg(who, html) {
  const m = el("div", "msg " + who);
  m.innerHTML = `<div class="who">${who === "user" ? "you" : "analyst"}</div><div class="body">${html}</div>`;
  $("#chat-msgs").appendChild(m);
  $("#chat-msgs").scrollTop = 1e9;
  return m.querySelector(".body");
}

function extractVisual(answer) {
  const m = answer.match(/```visual\s*\n?([\s\S]*?)```/);
  if (!m) return { text: answer, spec: null };
  return { text: answer.replace(m[0], "").trim(), spec: m[1].trim() };
}

function bindCodeLinks(container) {
  container.querySelectorAll("a.code-link").forEach((a) =>
    a.addEventListener("click", () => showFinding(a.dataset.code, null))
  );
}

const SLASH = {
  "/help": () => addMsg("bot", `<p>Slash commands (free, no tokens):</p><ul><li><code>/flow C-2</code> — repro path for a finding</li><li><code>/timeline chaos-hunter</code> — persona step timeline</li><li><code>/severity</code> — findings donut</li><li><code>/cost</code> — LLM cost per persona</li><li><code>/project</code> — full project brief from the analyst</li><li><code>/artifacts</code> — list every file this run wrote</li><li><code>/artifact REPORT.md</code> — open one in the viewer</li><li><code>/pin findings/chaos-hunter.actions.json</code> — ground my next answer in that file</li></ul><p>Anything else goes to the LLM analyst (~$0.02/turn), grounded in this run's artifacts — and it can pull any raw file it needs, telling you which ones it opened.</p>`),
  "/severity": () => { const b = addMsg("bot", ""); b.appendChild(renderViz({ type: "severity" })); },
  "/cost": () => { const b = addMsg("bot", ""); b.appendChild(renderViz({ type: "cost" })); },
  "/flow": (arg) => { const b = addMsg("bot", ""); b.appendChild(renderViz({ type: "flow", code: (arg || "").trim() })); },
  "/timeline": (arg) => { const b = addMsg("bot", ""); b.appendChild(renderViz({ type: "timeline", persona: (arg || "").trim() })); },
  "/project": () => askAnalyst("Give me a 3-paragraph brief of this project: what it is, how it's built, and the top risks. Mention entry points and untested areas."),
  "/artifacts": () => {
    const list = S.artifacts || [];
    if (!list.length) { addMsg("bot", "<p>Artifact list not loaded yet — open the <b>Artifacts</b> tab once and I'll know the folder.</p>"); goTab("artifacts"); return; }
    const b = addMsg("bot", `<p>${list.length} artifacts in this run — click one to open it, or <code>/pin &lt;file&gt;</code> to ground my next answer in it:</p>`);
    const strip = artifactStrip(list.filter((a) => a.kind !== "shot").map((a) => ({ file: a.file, hint: fmtBytes(a.bytes) })));
    b.appendChild(strip);
  },
  "/artifact": (arg) => {
    const f = (arg || "").trim();
    const hit = (S.artifacts || []).find((a) => a.file === f || a.name === f);
    if (!hit) { addMsg("bot", `<p>No artifact called <code>${esc(f)}</code>. Try <code>/artifacts</code> for the list.</p>`); return; }
    S.artOpen = hit.file;
    addMsg("bot", `<p>Opening <code>${esc(hit.file)}</code> in the Artifacts tab — ${esc(hit.label)}.</p>`);
    goTab("artifacts");
  },
  "/pin": (arg) => {
    const f = (arg || "").trim();
    const hit = (S.artifacts || []).find((a) => a.file === f || a.name === f);
    if (!hit) { addMsg("bot", `<p>No artifact called <code>${esc(f)}</code>. Try <code>/artifacts</code> for the list.</p>`); return; }
    const on = togglePin(hit.file);
    addMsg("bot", `<p>${on ? "📎 Pinned" : "Unpinned"} <code>${esc(hit.file)}</code>${on ? " — my next answer will quote it verbatim." : "."}</p>`);
  },
};

async function sendChat(raw) {
  const text = raw.trim();
  if (!text || !S.run) return;
  addMsg("user", esc(text));
  const m = text.match(/^(\/\w+)\s*(.*)$/);
  if (m && SLASH[m[1]]) { SLASH[m[1]](m[2]); return; }
  const body = addMsg("bot", "<span class='typing'><i></i><i></i><i></i></span>");
  try {
    const ctx = S.ctxNote || currentViewContext(); S.ctxNote = null;
    const { answer, costUsd, pulled } = await api("/api/chat", { dir: S.run.dir, message: text, history: S.chatHistory, context: ctx, artifacts: S.pins || [] });
    const { text: clean, spec } = extractVisual(answer);
    body.innerHTML = withArtifactLinks(md(clean));
    if (spec) body.appendChild(renderViz(spec));
    bindCodeLinks(body);
    bindArtifactLinks(body);
    if (pulled && pulled.length) {
      // Say which raw files the answer actually rests on, and let the user open them.
      const note = el("div", "pulled-note", "read from " + pulled.map((f) => `<b>${esc(f)}</b>`).join(", "));
      note.style.cursor = "pointer";
      note.title = "Open in the Artifacts tab";
      note.addEventListener("click", () => { S.artOpen = pulled[0]; goTab("artifacts"); });
      body.appendChild(note);
    }
    S.chatHistory.push({ role: "user", content: text }, { role: "assistant", content: answer });
    if (typeof costUsd === "number") { S.chatCost += costUsd; $("#chat-cost").textContent = "session cost " + fmt$(S.chatCost); }
  } catch (e) {
    body.innerHTML = `<span style="color:var(--critical)">${esc(e.message)}</span>`;
  }
}


// ===========================================================================
// Artifacts — the run folder, browsable and pullable.
//
// Every run writes the same shape of evidence: REPORT.md, the chair-merged
// findings, each persona's step log and action trace, the screenshots, the
// JSONL event log and the cached code map. This tab makes all of it readable
// in place, and lets any of it be pinned into the chat so the analyst answers
// from the raw file instead of a summary.
// ===========================================================================

const ART_ICON = {
  report: "📋", merged: "🧾", persona: "🧭", actions: "🎬", shot: "🖼",
  codemap: "🗺", log: "📜", digest: "📦", cache: "♻️", other: "📄",
};
const ART_GROUP_ORDER = ["Report", "Findings", "Persona step logs", "Action traces", "Screenshots", "Code map", "Logs", "Bookkeeping", "Other"];
const fmtBytes = (n) => (n < 1024 ? n + " B" : n < 1024 * 1024 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB");
const artRawUrl = (file, dl) => `/artifact-raw?dir=${encodeURIComponent(S.run.dir)}&file=${encodeURIComponent(file)}${dl ? "&download=1" : ""}`;

/** Pin/unpin an artifact so the next chat turn gets its bytes verbatim. */
function togglePin(file) {
  S.pins = S.pins || [];
  const i = S.pins.indexOf(file);
  if (i >= 0) S.pins.splice(i, 1);
  else if (S.pins.length < 4) S.pins.push(file);
  else { S.pins.shift(); S.pins.push(file); }
  renderPins();
  return S.pins.includes(file);
}

function renderPins() {
  const box = $("#chat-pins");
  if (!box) return;
  box.innerHTML = "";
  for (const f of S.pins || []) {
    const chip = el("span", "pinchip", `📎 ${esc(f)}`);
    const x = el("button", "", "✕");
    x.title = "unpin";
    x.addEventListener("click", () => { togglePin(f); if (S.tab === "artifacts") renderArtifacts(); });
    chip.appendChild(x);
    box.appendChild(chip);
  }
}

/** Minimal JSON syntax colouring — enough to read a 20 KB step log at a glance. */
function highlightJson(src) {
  return esc(src).replace(
    /("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    (m) => {
      if (m.startsWith("&quot;")) return m.endsWith(":") || /&quot;\s*:$/.test(m) ? `<span class="k">${m}</span>` : `<span class="s">${m}</span>`;
      if (/^(true|false|null)$/.test(m)) return `<span class="b">${m}</span>`;
      return `<span class="n">${m}</span>`;
    }
  );
}

async function renderArtifacts() {
  const r = S.run, main = $("#main");
  main.innerHTML = "";
  if (!r) { main.appendChild(el("div", "empty", "No run selected.")); return; }
  main.appendChild(el("div", "explainer",
    `<b>Everything this run wrote.</b> A run isn't just the report — it's the chair-merged findings, each persona's step log and action trace, ` +
    `every screenshot they captured, the append-only event log and the cached code map. Open any of them here, or <b>📎 pin</b> one and the chat ` +
    `analyst answers your next question from that file verbatim instead of from a summary. The analyst can also <b>pull files on its own</b> when a ` +
    `question needs detail the digest doesn't carry — it tells you which ones it opened.`));

  const loading = el("div", "panel", "<h2>Artifacts</h2>");
  loading.appendChild(el("div", "empty", "Reading the run folder…"));
  main.appendChild(loading);
  let data = null, err = null;
  try { data = await api("/api/artifacts?dir=" + encodeURIComponent(r.dir)); }
  catch (e) { err = e.message; }
  if (!loading.isConnected) return;
  main.removeChild(loading);
  if (err || !data) { main.appendChild(el("div", "banner", "⚠ " + esc(err || "could not read the run folder"))); return; }

  const arts = data.artifacts || [];
  S.artifacts = arts;

  // --- headline ----------------------------------------------------------
  const cards = el("div", "cards");
  const shots = arts.filter((a) => a.kind === "shot");
  const personas = [...new Set(arts.filter((a) => a.persona).map((a) => a.persona))];
  const byKind = (k) => arts.filter((a) => a.kind === k).length;
  for (const [v, l] of [
    [arts.length, "Artifacts"],
    [fmtBytes(data.totalBytes || 0), "On disk"],
    [shots.length, "Screenshots"],
    [personas.length, "Personas traced"],
    [byKind("persona") + byKind("actions"), "Step + action logs"],
    [(S.pins || []).length, "Pinned for chat"],
  ]) cards.appendChild(el("div", "stat", `<div class="v" style="font-size:20px">${v}</div><div class="l">${l}</div>`));
  main.appendChild(cards);

  // --- browser + viewer --------------------------------------------------
  const layout = el("div", "art-layout");
  const listPanel = panelWith("Run folder", `${arts.length} files`);
  const filter = el("input");
  filter.placeholder = "Filter artifacts…";
  filter.value = S.artFilter || "";
  filter.style.cssText = "width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:8px 12px;font-size:12.5px;outline:none;margin-bottom:6px";
  listPanel.appendChild(filter);
  const list = el("div", "art-list");
  listPanel.appendChild(list);

  const viewPanel = panelWith("Viewer", "click an artifact on the left");
  viewPanel.classList.add("art-view");
  const viewBody = el("div");
  viewBody.appendChild(el("div", "empty", "Nothing open. Pick a file — REPORT.md is the usual starting point."));
  viewPanel.appendChild(viewBody);
  layout.append(listPanel, viewPanel);
  main.appendChild(layout);

  const paint = () => {
    const q = (S.artFilter || "").trim().toLowerCase();
    const shown = arts.filter((a) => !q || a.file.toLowerCase().includes(q) || a.label.toLowerCase().includes(q) || a.kind.includes(q));
    list.innerHTML = "";
    if (!shown.length) { list.appendChild(el("div", "empty", "No artifact matches that filter.")); return; }
    const groups = new Map();
    for (const a of shown) { if (!groups.has(a.group)) groups.set(a.group, []); groups.get(a.group).push(a); }
    const keys = [...groups.keys()].sort((a, b) => ART_GROUP_ORDER.indexOf(a) - ART_GROUP_ORDER.indexOf(b));
    for (const g of keys) {
      const items = groups.get(g);
      list.appendChild(el("div", "art-group", `${esc(g)} <span class="n">${items.length}</span>`));
      for (const a of items) {
        const pinned = (S.pins || []).includes(a.file);
        const item = el("div", "art-item" + (S.artOpen === a.file ? " on" : "") + (pinned ? " pinned" : ""),
          `<span class="ico">${ART_ICON[a.kind] || "📄"}</span>` +
          `<span><span class="nm">${esc(a.file)}</span><span class="mt">${fmtBytes(a.bytes)} · ${esc(a.kind)}${a.persona ? " · " + esc(a.persona) : ""}</span></span>` +
          (pinned ? `<span class="pin">📎</span>` : ""));
        item.title = a.label;
        item.addEventListener("click", () => { S.artOpen = a.file; paint(); openArtifact(a, viewPanel, viewBody); });
        list.appendChild(item);
        // Arriving from a link elsewhere: bring the selected file into view.
        if (S.artOpen === a.file) requestAnimationFrame(() => item.scrollIntoView({ block: "nearest" }));
      }
    }
  };
  filter.addEventListener("input", () => { S.artFilter = filter.value; paint(); });
  paint();
  if (S.artOpen) {
    const a = arts.find((x) => x.file === S.artOpen);
    if (a) openArtifact(a, viewPanel, viewBody);
    else {
      S.artOpen = null;
      viewBody.innerHTML = "";
      viewBody.appendChild(el("div", "banner", "⚠ That artifact isn't in this run — it may belong to a different run, or the run stopped before writing it."));
    }
  }
}

/** Render one artifact in the viewer pane, picking the view its type deserves. */
async function openArtifact(meta, panel, body) {
  panel.querySelector("h2").innerHTML = `Viewer<span class="hint" style="text-transform:none;letter-spacing:0;font-size:11px;opacity:.7;margin-left:10px">${esc(meta.label)}</span>`;
  body.innerHTML = "";
  const head = el("div", "art-head");
  head.innerHTML = `<span class="ico" style="font-size:18px">${ART_ICON[meta.kind] || "📄"}</span><span class="file">${esc(meta.file)}</span>` +
    `<span class="tag" style="display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--muted)">${fmtBytes(meta.bytes)}</span>` +
    `<span class="tag" style="display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--muted)">${esc(meta.kind)}</span>` +
    (meta.persona ? `<span class="tag" style="display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--goal)">${esc(meta.persona)}</span>` : "");
  body.appendChild(head);
  body.appendChild(el("div", "note", esc(meta.label) + ` · last written ${new Date(meta.mtime).toLocaleString()}`));

  // --- actions -----------------------------------------------------------
  const actions = el("div", "art-actions");
  const pinBtn = el("button", "btn" + ((S.pins || []).includes(meta.file) ? "" : " ghost"),
    (S.pins || []).includes(meta.file) ? "📎 pinned to chat" : "📎 pin to chat");
  pinBtn.title = "Pin this file so the analyst answers from its exact contents";
  pinBtn.addEventListener("click", () => {
    const on = togglePin(meta.file);
    pinBtn.className = "btn" + (on ? "" : " ghost");
    pinBtn.textContent = on ? "📎 pinned to chat" : "📎 pin to chat";
    if (S.tab === "artifacts") renderArtifacts();
  });
  const askBtn = el("button", "btn", "💬 ask about this file");
  askBtn.addEventListener("click", () => {
    if (!(S.pins || []).includes(meta.file)) togglePin(meta.file);
    askAnalyst(`Walk me through \`${meta.file}\` — what's actually in it, and what does it tell me about this run that the report doesn't?`,
      `Artifacts tab: ${meta.file} is open (${meta.kind}, ${fmtBytes(meta.bytes)}).`);
  });
  const openBtn = el("button", "btn ghost", "↗ open raw");
  openBtn.addEventListener("click", () => window.open(artRawUrl(meta.file, false), "_blank"));
  const dlBtn = el("button", "btn ghost", "⭳ download");
  dlBtn.addEventListener("click", () => { location.href = artRawUrl(meta.file, true); });
  const copyBtn = el("button", "btn ghost", "⧉ copy id");
  copyBtn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(meta.file); copyBtn.textContent = "✓ copied"; setTimeout(() => (copyBtn.textContent = "⧉ copy id"), 1400); }
    catch { copyBtn.textContent = meta.file; }
  });
  actions.append(pinBtn, askBtn, openBtn, dlBtn, copyBtn);
  body.appendChild(actions);

  // --- content -----------------------------------------------------------
  if (!meta.text) {
    const img = el("img", "art-img");
    img.src = artRawUrl(meta.file, false);
    img.alt = meta.label;
    body.appendChild(img);
    return;
  }
  const loading = el("div", "empty", "Loading…");
  body.appendChild(loading);
  let art = null, err = null;
  try { art = await api(`/api/artifact?dir=${encodeURIComponent(S.run.dir)}&file=${encodeURIComponent(meta.file)}`); }
  catch (e) { err = e.message; }
  if (!loading.isConnected) return;
  body.removeChild(loading);
  if (err || !art) { body.appendChild(el("div", "banner", "⚠ " + esc(err || "unreadable"))); return; }
  if (art.truncated) body.appendChild(el("div", "banner info", `Large file — showing the first part. Use “open raw” for all ${fmtBytes(art.bytes)}.`));
  const text = art.text || "";

  if (meta.ext === ".md") {
    const mdBox = el("div", "art-md", withArtifactLinks(md(text)));
    bindArtifactLinks(mdBox);
    body.appendChild(mdBox);
    return;
  }
  if (meta.kind === "log" || meta.ext === ".log") { body.appendChild(logViewer(text)); return; }
  if (meta.ext === ".json") {
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch { /* not valid JSON — show as-is */ }
    body.appendChild(el("div", "note", jsonShape(pretty)));
    const pre = el("pre", "art-pre");
    pre.innerHTML = highlightJson(pretty.length > 300000 ? pretty.slice(0, 300000) + "\n… [view truncated]" : pretty);
    body.appendChild(pre);
    return;
  }
  const pre = el("pre", "art-pre");
  pre.textContent = text;
  body.appendChild(pre);
}

/** One-line "what's in here" for a JSON artifact: top-level keys and array sizes. */
function jsonShape(pretty) {
  try {
    const v = JSON.parse(pretty);
    if (Array.isArray(v)) return `Array of <b>${v.length}</b> entries.`;
    const parts = Object.entries(v).slice(0, 10).map(([k, val]) =>
      `<b>${esc(k)}</b>: ${Array.isArray(val) ? `${val.length} items` : val === null ? "null" : typeof val === "object" ? `${Object.keys(val).length} keys` : typeof val}`);
    return "Top level — " + parts.join(" · ") + (Object.keys(v).length > 10 ? " · …" : "");
  } catch {
    return "";
  }
}

const LOG_COLOR = {
  phase: "var(--accent)", llm_call: "var(--goal)", persona_start: "var(--ok)", persona_done: "var(--ok)",
  finding: "var(--critical)", error: "var(--critical)", chat: "var(--minor)", chat_pull: "var(--accent2)", diff: "var(--major)",
};

/** run.log is JSONL — render it as a filterable event stream, not a wall of text. */
function logViewer(text) {
  const events = [];
  for (const line of text.split("\n")) {
    if (!line.trim()) continue;
    try { events.push(JSON.parse(line)); } catch { events.push({ ts: "", type: "unparsed", raw: line }); }
  }
  const wrap = el("div");
  const types = [...new Set(events.map((e) => e.type))].sort();
  const bar = el("div", "chips");
  const counts = el("div", "note", `<b>${events.length}</b> events${events.length ? ` · ${new Date(events[0].ts).toLocaleTimeString()} → ${new Date(events[events.length - 1].ts).toLocaleTimeString()}` : ""}`);
  let active = null;
  const rows = el("div");
  rows.style.cssText = "max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:12px;background:rgba(7,11,20,.7);margin-top:8px";
  const paint = () => {
    rows.innerHTML = "";
    for (const e of events.filter((x) => !active || x.type === active).slice(0, 600)) {
      const { ts, type, ...rest } = e;
      const row = el("div", "log-row",
        `<span class="t">${ts ? esc(String(ts).slice(11, 19)) : "—"}</span>` +
        `<span class="ty" style="color:${LOG_COLOR[type] || "var(--muted)"}">${esc(type)}</span>` +
        `<span class="d">${esc(JSON.stringify(rest))}</span>`);
      row.title = JSON.stringify(e, null, 2);
      rows.appendChild(row);
    }
  };
  for (const t of types) {
    const chip = el("span", "chip", `<span class="dot" style="background:${LOG_COLOR[t] || "var(--muted)"}"></span> ${esc(t)} · ${events.filter((e) => e.type === t).length}`);
    chip.style.cursor = "pointer";
    chip.addEventListener("click", () => {
      active = active === t ? null : t;
      bar.querySelectorAll(".chip").forEach((c) => (c.style.boxShadow = ""));
      if (active) chip.style.boxShadow = "0 0 0 1.5px var(--accent)";
      paint();
    });
    bar.appendChild(chip);
  }
  wrap.append(counts, bar, rows);
  paint();
  return wrap;
}

/** Compact "jump into the evidence" strip other tabs drop under their headline. */
function artifactStrip(files, note) {
  const known = S.artifacts || [];
  // Before the index has loaded, show everything; after, only what exists —
  // runs differ (no arch.json until the repo is mapped, partial runs, …).
  const live = known.length ? files.filter((f) => known.some((a) => a.file === f.file)) : files;
  if (!live.length) return el("span");
  const strip = el("div", "art-strip");
  for (const f of live) {
    const chip = el("span", "art-chip", `📎 <b>${esc(f.file)}</b>${f.hint ? ` · ${esc(f.hint)}` : ""}`);
    chip.title = "Open this artifact in the Artifacts tab";
    chip.addEventListener("click", () => { S.artOpen = f.file; goTab("artifacts"); });
    strip.appendChild(chip);
  }
  if (note) strip.appendChild(el("span", "art-chip", esc(note)));
  return strip;
}

let welcomeIndex = 0;
let welcomeReturnFocus = null;
let welcomeDeck = WELCOME_SLIDES;

/** Stop any playing tour before the card is torn down or navigated away from. */
function haltWelcomeVideo() {
  const v = document.querySelector("#welcome-card video");
  if (v) { try { v.pause(); } catch {} }
}

function paintWelcome() {
  haltWelcomeVideo();
  const card = $("#welcome-card");
  const slide = welcomeDeck[welcomeIndex];
  card.innerHTML = `<span class="emoji">${slide.emoji}</span>
    <h2 id="welcome-title">${esc(slide.title)}</h2>
    <p class="lede">${slide.lede}</p>`;
  const body = slide.body();
  if (body) card.appendChild(body);

  const nav = el("div", "wnav");
  const first = welcomeIndex === 0;
  const back = el("button", "btn ghost", first ? "Skip" : "Back");
  back.type = "button";
  back.addEventListener("click", () => {
    if (first) return closeWelcome();
    welcomeIndex -= 1;
    paintWelcome();
  });

  const dots = el("div", "wdots");
  welcomeDeck.forEach((_, i) => {
    const dot = el("i", i === welcomeIndex ? "on" : "");
    dot.setAttribute("role", "presentation");
    dots.appendChild(dot);
  });

  const last = welcomeIndex === welcomeDeck.length - 1;
  const next = el("button", "btn", last ? "Let's go" : "Next");
  next.type = "button";
  next.addEventListener("click", () => {
    if (last) return closeWelcome();
    welcomeIndex += 1;
    paintWelcome();
  });

  nav.append(back, dots, next);
  card.appendChild(nav);

  next.focus();
}

function openWelcome() {
  // Readiness tells us whether a tour is installed; without one the deck is
  // exactly what it was before, so nothing here can break on a lean install.
  welcomeDeck = S.setup && S.setup.demoVideo ? [VIDEO_SLIDE, ...WELCOME_SLIDES] : WELCOME_SLIDES;
  welcomeIndex = 0;
  welcomeReturnFocus = document.activeElement;
  const box = $("#welcome");
  box.classList.add("open");
  box.setAttribute("aria-hidden", "false");
  paintWelcome();
}

function closeWelcome() {
  haltWelcomeVideo();
  const box = $("#welcome");
  box.classList.remove("open");
  box.setAttribute("aria-hidden", "true");
  markWelcomeSeen();
  if (welcomeReturnFocus && welcomeReturnFocus.isConnected) welcomeReturnFocus.focus();
  welcomeReturnFocus = null;
}

function wireWelcome() {
  const box = $("#welcome");
  // Clicking the backdrop (not the card) dismisses — the usual expectation.
  box.addEventListener("click", (e) => { if (e.target === box) closeWelcome(); });
  document.addEventListener("keydown", (e) => {
    if (!box.classList.contains("open")) return;
    if (e.key === "Escape") { e.preventDefault(); closeWelcome(); }
    if (e.key === "ArrowRight" && welcomeIndex < welcomeDeck.length - 1) { welcomeIndex += 1; paintWelcome(); }
    if (e.key === "ArrowLeft" && welcomeIndex > 0) { welcomeIndex -= 1; paintWelcome(); }
    // Keep focus inside the dialog, but CYCLE it — blocking Tab outright
    // stranded keyboard users on whichever control happened to be focused.
    if (e.key === "Tab") {
      const focusable = [...box.querySelectorAll("button, video, [href], input, [tabindex]:not([tabindex='-1'])")]
        .filter((n) => !n.disabled && n.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      const at = focusable.indexOf(document.activeElement);
      if (e.shiftKey && (at <= 0)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && at === focusable.length - 1) { e.preventDefault(); first.focus(); }
      // anything in between is a normal Tab — let the browser do it
    }
  });
}

// ---------------------------------------------------------------- start ---
// The front door. Three states, chosen from real readiness rather than from a
// wizard step counter: Setup (something is missing), Launch (ready to run),
// Running (a run is in flight). Nothing here costs a token except pressing
// Start — and "Test key", which says its own price first.

let ES = null; // live EventSource, or null

const fmtClock = (s) => {
  if (s == null || !isFinite(s)) return "—";
  const m = Math.floor(s / 60);
  return m > 0 ? `${m}m ${String(Math.round(s % 60)).padStart(2, "0")}s` : `${Math.round(s)}s`;
};

async function loadSetup() {
  try { S.setup = await api("/api/setup"); } catch (e) { S.setup = { error: e.message, checks: [], ready: false }; }
}

async function renderStart() {
  const main = $("#main");
  main.innerHTML = "";
  const wrap = el("div", "start-wrap");
  main.appendChild(wrap);

  if (!S.setup) {
    wrap.appendChild(el("div", "empty", "Checking what's ready…"));
    await loadSetup();
    // A run may already be in flight from a previous page load.
    try { const st = await api("/api/run/status"); if (st.active) S.activeRun = st.run; } catch {}
    return renderStart();
  }

  if (S.activeRun && ["starting", "running"].includes(S.activeRun.state)) return runningView(wrap);
  if (!S.setup.ready) return setupView(wrap);
  return launchView(wrap);
}

function checkRow(c) {
  const row = el("div", "check " + (c.ok ? "ok" : c.blocking ? "bad" : "warn"));
  row.appendChild(el("div", "mark", c.ok ? "✓" : c.blocking ? "!" : "·"));
  const body = el("div", "body");
  body.appendChild(el("div", "", `<b>${esc(c.label)}</b>`));
  body.appendChild(el("div", "detail", esc(c.detail)));
  if (!c.ok && c.fixCommand) {
    const fix = el("div", "fixcmd", `<code>${esc(c.fixCommand)}</code>`);
    const copy = el("button", "btn ghost", "Copy");
    copy.type = "button";
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(c.fixCommand); copy.textContent = "Copied"; }
      catch { copy.textContent = "Select it"; }
      setTimeout(() => { copy.textContent = "Copy"; }, 1600);
    });
    fix.appendChild(copy);
    body.appendChild(fix);
  }
  row.appendChild(body);
  return row;
}

  manual.querySelector("input").addEventListener("change", (ev) => {
    S.launch.target = ev.target.value.trim();
    srvBox.querySelectorAll(".srv").forEach((n) => n.classList.remove("sel"));
    refreshEstimate();
  });
  wrap.appendChild(targetPanel);

  async function probe() {
    srvBox.innerHTML = "";
    srvBox.appendChild(el("div", "empty", "Looking for a dev server…"));
    let servers = [];
    try { servers = (await api("/api/probe")).servers || []; } catch {}
    S.launch.servers = servers;
    srvBox.innerHTML = "";
    if (!servers.length) {
      // The single most common first-run failure. Name it, don't show a void.
      srvBox.appendChild(el("div", "banner", "🔍 Nothing's running on the usual ports yet. Your testers need a <b>live</b> app to click around in — start it up (usually <code>npm run dev</code>) and hit re-probe."));
    }
    for (const sv of servers) {
      const row = el("div", "srv" + (S.launch.target === sv.url ? " sel" : ""));
      row.innerHTML = `<span class="port">:${sv.port}</span><span class="ttl">${esc(sv.title || sv.hint || "no title")}</span>`;
      makeInteractive(row, `Test the app on port ${sv.port}`, () => {
        S.launch.target = sv.url;
        manual.querySelector("input").value = sv.url;
        srvBox.querySelectorAll(".srv").forEach((n) => n.classList.remove("sel"));
        row.classList.add("sel");
        paintChoices();
        refreshEstimate();
      });
      srvBox.appendChild(row);
    }
    const again = el("button", "btn ghost", "Re-probe");
    again.type = "button";
    again.addEventListener("click", probe);
    srvBox.appendChild(again);
  }
  probe();

  // 3. estimate + start
  const goPanel = el("div", "panel", "<h2>3 · How deep a look?</h2>");
  const presets = el("div", "presets");
  const whoWrap = el("div", "field", `<label>Who should test it?</label>`);
  const who = el("div", "who");
  whoWrap.appendChild(who);
  const estBox = el("div", "");
  goPanel.append(presets, whoWrap, estBox);

  // "Steps per persona" is a number only the author understands. People choose
  // between a cheap look and a thorough one, so offer that instead and let the
  // price for each be visible before either is picked.
  const PRESETS = [
    { id: "quick", name: "⚡ Quick pass", steps: 4, desc: "A fast sanity check. Each tester takes a handful of actions — enough to surface the obvious breakage." },
    { id: "full", name: "🔍 Full run", steps: null, desc: "The real thing. Every tester explores properly and the chair verifies each finding by replaying it." },
  ];
  // A newcomer should meet the cheap number first — and the selected card and
  // the priced run must never disagree, so steps is derived from the preset,
  // never set independently of it.
  const applyPreset = (id) => {
    const p = PRESETS.find((x) => x.id === id) || PRESETS[0];
    S.launch.preset = p.id;
    S.launch.steps = p.steps;
  };
  if (!S.launch.preset) applyPreset("quick");
  else applyPreset(S.launch.preset); // re-entering the tab must not drift either

  async function priceOf(presetId, persona) {
    const p = PRESETS.find((x) => x.id === presetId);
    const q = new URLSearchParams({ repo: S.launch.dir, target: S.launch.target });
    if (p.steps) q.set("steps", String(p.steps));
    if (persona) q.set("persona", persona);
    try { return await api("/api/estimate?" + q.toString()); } catch { return null; }
  }

  async function paintChoices() {
    if (!S.launch.dir || !S.launch.target) { presets.innerHTML = ""; who.innerHTML = ""; return; }
    const quoted = await Promise.all(PRESETS.map((p) => priceOf(p.id, S.launch.persona)));

    presets.innerHTML = "";
    PRESETS.forEach((p, i) => {
      const q = quoted[i];
      const card = el("button", "preset" + (S.launch.preset === p.id ? " on" : ""));
      card.type = "button";
      card.setAttribute("aria-pressed", String(S.launch.preset === p.id));
      card.innerHTML = `<div class="nm">${p.name}<span class="cost">${q ? "~$" + q.costUsd.toFixed(2) : "—"}</span></div>
        <div class="desc">${esc(p.desc)}${q && q.eta ? ` · about ${esc(q.eta.replace("~", ""))}` : ""}</div>`;
      card.addEventListener("click", () => {
        applyPreset(p.id);
        paintChoices();
        refreshEstimate();
      });
      presets.appendChild(card);
    });

    const all = (quoted.find(Boolean) || {}).allTesters || [];
    who.innerHTML = "";
    const mk = (label, persona) => {
      const b = el("button", S.launch.persona === persona ? "on" : "");
      b.type = "button";
      b.textContent = label;
      b.setAttribute("aria-pressed", String(S.launch.persona === persona));
      b.addEventListener("click", () => {
        S.launch.persona = persona;
        paintChoices();
        refreshEstimate();
      });
      return b;
    };
    who.appendChild(mk(`All ${all.length} testers`, null));
    for (const p of all) who.appendChild(mk(p, p));
    who.appendChild(el("div", "hint", S.launch.persona
      ? `Just ${esc(S.launch.persona)} — the cheapest way to see what a run looks like.`
      : "Each tester looks for different problems, so together they cover more ground."));
  }
  const goStatus = el("div", "hint", "");
  const goRow = el("div", "row");
  const go = el("button", "btn", "Start the run");
  go.type = "button";
  go.disabled = true;
  goRow.append(go, goStatus);
  goPanel.appendChild(goRow);
  wrap.appendChild(goPanel);

  async function refreshEstimate() {
    const { dir, target, steps } = S.launch;
    if (!presets.children.length && dir && target) paintChoices();
    go.disabled = true;
    if (!dir || !target) {
      estBox.innerHTML = "";
      estBox.appendChild(el("div", "empty", "Pick a folder and a running app to see the estimate."));
      return;
    }
    estBox.innerHTML = "";
    estBox.appendChild(el("div", "empty", "Estimating…"));
    let est;
    try {
      const q = new URLSearchParams({ repo: dir, target });
      if (steps) q.set("steps", String(steps));
      if (S.launch.persona) q.set("persona", S.launch.persona);
      est = await api("/api/estimate?" + q.toString());
    } catch (e) {
      estBox.innerHTML = "";
      estBox.appendChild(el("div", "banner", esc(e.message)));
      return;
    }
    S.launch.estimate = est;
    estBox.innerHTML = "";
    const grid = el("div", "estimate");
    grid.innerHTML = `
      <div><div class="k">Cost</div><div class="v">~$${est.costUsd.toFixed(2)}</div></div>
      <div><div class="k">Time</div><div class="v">${est.eta ? esc(est.eta.replace("~", "")) : "unknown"}</div></div>
      <div><div class="k">LLM calls</div><div class="v">~${est.calls}</div></div>
      <div><div class="k">Personas</div><div class="v">${est.testers.length}</div></div>
      <div><div class="k">Model</div><div class="v" style="font-size:13px">${esc(est.model)}</div></div>`;
    estBox.appendChild(grid);
    if (!est.eta) estBox.appendChild(el("div", "hint", "No run history yet, so the time estimate is blank — this run will teach it."));
    if (est.exceedsCostCap) {
      estBox.appendChild(el("div", "banner", `This estimate is over your <code>max_cost_usd</code> cap of $${est.caps.maxCostUsd.toFixed(2)} — the run will stop early when the cap is hit.`));
    }
    go.disabled = false;
    go.textContent = `Start the run · ~$${est.costUsd.toFixed(2)}`;
  }
  refreshEstimate();

  go.addEventListener("click", async () => {
    const est = S.launch.estimate;
    if (!est) return;
    go.disabled = true;
    goStatus.textContent = "Checking the app is reachable…";
    try {
      const { run } = await api("/api/run/start", {
        target: S.launch.target,
        repoPath: S.launch.dir,
        steps: S.launch.steps ?? undefined,
        persona: S.launch.persona ?? undefined,
        confirmCostUsd: est.costUsd, // the server refuses to start without this
      });
      S.activeRun = run;
      S.feed = [];
      render();
    } catch (e) {
      goStatus.textContent = e.message;
      go.disabled = false;
    }
  });
}

// -- Running ----------------------------------------------------------------

function feedRow(e) {
  const time = String(e.ts || "").slice(11, 19);
  let cls = "ev", text;
  if (e.type === "log") { text = e.line; if (e.level === "error") cls += " error"; }
  else if (e.type === "phase") { cls += " phase"; text = `phase: ${e.phase}`; }
  else if (e.type === "persona_start") { cls += " persona"; text = `${e.persona} started`; }
  else if (e.type === "persona_end") { cls += " persona"; text = `${e.persona} finished — ${e.steps ?? "?"} steps, ${e.findings ?? 0} findings`; }
  else if (e.type === "finding") { cls += " finding"; text = `finding: ${e.title || e.code || ""}`; }
  else if (e.type === "error") { cls += " error"; text = `error: ${e.error || ""}`; }
  else if (e.type === "llm_call" || e.type === "eta" || e.type === "run_dir" || e.type === "launch") return null;
  else text = e.type;
  const row = el("div", cls);
  row.innerHTML = `<span class="t">${esc(time)}</span><span>${esc(text || "")}</span>`;
  return row;
}

function runningView(wrap) {
  wrap.appendChild(el("div", "start-hero", `<span class="emoji">🔬</span>
    <h2>They're in there now</h2>
    <p>Your crew is clicking through <code>${esc(S.activeRun.target)}</code> in a real browser. Feel free to wander off — the run keeps going without you.</p>`));

  const p = el("div", "panel", "<h2>Live</h2>");
  const bar = el("div", "progress indet", "<i></i>");
  const stats = el("div", "estimate");
  const feed = el("div", "feed");
  p.append(stats, bar, feed);

  const row = el("div", "row");
  row.style.marginTop = "12px";
  const cancel = el("button", "btn danger", "Cancel run");
  cancel.type = "button";
  cancel.addEventListener("click", async () => {
    cancel.disabled = true;
    try { await api("/api/run/cancel", {}); } catch (e) { row.appendChild(el("span", "hint", esc(e.message))); }
  });
  row.appendChild(cancel);
  p.appendChild(row);
  wrap.appendChild(p);

  // Derived readouts, recomputed from the events we have rather than tracked
  // in parallel state — a refresh mid-run replays the backlog and lands here.
  const paint = () => {
    let personasTotal = 0, personasDone = 0, cost = 0, findings = 0, phase = "starting up";
    for (const e of S.feed) {
      if (e.type === "phase" && e.phase === "start") personasTotal = e.testers || 0;
      if (e.type === "phase") phase = e.phase === "done" ? "done" : e.phase === "chair" ? "chair: ranking + verifying" : e.phase;
      if (e.type === "persona_start") phase = `testing as ${e.persona}`;
      if (e.type === "persona_end") personasDone += 1;
      if (e.type === "llm_call") cost += e.cost_usd || 0;
      if (e.type === "finding") findings += 1;
    }
    const elapsed = (Date.now() - Date.parse(S.activeRun.startedAt)) / 1000;
    stats.innerHTML = `
      <div><div class="k">Phase</div><div class="v" style="font-size:13px">${esc(phase)}</div></div>
      <div><div class="k">Personas</div><div class="v">${personasDone}${personasTotal ? " / " + personasTotal : ""}</div></div>
      <div><div class="k">Findings</div><div class="v">${findings}</div></div>
      <div><div class="k">Spent</div><div class="v">$${cost.toFixed(2)}</div></div>
      <div><div class="k">Elapsed</div><div class="v">${fmtClock(elapsed)}</div></div>`;
    if (personasTotal) {
      bar.classList.remove("indet");
      bar.querySelector("i").style.width = Math.round((personasDone / personasTotal) * 100) + "%";
    }
  };

  const append = (e) => {
    const row = feedRow(e);
    if (!row) return;
    const stuck = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
    feed.appendChild(row);
    if (stuck) feed.scrollTop = feed.scrollHeight; // follow unless the user scrolled up
  };

  for (const e of S.feed) append(e);
  paint();
  const ticker = setInterval(paint, 1000);

  attachFeed({
    onEvent: (e) => { S.feed.push(e); append(e); paint(); },
    onEnd: (info) => {
      clearInterval(ticker);
      cancel.disabled = true;
      bar.classList.remove("indet");
      bar.querySelector("i").style.width = "100%";
      const done = el("div", "banner" + (info.state === "done" ? " info" : ""));
      done.innerHTML = info.state === "done"
        ? "Run finished."
        : info.state === "cancelled"
          ? "Run cancelled. Any findings recorded before the stop were kept."
          : `Run failed: ${esc(info.error || "unknown error")}`;
      if (info.runDir) {
        const open = el("button", "btn", "Open the report");
        open.type = "button";
        open.style.marginLeft = "10px";
        open.addEventListener("click", async () => {
          S.activeRun = null;
          const { runs } = await api("/api/runs");
          S.runs = runs;
          const sel = $("#run-select");
          sel.innerHTML = "";
          for (const r of runs) sel.appendChild(el("option", "", r.dir + "  —  " + targetLabel(r.target))).value = r.dir;
          S.takeover = false;
          applyTakeover();
          S.tab = "project";
          await selectRun(info.runDir);
        });
        done.appendChild(open);
      }
      p.insertBefore(done, stats);
    },
  });
}

/** One EventSource for the page. Reconnects are the browser's job. */
function attachFeed(handlers) {
  if (ES) { ES.close(); ES = null; }
  const since = S.feed.length ? S.feed[S.feed.length - 1].seq : 0;
  ES = new EventSource("/api/run/events?since=" + since);
  ES.addEventListener("launch_end", (ev) => {
    const info = JSON.parse(ev.data);
    if (S.activeRun) S.activeRun.state = info.state;
    handlers.onEnd(info);
    if (ES) { ES.close(); ES = null; }
  });
  ES.onmessage = (ev) => { try { handlers.onEvent(JSON.parse(ev.data)); } catch {} };
  // Named events don't reach onmessage, so every relayed run.log type needs one.
  for (const t of ["log", "phase", "persona_start", "persona_end", "finding", "error", "llm_call", "eta", "diff", "run_dir", "launch", "mapd", "budget"]) {
    ES.addEventListener(t, (ev) => { try { handlers.onEvent(JSON.parse(ev.data)); } catch {} });
  }
}

/** Hide the tab bar and the run picker while the tool isn't usable yet. */
function applyTakeover() {
  const nav = document.querySelector(".tabs");
  const sel = $("#run-select");
  if (nav) nav.style.display = S.takeover ? "none" : "";
  if (sel) sel.style.display = S.takeover ? "none" : "";
  const fab = $("#chat-fab");
  if (fab) fab.style.display = S.takeover ? "none" : "";
}

// ----------------------------------------------------------------- init ---
function render() {
  const main = $("#main");
  if (main) main.classList.toggle("visual-main", S.tab === "visual");
  const renderer = ({ start: renderStart, project: renderProject, overview: renderOverview, journey: renderJourney, mindmap: renderMindMap, architecture: renderArchitecture, findings: renderFindings, artifacts: renderArtifacts, history: renderHistory, visual: renderVisual })[S.tab] || renderProject;
  renderer();
}

async function selectRun(dir) {
  try {
    S.run = await api("/api/run?dir=" + encodeURIComponent(dir));
    S.chatHistory = [];
    S.pins = []; S.artifacts = []; S.artOpen = null; renderPins();
    // Prefetch the folder index: the strips on other tabs and /pin need it
    // before the Artifacts tab has ever been opened.
    api("/api/artifacts?dir=" + encodeURIComponent(dir))
      .then((d) => { S.artifacts = d.artifacts || []; if (S.tab !== "artifacts") render(); })
      .catch(() => { S.artifacts = []; });
    $("#chat-sub").textContent = "run " + S.run.dir;
    const ctxEl = $("#chat-ctx");
    if (ctxEl) ctxEl.textContent = `viewing: ${S.tab} · ${targetLabel(S.run.target)} · run ${S.run.dir.slice(0, 19).replace("T", " ")}`;
    renderSugg();
    $("#run-select").value = dir;
    const params = new URLSearchParams(location.search);
    params.set("run", dir);
    params.set("tab", S.tab);
    history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
    render();
  } catch (e) {
    $("#main").innerHTML = "";
    $("#main").appendChild(el("div", "banner", esc(e.message)));
  }
}

async function init() {
  const urlParams = new URLSearchParams(location.search);
  const repoParam = urlParams.get("repo");
  if (repoParam) S.archRepo = repoParam;
  document.querySelectorAll(".tabs button").forEach((b) => {
    const active = b.dataset.tab === S.tab;
    b.classList.toggle("active", active);
    b.setAttribute("aria-selected", String(active));
  });
  document.querySelectorAll(".tabs button").forEach((b) =>
    b.addEventListener("click", () => {
      goTab(b.dataset.tab);
    })
  );
  const { runs, initialRun } = await api("/api/runs");
  S.runs = runs;

  // Landing state. A first-time user with no key and no runs must not be
  // dropped onto an empty dashboard — the Start screen takes the page over
  // until the tool can actually do something, then demotes to a normal tab.
  await loadSetup();
  try {
    const st = await api("/api/run/status");
    if (st.active) S.activeRun = st.run;
  } catch { /* older server or transient — the Start screen still works */ }
  S.takeover = !S.setup.ready || runs.length === 0 || Boolean(S.activeRun);
  if (S.takeover || !TABS.includes(requestedTab)) {
    if (S.takeover) S.tab = "start";
  }
  applyTakeover();
  wireWelcome();
  // First visit in this browser: explain what this thing is before asking for
  // an API key. Never blocks — it is one dismissal away.
  if (!seenWelcome()) openWelcome();
  document.querySelectorAll(".tabs button").forEach((b) => {
    const active = b.dataset.tab === S.tab;
    b.classList.toggle("active", active);
    b.setAttribute("aria-selected", String(active));
  });
  const sel = $("#run-select");
  for (const r of runs) sel.appendChild(el("option", "", r.dir + "  —  " + targetLabel(r.target) + (r.critical ? ` (${r.critical} critical)` : ""))).value = r.dir;
  sel.addEventListener("change", () => selectRun(sel.value));
  if (runs.length && S.tab !== "start") {
    const fromUrl = new URLSearchParams(location.search).get("run");
    const pick = runs.some((r) => r.dir === fromUrl) ? fromUrl : initialRun || runs[0].dir;
    await selectRun(pick);
  } else {
    if (runs.length) {
      // Keep the run loaded behind the Start screen so leaving it is instant.
      const fromUrl = new URLSearchParams(location.search).get("run");
      const pick = runs.some((r) => r.dir === fromUrl) ? fromUrl : initialRun || runs[0].dir;
      api("/api/run?dir=" + encodeURIComponent(pick)).then((r) => { S.run = r; $("#run-select").value = pick; }).catch(() => {});
    }
    render();
  }

  const setChatOpen = (open) => {
    $("#chat-drawer").classList.toggle("open", open);
    $("#chat-drawer").setAttribute("aria-hidden", String(!open));
    $("#chat-fab").setAttribute("aria-expanded", String(open));
    if (open) $("#chat-field").focus(); else $("#chat-fab").focus();
  };
  $("#chat-fab").addEventListener("click", () => setChatOpen(!$("#chat-drawer").classList.contains("open")));
  $("#chat-close").addEventListener("click", () => setChatOpen(false));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("#chat-drawer").classList.contains("open")) setChatOpen(false);
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setChatOpen(!$("#chat-drawer").classList.contains("open")); }
  });
  $("#chat-send").addEventListener("click", () => { const f = $("#chat-field"); sendChat(f.value); f.value = ""; });
  $("#chat-field").addEventListener("keydown", (e) => { if (e.key === "Enter") { sendChat(e.target.value); e.target.value = ""; } });
}

init().catch((e) => {
  document.body.innerHTML = `<div class="empty">Dashboard failed to load: ${esc(e.message)}</div>`;
});
</script>
</body>
</html>
