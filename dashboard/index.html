<html lang="en">
<head>
<meta charset="utf-8">
<title>User-Tests Dashboard</title>

<style>
:root{
  --bg:#070b14; --panel:rgba(18,24,40,.72); --panel2:rgba(28,36,58,.75);
  --border:rgba(120,150,255,.14); --border-hi:rgba(140,170,255,.35);
  --text:#eef2ff; --muted:#8b96b8; --accent:#6ea8ff; --accent2:#9a6eff;
  --ok:#3fd68f; --critical:#ff5d73; --major:#ffa14d; --minor:#ffd166; --goal:#c99aff;
  --glow-c:0 0 24px rgba(255,93,115,.35); --glow-a:0 0 24px rgba(110,168,255,.30);
  --shadow:0 18px 50px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
}
*{box-sizing:border-box}
html{scrollbar-color:#2a3554 transparent}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;overflow-x:hidden}
.skip-link{position:fixed;left:12px;top:8px;z-index:100;transform:translateY(-160%);background:var(--text);color:var(--bg);padding:8px 12px;border-radius:8px;font-weight:700;text-decoration:none}
.skip-link:focus{transform:none}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
:where(button,input,select,[role="button"],a):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* aurora backdrop */
body::before{content:"";position:fixed;inset:-20%;z-index:-2;background:
  radial-gradient(38% 42% at 18% 12%, rgba(110,168,255,.16), transparent 70%),
  radial-gradient(34% 38% at 82% 18%, rgba(154,110,255,.14), transparent 70%),
  radial-gradient(46% 46% at 55% 92%, rgba(63,214,143,.09), transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:
  linear-gradient(rgba(140,170,255,.045) 1px, transparent 1px),
  linear-gradient(90deg, rgba(140,170,255,.045) 1px, transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(75% 65% at 50% 32%, #000 30%, transparent 100%)}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.06)}}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--border);
  background:rgba(10,14,26,.65);backdrop-filter:blur(18px) saturate(1.4);position:sticky;top:0;z-index:10}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.4px;white-space:nowrap;flex:none}
header .logo{color:var(--accent);filter:drop-shadow(0 0 8px rgba(110,168,255,.8));display:inline-block;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:13px;max-width:360px;outline:none;transition:border-color .2s, box-shadow .2s}
select:focus{border-color:var(--accent);box-shadow:var(--glow-a)}
.tabs{display:flex;gap:4px;margin-left:auto;background:rgba(28,36,58,.5);border:1px solid var(--border);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none;flex:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
@media(max-width:1100px){header{flex-wrap:wrap}.tabs{margin-left:0;order:3;width:100%}}
.tabs button{background:none;border:none;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;transition:all .22s cubic-bezier(.2,.8,.3,1)}
.tabs button.active{background:linear-gradient(135deg, rgba(110,168,255,.25), rgba(154,110,255,.22));color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 4px 14px rgba(80,120,255,.25)}
.tabs button:not(.active):hover{color:var(--text);transform:translateY(-1px)}
main{padding:22px;max-width:1320px;margin:0 auto;animation:pageIn .45s cubic-bezier(.2,.8,.3,1)}
@media(max-width:560px){header{padding:11px 18px;gap:10px}header h1{width:100%}select{max-width:100%;width:100%}main{padding:18px}.hero-panel{padding:22px 26px}.hero-title{font-size:29px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px;
  backdrop-filter:blur(14px);box-shadow:var(--shadow);transition:border-color .25s}
.panel:hover{border-color:var(--border-hi)}
.panel h2{margin:0 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{background:linear-gradient(160deg, rgba(32,42,68,.85), rgba(20,26,44,.85));border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 8px 22px rgba(0,0,0,.35);
  transition:transform .25s cubic-bezier(.2,.8,.3,1), box-shadow .25s;transform-style:preserve-3d}
.stat:hover{transform:translateY(-3px) rotateX(4deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 16px 34px rgba(0,0,0,.5), var(--glow-a)}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#fff,#a9c3ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.banner{border:1px solid rgba(255,161,77,.5);background:linear-gradient(120deg, rgba(255,161,77,.12), rgba(255,93,115,.08));
  color:var(--major);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13px;box-shadow:0 0 20px rgba(255,161,77,.12)}
.banner.info{border-color:rgba(110,168,255,.5);background:linear-gradient(120deg, rgba(110,168,255,.14), rgba(154,110,255,.10));color:var(--accent);box-shadow:0 0 20px rgba(110,168,255,.12)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:1px}
tr.clickable{cursor:pointer;transition:background .15s}
tr.clickable:hover td{background:rgba(110,168,255,.07)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid;letter-spacing:.3px}
.pill.critical{color:var(--critical);border-color:rgba(255,93,115,.6);box-shadow:0 0 12px rgba(255,93,115,.25)}
.pill.major{color:var(--major);border-color:rgba(255,161,77,.55);box-shadow:0 0 10px rgba(255,161,77,.18)}
.pill.minor{color:var(--minor);border-color:rgba(255,209,102,.5)}
.pill.goal{color:var(--goal);border-color:rgba(201,154,255,.55);box-shadow:0 0 10px rgba(201,154,255,.2)}
.pill.appendix{color:var(--muted);border-color:var(--border)}
.pill.ok{color:var(--ok);border-color:rgba(63,214,143,.55);box-shadow:0 0 10px rgba(63,214,143,.2)}
.finding-card{position:relative;background:linear-gradient(155deg, rgba(32,42,68,.85), rgba(18,24,42,.9));
  border:1px solid var(--border);border-left:4px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 10px 26px rgba(0,0,0,.4);
  transition:transform .25s cubic-bezier(.2,.8,.3,1), box-shadow .25s, border-color .25s}
.finding-card:hover{transform:translateY(-3px);border-color:var(--border-hi)}
.finding-card.critical{border-left-color:var(--critical);box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 10px 26px rgba(0,0,0,.4), var(--glow-c)}
.finding-card.major{border-left-color:var(--major)}
.finding-card.minor{border-left-color:var(--minor)}
.finding-card.goal-gap{border-left-color:var(--goal)}
.finding-card.appendix{border-left-color:var(--muted)}
.finding-card h3{margin:0 0 8px;font-size:15.5px;line-height:1.4}
.finding-card .meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.finding-card img{max-width:440px;width:100%;border:1px solid var(--border);border-radius:10px;margin:10px 0;display:block;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.finding-card ol{margin:8px 0;padding-left:20px;color:var(--muted)}
.finding-card .expact{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:13px}
.finding-card .expact b{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px}
button.btn{background:linear-gradient(135deg, var(--accent), var(--accent2));color:#fff;border:none;border-radius:10px;
  padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.3px;cursor:pointer;
  box-shadow:0 6px 18px rgba(110,140,255,.35), inset 0 1px 0 rgba(255,255,255,.25);transition:transform .18s, box-shadow .18s, filter .18s}
button.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(110,140,255,.5), inset 0 1px 0 rgba(255,255,255,.3);filter:brightness(1.08)}
button.btn:active{transform:translateY(0)}
button.btn:disabled{opacity:.55;cursor:default;transform:none}
.explain{margin-top:12px;padding:12px 14px;background:rgba(7,11,20,.75);border:1px solid var(--border-hi);border-radius:12px;font-size:13px;animation:pageIn .3s ease}
.explain .md p{margin:7px 0}
.explain .md code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12px}
.explain .md pre{background:var(--panel2);padding:10px;border-radius:8px;overflow-x:auto}
.explain .md ul,.explain .md ol{margin:7px 0;padding-left:20px}
/* welcome: the one-time "what is this?" walkthrough */
#welcome{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(4,7,14,.82);backdrop-filter:blur(14px) saturate(1.2)}
#welcome.open{display:flex;animation:wFade .28s ease}
@keyframes wFade{from{opacity:0}to{opacity:1}}
.wcard{width:min(760px,100%);max-height:92vh;overflow-y:auto;background:linear-gradient(165deg, rgba(30,38,64,.92), rgba(16,21,38,.94));
  border:1px solid var(--border-hi);border-radius:26px;padding:34px 34px 24px;text-align:center;
  box-shadow:0 30px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);animation:wPop .42s cubic-bezier(.2,1.1,.35,1)}
@keyframes wPop{from{transform:translateY(22px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.wcard .emoji{font-size:52px;line-height:1;display:block;margin-bottom:14px;animation:wBob 3.2s ease-in-out infinite}
@keyframes wBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.wcard h2{font-size:26px;margin:0 0 10px;font-weight:800;letter-spacing:-.3px;text-transform:none;color:var(--text)}
.wcard .lede{color:var(--muted);font-size:15px;line-height:1.65;margin:0 auto 20px;max-width:470px}
.wcard .lede b{color:var(--text)}
.wcrew{display:grid;grid-template-columns:1fr 1fr;gap:11px;text-align:left;margin-bottom:6px}
@media (max-width:520px){.wcrew{grid-template-columns:1fr}}
.wperson{background:rgba(7,11,20,.5);border:1px solid var(--border);border-radius:18px;padding:13px 15px;
  transition:transform .25s cubic-bezier(.2,1.1,.35,1), border-color .25s}
.wperson:hover{transform:translateY(-3px);border-color:var(--border-hi)}
.wperson .who{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.wperson .who .e{font-size:17px}
.wperson .what{color:var(--muted);font-size:12.5px;line-height:1.5}
.wfacts{display:grid;gap:11px;text-align:left;margin-bottom:6px}
.wfact{display:flex;gap:13px;align-items:flex-start;background:rgba(7,11,20,.5);border:1px solid var(--border);border-radius:18px;padding:14px 16px}
.wfact .e{font-size:24px;line-height:1.2;flex:none}
.wfact b{display:block;font-size:13.5px;margin-bottom:3px}
.wfact span{color:var(--muted);font-size:12.5px;line-height:1.55}
.wvideo{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--border-hi);
  background:#05070d;box-shadow:0 18px 50px rgba(0,0,0,.55);margin-bottom:4px}
.wvideo video{display:block;width:100%;height:auto;background:#05070d}
.wvideo .play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  cursor:pointer;background:radial-gradient(58% 58% at 50% 50%, rgba(6,9,17,.30), rgba(4,7,14,.62));
  transition:opacity .45s ease;border:none;color:var(--text);font:inherit;width:100%}
.wvideo .play .disc{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:26px;padding-left:5px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 12px 34px rgba(110,140,255,.55), inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .3s cubic-bezier(.2,1.1,.35,1)}
.wvideo .play:hover .disc{transform:scale(1.09)}
.wvideo .play span{font-size:12.5px;color:var(--muted);letter-spacing:.3px}
.wvideo.playing .play{opacity:0;pointer-events:none}
.wnav{display:flex;align-items:center;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.wdots{display:flex;gap:7px;margin:0 auto}
.wdots i{width:8px;height:8px;border-radius:50%;background:var(--border-hi);transition:all .3s cubic-bezier(.2,1.1,.35,1)}
.wdots i.on{background:linear-gradient(135deg,var(--accent),var(--accent2));width:24px;border-radius:999px;box-shadow:0 0 12px rgba(110,168,255,.5)}
/* start: setup / launch / live run */
.start-wrap{max-width:880px;margin:0 auto}
.start-wrap .panel{border-radius:24px;padding:24px 26px}
.start-wrap .panel h2{font-size:12.5px;letter-spacing:1.4px;color:var(--accent);opacity:.9}
.start-hero{text-align:center;padding:30px 18px 10px}
.start-hero .emoji{font-size:46px;line-height:1;display:block;margin-bottom:12px;animation:wBob 3.6s ease-in-out infinite}
.start-hero h2{font-size:27px;margin:0 0 10px;letter-spacing:-.4px;text-transform:none;color:var(--text);font-weight:800}
.start-hero p{color:var(--muted);margin:0 auto;max-width:540px;font-size:14.5px;line-height:1.65}
.start-hero .howbtn{margin-top:14px}
.check{display:flex;gap:14px;align-items:flex-start;padding:13px;border-radius:16px;margin-bottom:6px;
  background:rgba(7,11,20,.34);border:1px solid transparent;transition:border-color .25s, transform .25s cubic-bezier(.2,1.1,.35,1)}
.check:hover{border-color:var(--border);transform:translateX(2px)}
.check:last-child{margin-bottom:0}
.check .mark{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.check.ok .mark{color:var(--ok);background:rgba(63,214,143,.14);box-shadow:0 0 0 1px rgba(63,214,143,.35), 0 0 16px rgba(63,214,143,.2)}
.check.bad .mark{color:var(--critical);background:rgba(255,93,115,.14);box-shadow:0 0 0 1px rgba(255,93,115,.45), 0 0 16px rgba(255,93,115,.22);animation:pulse 2.4s ease-in-out infinite}
.check.warn .mark{color:var(--minor);background:rgba(255,209,102,.12);box-shadow:0 0 0 1px rgba(255,209,102,.4)}
.check .body{flex:1;min-width:0;padding-top:3px}
.check .body b{font-size:14px}
.check .body .detail{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
.fixcmd{display:flex;align-items:center;gap:9px;margin-top:9px;background:rgba(7,11,20,.8);border:1px solid var(--border);border-radius:13px;padding:8px 8px 8px 13px;font-size:12px}
.fixcmd code{flex:1;overflow-x:auto;white-space:nowrap;color:var(--accent)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;background:rgba(7,11,20,.8);border:1px solid var(--border);border-radius:14px;
  color:var(--text);padding:11px 15px;font:inherit;font-size:13.5px;transition:border-color .2s, box-shadow .2s}
.field input:focus,.field select:focus{border-color:var(--border-hi);outline:none;box-shadow:0 0 0 3px rgba(110,168,255,.15)}
.field .hint{color:var(--muted);font-size:11.5px;margin-top:5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.start-wrap button.btn,#welcome button.btn{border-radius:999px;padding:11px 22px;font-size:13px;
  transition:transform .22s cubic-bezier(.2,1.1,.35,1), box-shadow .22s, filter .22s}
.start-wrap button.btn:hover,#welcome button.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn.ghost{background:none;border:1px solid var(--border-hi);color:var(--text);box-shadow:none}
.btn.ghost:hover{background:var(--panel2);box-shadow:none;transform:translateY(-1px)}
.btn.danger{background:linear-gradient(135deg,#ff5d73,#c9384f);box-shadow:0 6px 18px rgba(255,93,115,.3), inset 0 1px 0 rgba(255,255,255,.25)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.crumb code{color:var(--text);background:rgba(7,11,20,.7);padding:3px 8px;border-radius:7px;font-size:12px}
.dirlist{max-height:272px;overflow-y:auto;border:1px solid var(--border);border-radius:18px;background:rgba(7,11,20,.55);padding:6px}
.dirlist .dir{display:flex;align-items:center;gap:11px;padding:10px 13px;cursor:pointer;border-radius:13px;font-size:13.5px;
  transition:background .18s, transform .18s cubic-bezier(.2,1.1,.35,1)}
.dirlist .dir:hover,.dirlist .dir:focus-visible{background:var(--panel2);transform:translateX(3px)}
.dirlist .dir .ico{flex:none;opacity:.75}
.dirlist .dir .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srv{display:flex;align-items:center;gap:11px;padding:12px 15px;border:1px solid var(--border);border-radius:16px;cursor:pointer;margin-bottom:9px;font-size:13.5px;
  transition:border-color .2s, background .2s, transform .22s cubic-bezier(.2,1.1,.35,1)}
.srv:hover,.srv:focus-visible{border-color:var(--border-hi);background:var(--panel2);transform:translateY(-2px)}
.srv.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), var(--glow-a)}
.srv .port{font-weight:700;color:var(--accent)}
.srv .ttl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media (max-width:560px){.presets{grid-template-columns:1fr}}
.preset{text-align:left;background:rgba(7,11,20,.5);border:1px solid var(--border);border-radius:18px;padding:15px 17px;
  cursor:pointer;color:var(--text);font:inherit;transition:border-color .22s, transform .22s cubic-bezier(.2,1.1,.35,1), box-shadow .22s}
.preset:hover{transform:translateY(-2px);border-color:var(--border-hi)}
.preset.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 10px 30px rgba(80,120,255,.22);
  background:linear-gradient(135deg, rgba(110,168,255,.13), rgba(154,110,255,.09))}
.preset .nm{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.preset .cost{margin-left:auto;font-size:15px;font-weight:800;color:var(--accent)}
.preset .desc{color:var(--muted);font-size:12.5px;margin-top:5px;line-height:1.5}
.who{display:flex;flex-wrap:wrap;gap:8px}
.who button{background:rgba(7,11,20,.5);border:1px solid var(--border);border-radius:999px;padding:8px 15px;
  color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;transition:all .2s cubic-bezier(.2,1.1,.35,1)}
.who button:hover{color:var(--text);border-color:var(--border-hi);transform:translateY(-1px)}
.who button.on{color:var(--text);border-color:var(--accent);background:rgba(110,168,255,.14);box-shadow:0 0 0 1px var(--accent)}
.estimate{display:flex;gap:24px;flex-wrap:wrap;padding:18px 22px;border:1px solid var(--border-hi);border-radius:20px;
  background:linear-gradient(120deg, rgba(110,168,255,.13), rgba(154,110,255,.09));margin:6px 0 16px;
  box-shadow:0 8px 28px rgba(80,120,255,.14), inset 0 1px 0 rgba(255,255,255,.06)}
.estimate div{min-width:78px}
.estimate .k{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.estimate .v{font-size:19px;font-weight:700;margin-top:2px}
.feed{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:18px;background:rgba(7,11,20,.7);padding:13px 16px;
  font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
.feed .ev{display:flex;gap:9px;padding:1px 0}
.feed .ev .t{color:var(--muted);flex:none;opacity:.65}
.feed .ev.error{color:var(--critical)}
.feed .ev.finding{color:var(--minor)}
.feed .ev.phase{color:var(--accent);font-weight:700}
.feed .ev.persona{color:var(--goal)}
.progress{height:6px;border-radius:999px;background:rgba(7,11,20,.8);border:1px solid var(--border);overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease}
.progress.indet i{width:38%;animation:slide 1.7s ease-in-out infinite}
@keyframes slide{0%{margin-left:-38%}100%{margin-left:100%}}
/* journey */
.persona-lane{margin-bottom:20px}
.persona-lane h3{font-size:13.5px;margin:0 0 10px;font-weight:700}
.persona-lane h3 .cost{color:var(--muted);font-weight:400;font-size:11px;margin-left:10px}
.steps{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.step{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg, rgba(36,46,74,.9), rgba(22,28,48,.9));
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:default;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 4px 10px rgba(0,0,0,.35);
  transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s}
.step:hover{transform:translateY(-3px) scale(1.08)}
.step.has-finding{border-color:var(--critical);box-shadow:0 0 0 1px var(--critical), 0 0 16px rgba(255,93,115,.45);cursor:pointer;animation:pinPulse 2.2s ease-in-out infinite}
@keyframes pinPulse{0%,100%{box-shadow:0 0 0 1px var(--critical), 0 0 10px rgba(255,93,115,.35)}50%{box-shadow:0 0 0 1px var(--critical), 0 0 22px rgba(255,93,115,.65)}}
@keyframes mmPulse{0%,100%{stroke-width:1.8}50%{stroke-width:3.4}}
.step .tip{display:none;position:absolute;bottom:40px;left:0;background:rgba(10,14,26,.95);border:1px solid var(--border-hi);border-radius:10px;padding:10px 12px;font-size:12px;width:270px;z-index:6;white-space:normal;text-align:left;backdrop-filter:blur(10px);box-shadow:0 14px 34px rgba(0,0,0,.6)}
.step.has-finding:hover .tip{display:block}
.flow-wrap{overflow-x:auto}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12px;margin-bottom:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
/* chat */
#chat-fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--accent2));color:#fff;border:none;font-size:23px;cursor:pointer;
  box-shadow:0 10px 30px rgba(110,140,255,.5), inset 0 1px 0 rgba(255,255,255,.35);z-index:20;transition:transform .2s, box-shadow .2s}
#chat-fab:hover{transform:scale(1.08) translateY(-2px);box-shadow:0 14px 40px rgba(110,140,255,.65), inset 0 1px 0 rgba(255,255,255,.35)}
#chat-drawer{position:fixed;right:20px;bottom:86px;width:450px;max-width:calc(100vw - 40px);height:570px;max-height:calc(100vh - 126px);
  background:rgba(14,19,34,.92);border:1px solid var(--border-hi);border-radius:18px;display:none;flex-direction:column;z-index:20;overflow:hidden;
  backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 30px 80px rgba(0,0,0,.7), var(--glow-a)}
#chat-drawer.open{display:flex;animation:drawerIn .35s cubic-bezier(.2,.9,.3,1.15)}
@keyframes drawerIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
#chat-drawer .head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center}
#chat-drawer .head b{font-size:13.5px}
#chat-drawer .head span{color:var(--muted);font-size:11px;margin-left:8px}
#chat-close{margin-left:10px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:8px;width:26px;height:26px;cursor:pointer;font-size:12px;line-height:1;transition:color .15s,border-color .15s}
#chat-close:hover{color:var(--text);border-color:var(--critical)}
#chat-ctx{padding:4px 16px 0;color:var(--muted);font-size:10.5px;letter-spacing:.3px}
#chat-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}
#chat-sugg .chip{cursor:pointer;font-size:11.5px;padding:3px 10px;transition:border-color .15s}
#chat-sugg .chip:hover{border-color:var(--accent);color:var(--text)}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:tpulse 1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes tpulse{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
#chat-msgs{flex:1;overflow-y:auto;padding:14px}
.msg{margin-bottom:14px;max-width:93%;animation:pageIn .3s ease}
.msg .who{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.msg.user{margin-left:auto}
.msg.user .body{background:linear-gradient(135deg, var(--accent), var(--accent2));color:#fff;border-radius:14px 14px 3px 14px;padding:9px 14px;box-shadow:0 6px 16px rgba(110,140,255,.3)}
.msg.bot .body{background:rgba(30,38,62,.9);border:1px solid var(--border);border-radius:14px 14px 14px 3px;padding:9px 14px}
.msg .body p{margin:6px 0}
.msg .body code{background:rgba(7,11,20,.9);padding:1px 6px;border-radius:5px;font-size:12px}
.msg .body pre{background:rgba(7,11,20,.9);padding:10px;border-radius:8px;overflow-x:auto}
.msg .body a.code-link{color:var(--accent);cursor:pointer;font-weight:700;text-decoration:none;border-bottom:1px dotted var(--accent)}
.msg .body ul,.msg .body ol{margin:6px 0;padding-left:18px}
#chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
#chat-input input{flex:1;background:rgba(7,11,20,.85);border:1px solid var(--border);border-radius:11px;color:var(--text);padding:10px 14px;font-size:13px;outline:none;transition:border-color .2s, box-shadow .2s}
#chat-input input:focus{border-color:var(--accent);box-shadow:var(--glow-a)}
.viz-box{background:rgba(7,11,20,.8);border:1px solid var(--border-hi);border-radius:12px;padding:10px;margin:10px 0;overflow-x:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.cost-line{color:var(--muted);font-size:11px;text-align:right;padding:0 14px 10px}
.empty{color:var(--muted);padding:34px;text-align:center}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grow-in{animation:growIn .6s cubic-bezier(.2,.8,.3,1)}
@keyframes growIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.bar-anim{transform-box:fill-box;transform-origin:left center;animation:barGrow .7s cubic-bezier(.2,.8,.3,1)}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.edge-anim{stroke-dasharray:6 5;animation:edgeFlow 1.4s linear infinite}
@keyframes edgeFlow{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
/* explainer + glossary (plain-language journey) */
.explainer{border:1px solid var(--border-hi);border-radius:14px;padding:14px 18px;margin-bottom:16px;font-size:13.5px;line-height:1.65;
  background:linear-gradient(120deg, rgba(110,168,255,.10), rgba(154,110,255,.07));backdrop-filter:blur(10px)}
.explainer b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
.page-badge{fill:var(--critical);font-size:11px;font-weight:800}
/* mind map + architecture */
.mm-finding{cursor:pointer;animation:pinPulse 2.2s ease-in-out infinite}
.mm-page{cursor:pointer}
.arch-detail h3{margin:0 0 4px;font-size:14px;word-break:break-all}
.arch-detail .tag{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;margin:2px 4px 2px 0;color:var(--muted)}
.arch-detail code{background:var(--bg);padding:1px 6px;border-radius:4px;font-size:12px;color:var(--accent)}
@media(max-width:900px){.two-col,.finding-card .expact{grid-template-columns:1fr}}
rect.mm-pulse{animation:mmPulse 1.4s ease-in-out infinite}

.hero-panel{position:relative;overflow:hidden;padding:26px 30px}
.hero-kicker{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.hero-title{font-size:34px;font-weight:800;margin:6px 0 4px;background:linear-gradient(120deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-tagline{font-size:15px;color:var(--muted);max-width:780px;line-height:1.5}
.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
@media(max-width:1100px){.story-grid{grid-template-columns:1fr}}
.story-card h2{font-size:14px;margin-bottom:8px}
.story-card p{margin:0;font-size:13.5px;line-height:1.55}
.flow-list{margin:0;padding-left:18px;font-size:13px;line-height:1.65}
.risk-row{display:flex;align-items:center;gap:2px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px}
.risk-row:last-child{border-bottom:none}
.muted-note{color:var(--muted);font-size:13px}
.explore-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
@media(max-width:1100px){.explore-grid{grid-template-columns:repeat(2,1fr)}}
.explore-card{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.explore-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 24px rgba(110,168,255,.15)}
.explore-icon{font-size:24px;margin-bottom:8px}
.explore-name{font-weight:700;font-size:14px;margin-bottom:4px}
.explore-blurb{font-size:12px;color:var(--muted);line-height:1.5}
.section-ask{float:right;margin-top:-4px}
.mm-inspect{margin-top:12px;min-height:64px;position:sticky;bottom:14px;z-index:6;box-shadow:0 -10px 34px rgba(0,0,0,.5);backdrop-filter:blur(14px);max-height:300px;overflow:auto}
.mm-inspect h3{font-size:13px;margin:4px 0 8px;word-break:break-word;color:var(--text)}
.mm-inspect-body{font-size:13px;line-height:1.55;color:var(--muted)}
.mm-inspect-body p{margin:6px 0}
.mm-inspect-body b{color:var(--text)}
.mm-evidence{margin-top:6px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.mm-ev-head{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
.mm-ev-row{padding:1px 0;font-size:12px}

.story{margin-top:8px}
.seg-head{font-weight:700;font-size:13px;color:var(--accent);margin:14px 0 4px}
.seg-items{border-left:2px solid var(--border);margin-left:9px;padding:2px 0 2px 14px}
.sitem{display:flex;gap:8px;align-items:baseline;padding:2.5px 0;font-size:13px;flex-wrap:wrap}
.sitem .n{color:var(--muted);font-size:11px;min-width:26px;text-align:right;flex:none}
.sitem .g{flex:none}
.sitem.failed .t{color:var(--major)}
.sitem .why{color:var(--muted);font-size:12px;font-style:italic;flex-basis:100%;margin-left:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:640px}
.sfinding{margin:5px 0 6px 26px;padding:7px 12px;border-left:3px solid var(--critical);background:rgba(255,93,115,.08);border-radius:0 9px 9px 0;font-size:12.5px;cursor:pointer;transition:background .15s}
.sfinding:hover{background:rgba(255,93,115,.16)}
.sfinding.major{border-left-color:var(--major);background:rgba(255,161,77,.08)}
.sfinding.major:hover{background:rgba(255,161,77,.16)}
.sfinding.minor{border-left-color:var(--minor);background:rgba(255,209,102,.07)}
.verdict{padding:10px 14px;border-radius:11px;font-size:13px;margin:8px 0;cursor:default;line-height:1.5}
.verdict.warn{background:rgba(255,93,115,.08);border:1px solid rgba(255,93,115,.3)}
.verdict.ok{background:rgba(63,214,143,.07);border:1px solid rgba(63,214,143,.3)}
.gap-node{stroke-dasharray:5 4 !important}
/* ------------------------------------------------- architecture (deep) --- */
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.arch-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:center}
@media(max-width:1000px){.arch-hero{grid-template-columns:1fr}}
.arch-hero .kicker{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.arch-hero .repo{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--accent);word-break:break-all;margin:6px 0 2px}
.arch-hero .sum{font-size:13.5px;line-height:1.6;color:var(--muted);margin-top:8px}
.arch-hero .sum b{color:var(--text)}
.gauge-row{display:flex;gap:18px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.gauge-lab{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:center;margin-top:4px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:12px}
.astat{background:linear-gradient(160deg,rgba(32,42,68,.85),rgba(20,26,44,.85));border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 22px rgba(0,0,0,.35);
  transition:transform .25s cubic-bezier(.2,.8,.3,1),border-color .25s,box-shadow .25s}
.astat:hover{transform:translateY(-3px);border-color:var(--border-hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 16px 34px rgba(0,0,0,.5),var(--glow-a)}
.astat .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#fff,#a9c3ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.astat .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.astat .s{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}
.meter{margin:10px 0}
.meter .top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px;gap:10px}
.meter .top b{color:var(--text);font-variant-numeric:tabular-nums}
.meter .track{height:7px;border-radius:99px;background:rgba(7,11,20,.85);border:1px solid var(--border);overflow:hidden}
.meter .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px rgba(110,168,255,.45);transform-origin:left center;animation:barGrow .8s cubic-bezier(.2,.8,.3,1)}
.meter .fill.ok{background:linear-gradient(90deg,#2fbf7d,var(--ok));box-shadow:0 0 12px rgba(63,214,143,.45)}
.meter .fill.warn{background:linear-gradient(90deg,var(--major),var(--minor));box-shadow:0 0 12px rgba(255,161,77,.45)}
.meter .fill.bad{background:linear-gradient(90deg,#e0384f,var(--critical));box-shadow:0 0 12px rgba(255,93,115,.45)}
.meter .note{font-size:11px;color:var(--muted);margin-top:4px}
.seg{display:inline-flex;background:rgba(28,36,58,.6);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer;transition:all .18s}
.seg button.on{background:linear-gradient(135deg,rgba(110,168,255,.3),rgba(154,110,255,.26));color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.seg button:not(.on):hover{color:var(--text)}
.arch-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.arch-graph-wrap{overflow:auto;max-height:680px;border:1px solid var(--border);border-radius:14px;
  background:radial-gradient(120% 110% at 0% 0%,rgba(110,168,255,.08),transparent 58%),rgba(7,11,20,.5);position:relative}
.arch-graph-wrap::-webkit-scrollbar{height:9px;width:9px}
.arch-graph-wrap::-webkit-scrollbar-thumb{background:#2a3554;border-radius:9px}
.dtable{width:100%;border-collapse:collapse;font-size:12.5px}
.dtable th{color:var(--muted);font-weight:600;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;padding:7px 10px;
  border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;transition:color .15s}
.dtable th:hover{color:var(--text)}
.dtable th.on{color:var(--accent)}
.dtable td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.dtable tbody tr{cursor:pointer;transition:background .15s}
.dtable tbody tr:hover td{background:rgba(110,168,255,.07)}
.dtable .num{text-align:right;font-variant-numeric:tabular-nums}
.cellbar{height:5px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));min-width:2px;display:inline-block;vertical-align:middle}
.cellbar.risk{background:linear-gradient(90deg,var(--minor),var(--critical))}
.wf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.wf-card{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:13px 15px;cursor:pointer;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;border-left:3px solid var(--accent)}
.wf-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.wf-card.on{box-shadow:0 0 0 1.5px var(--accent),0 10px 26px rgba(0,0,0,.5)}
.wf-card h4{margin:0 0 3px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;color:var(--text)}
.wf-card .wf-meta{font-size:11px;color:var(--muted);margin-bottom:6px}
.minichip{display:inline-block;background:rgba(7,11,20,.7);border:1px solid var(--border);border-radius:6px;padding:1px 7px;
  font-size:10.5px;margin:2px 3px 0 0;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.minichip.hot{color:var(--major);border-color:rgba(255,161,77,.45)}
.minichip.ok{color:var(--ok);border-color:rgba(63,214,143,.4)}
.cycle-row{border-left:3px solid var(--critical);background:rgba(255,93,115,.07);border-radius:0 10px 10px 0;padding:9px 13px;margin-bottom:8px;font-size:12.5px}
.arch-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:1100px){.arch-grid-2{grid-template-columns:1fr}}
.note{color:var(--muted);font-size:11.5px;line-height:1.6;margin-top:10px}
.note code{background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--accent)}
.arch-detail .kpi-row{margin:10px 0 4px}
.arch-detail .astat .v{font-size:18px}
.pathline{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
.pathline .dirpart{color:var(--muted)}
.risk-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid;letter-spacing:.3px;vertical-align:middle}
.sub-h{margin:14px 0 6px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.2px}
.sub-h .hint{text-transform:none;letter-spacing:0;font-size:11px;opacity:.75;margin-left:8px}
/* ------------------------------------------------------------ artifacts --- */
.art-layout{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
@media(max-width:980px){.art-layout{grid-template-columns:1fr}}
.art-list{max-height:760px;overflow:auto;padding-right:4px}
.art-list::-webkit-scrollbar{width:9px}
.art-list::-webkit-scrollbar-thumb{background:#2a3554;border-radius:9px}

/* ------------------------------------------------------ visual 3d atlas --- */
.visual-main{max-width:1760px}

.visual-stage canvas.dragging{cursor:grabbing}

.visual-hud .hud-chip{background:linear-gradient(180deg,rgba(8,16,31,.84),rgba(3,8,17,.78));border:1px solid rgba(103,165,255,.3);backdrop-filter:blur(12px);border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.04);

.visual-hud .spacer{flex:1}
.visual-axis{position:absolute;z-index:2;left:13px;bottom:12px;color:var(--muted);font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;pointer-events:none;

.visual-tooltip b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all;margin-bottom:3px}

.visual-inspector{position:relative;height:min(74vh,790px);min-height:590px;background:radial-gradient(85% 38% at 18% 0%,rgba(32,201,255,.09),transparent 72%),radial-gradient(90% 42% at 100% 100%,rgba(157,92,255,.08),transparent 70%),linear-gradient(180deg,rgba(11,20,38,.97),rgba(6,11,22,.94));border:1px solid rgba(97,147,245,.3);border-radius:14px;overflow:auto;padding:17px;scrollbar-color:#2a4167 transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 18px 42px rgba(0,0,0,.2)}
.visual-inspector::before{content:"";position:sticky;display:block;z-index:2;top:-17px;margin:-17px -17px 15px;height:3px;background:linear-gradient(90deg,#6ea8ff,#3fd68f,#9a6eff,#6ea8ff);background-size:220% 100%;box-shadow:0 0 16px rgba(110,168,255,.36);animation:visualAccent 5s linear infinite}

.visual-kpi b{display:block;font-size:17px;color:#f7f9ff;font-variant-numeric:tabular-nums}
.visual-kpi span{display:block;color:#98a4c7;font-size:9px;text-transform:uppercase;letter-spacing:.8px;margin-top:1px}
.visual-section{border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.visual-section h4{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;color:#9eabd0;margin:0 0 7px}
.visual-file-list{display:flex;flex-wrap:wrap;gap:5px}
.visual-file-list button,.visual-file-list span{font:10.5px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#aab5d5;background:rgba(28,36,58,.68);border:1px solid var(--border);border-radius:6px;padding:4px 7px}
.visual-file-list button{cursor:pointer;text-align:left}.visual-file-list button:hover{border-color:#4dd0e1;color:var(--text)}
.visual-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:9px 11px;background:rgba(7,11,20,.62);border:1px solid var(--border);border-radius:10px;color:#9da9cb;font-size:11px}
.visual-legend span{display:inline-flex;align-items:center;gap:5px}.visual-legend i{width:10px;height:10px;border-radius:1px;display:inline-block;border:1px solid rgba(255,255,255,.22)}

/* Drawing title block — bottom-right of the sheet, the way a drawing is signed. */
.visual-titleblock{position:absolute;z-index:3;right:12px;bottom:12px;width:268px;pointer-events:none;
  background:rgba(7,16,29,.93);border:1px solid rgba(110,168,255,.38);border-radius:4px;backdrop-filter:blur(10px);
  font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9fb4d4;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.visual-titleblock .tb-head{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-bottom:1px solid rgba(110,168,255,.24)}
.visual-titleblock .tb-head b{font-size:13px;color:#eaf1fd;letter-spacing:.4px;word-break:break-all}

@media(max-width:1000px){.visual-titleblock{display:none}}
.visual-route-legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:9px 11px;background:linear-gradient(90deg,rgba(77,208,225,.07),rgba(154,110,255,.06));border:1px solid var(--border);border-radius:10px;color:#a6b2d1;font-size:11px}
.visual-route-legend span{display:inline-flex;align-items:center;gap:7px}.visual-route-legend .route{display:inline-block;width:28px;height:0;border-top:2px solid #78b7ff;filter:drop-shadow(0 0 4px #6ea8ff)}

.webgl-console{background:radial-gradient(75% 95% at 12% 16%,rgba(0,116,189,.13),transparent 65%),radial-gradient(70% 100% at 92% 80%,rgba(112,42,188,.11),transparent 68%),linear-gradient(160deg,rgba(8,16,31,.99),rgba(3,6,14,.99))}
.webgl-console .visual-legend,.webgl-console .visual-route-legend{border-color:rgba(93,139,224,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}

<body>
<a class="skip-link" href="#main">Skip to dashboard content</a>
<header>
  <h1><span class="logo">◉</span> User-Tests Dashboard</h1>
  <label class="sr-only" for="run-select">Choose a completed test run</label>
  <select id="run-select" title="Switch run" aria-label="Choose a completed test run"></select>
  <nav class="tabs" aria-label="Dashboard sections" role="tablist">
    <button type="button" role="tab" aria-selected="false" data-tab="start">Start</button>
    <button type="button" role="tab" aria-selected="true" data-tab="project" class="active">Project</button>
    <button type="button" role="tab" aria-selected="false" data-tab="overview">Overview</button>
    <button type="button" role="tab" aria-selected="false" data-tab="journey">Journey</button>
    <button type="button" role="tab" aria-selected="false" data-tab="mindmap">Mind Map</button>
    <button type="button" role="tab" aria-selected="false" data-tab="architecture">Architecture</button>
    <button type="button" role="tab" aria-selected="false" data-tab="findings">Findings</button>
    <button type="button" role="tab" aria-selected="false" data-tab="artifacts">Artifacts</button>
    <button type="button" role="tab" aria-selected="false" data-tab="history">History</button>
    <button type="button" role="tab" aria-selected="false" data-tab="visual">Visual</button>
  </nav>
</header>
<main id="main" tabindex="-1" aria-live="polite"></main>

<div id="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title" aria-hidden="true">
  <div class="wcard" id="welcome-card"></div>
</div>

<button type="button" id="chat-fab" title="Chat about this run" aria-label="Open run analyst" aria-controls="chat-drawer" aria-expanded="false">💬</button>
<div id="chat-drawer" role="dialog" aria-modal="true" aria-label="Run analyst" aria-hidden="true">
  <div class="head"><b>Chat</b><span id="chat-sub"></span><span style="margin-left:auto;color:var(--muted);font-size:11px">type /help</span><button id="chat-close" title="Close (Esc)">✕</button></div>
  <div id="chat-ctx"></div>
  <div id="chat-pins"></div>
  <div id="chat-msgs"></div>
  <div id="chat-sugg"></div>
  <div id="chat-input"><label class="sr-only" for="chat-field">Ask about this run</label><input id="chat-field" placeholder="Ask about this run… (try: show me a timeline of chaos-hunter)"><button type="button" class="btn" id="chat-send">Send</button></div>
  <div class="cost-line" id="chat-cost"></div>
</div>

<script>
"use strict";
// ---------------------------------------------------------------- state ---
const TABS = ["start", "project", "overview", "journey", "mindmap", "architecture", "findings", "artifacts", "history", "visual"];
// Substituted per-response by the "/" route in serve.ts. Every mutating call
// carries it, so a stray local process cannot drive the launcher.
const TOKEN = "__USERTESTS_TOKEN__";
const requestedTab = new URLSearchParams(location.search).get("tab");
const S = { runs: [], run: null, tab: TABS.includes(requestedTab) ? requestedTab : "project", chatHistory: [], chatCost: 0, lastArch: null, lastFinding: null, ctxNote: null, pins: [], artifacts: [],
  // start-screen state
  setup: null, launch: { dir: null, target: null, steps: null, servers: null, estimate: null, busy: false }, activeRun: null, feed: [], takeover: false };
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt$ = (n) => "$" + (n ?? 0).toFixed(4).replace(/0+$/, "").replace(/\.$/, ".00");
const fmtDur = (ms) => ms == null ? "—" : ms < 60000 ? Math.round(ms / 1000) + "s" : Math.round(ms / 60000) + "m " + Math.round((ms % 60000) / 1000) + "s";

/** Animate an integer stat from 0 → target for a touch of life. */
function countUp(node, target, dur = 750) {
  const t0 = performance.now();
  const tick = (t) => {
    const p = Math.min(1, (t - t0) / dur);
    node.textContent = String(Math.round(target * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

async function api(path, opts) {
  const res = await fetch(path, opts ? { method: "POST", headers: { "content-type": "application/json", "x-usertests-token": TOKEN }, body: JSON.stringify(opts) } : undefined);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

/** GET on a token-gated route (the folder browser discloses filesystem layout). */
async function apiGet(path) {
  const res = await fetch(path, { headers: { "x-usertests-token": TOKEN } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

// ------------------------------------------------------- markdown-lite ---
function md(src) {
  const codes = [];
  let t = String(src ?? "").replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    codes.push({ lang, code });
    return "";
  });
  t = esc(t);
  t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  // Finding codes → clickable links. Never inside a path: "shots/C-1.png" is
  // an artifact reference, not a finding mention, and linkifying it splits the
  // filename in half.
  t = t.replace(/(^|[^\w/-])([CMmAG]-\d+)(?![\w-])(?!\.(?:png|jpe?g|webp|json))/g,
    '$1<a class="code-link" data-code="$2">$2</a>');
  t = t.replace(/^### (.*)$/gm, "<b>$1</b>").replace(/^## (.*)$/gm, "<b>$1</b>").replace(/^# (.*)$/gm, "<b>$1</b>");
  const lines = t.split("\n");
  let out = "", list = null;
  const flush = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const line of lines) {
    const ul = line.match(/^\s*[-•] (.*)$/);
    const ol = line.match(/^\s*\d+[.)] (.*)$/);
    if (ul) { if (list !== "ul") { flush(); out += "<ul>"; list = "ul"; } out += `<li>${ul[1]}</li>`; }
    else if (ol) { if (list !== "ol") { flush(); out += "<ol>"; list = "ol"; } out += `<li>${ol[1]}</li>`; }
    else { flush(); out += line.trim() ? `<p>${line}</p>` : ""; }
  }
  flush();
  for (const c of codes) out += `<pre><code>${esc(c.code.trim())}</code></pre>`;
  return out;
}

const SEV_COLOR = { critical: "var(--critical)", major: "var(--major)", minor: "var(--minor)", "goal-gap": "var(--goal)", appendix: "var(--muted)" };
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function makeInteractive(node, label, action) {
  node.setAttribute("role", "button");
  node.setAttribute("tabindex", "0");
  if (label) node.setAttribute("aria-label", label);
  node.addEventListener("click", action);
  node.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      action(event);
    }
  });
  return node;
}

function donut(counts, size = 150) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const svg = svgEl("svg", { width: size, height: size, viewBox: "0 0 42 42" });
  svg.appendChild(svgEl("circle", { cx: 21, cy: 21, r: 15.9155, fill: "none", stroke: "var(--border)", "stroke-width": 5 }));
  if (total > 0) {
    let off = 25;
    for (const [sev, n] of Object.entries(counts)) {
      if (!n) continue;
      const frac = n / total;
      svg.appendChild(svgEl("circle", {
        cx: 21, cy: 21, r: 15.9155, fill: "none", stroke: SEV_COLOR[sev] || "var(--accent)",
        "stroke-width": 5, "stroke-dasharray": `${frac * 100} ${100 - frac * 100}`, "stroke-dashoffset": off, "stroke-linecap": "butt",
      }));
      off -= frac * 100;
    }
  }
  const txt = svgEl("text", { x: 21, y: 20, "text-anchor": "middle", fill: "var(--text)", "font-size": 8, "font-weight": 700 });
  txt.textContent = total;
  const sub = svgEl("text", { x: 21, y: 26, "text-anchor": "middle", fill: "var(--muted)", "font-size": 3.2 });
  sub.textContent = "findings";
  svg.append(txt, sub);
  return svg;
}

function hbars(rows, { color = "var(--accent)", max, labelWidth = 130, fmt = (v) => v } = {}) {
  const width = 460, rowH = 26;
  const top = Math.max(...rows.map((r) => r.value), 1);
  const svg = svgEl("svg", { width: "100%", viewBox: `0 0 ${width} ${rows.length * rowH}`, style: "max-width:520px" });
  rows.forEach((r, i) => {
    const y = i * rowH;
    const w = Math.max(2, (r.value / (max ?? top)) * (width - labelWidth - 60));
    const name = svgEl("text", { x: 0, y: y + 16, fill: "var(--muted)", "font-size": 11 });
    name.textContent = r.label.length > 18 ? r.label.slice(0, 17) + "…" : r.label;
    svg.appendChild(name);
    svg.appendChild(svgEl("rect", { x: labelWidth, y: y + 5, width: w, height: 15, rx: 4, fill: r.color || color, opacity: 0.9, class: "bar-anim" }));
    const val = svgEl("text", { x: labelWidth + w + 6, y: y + 16, fill: "var(--text)", "font-size": 11 });
    val.textContent = fmt(r.value);
    svg.appendChild(val);
  });
  return svg;
}

function sparkline(values, w = 130, h = 30) {
  if (!values.length) return svgEl("svg", { width: w, height: h });
  const max = Math.max(...values, 1);
  const step = values.length > 1 ? w / (values.length - 1) : w;
  const pts = values.map((v, i) => `${i * step},${h - 3 - (v / max) * (h - 8)}`);
  const svg = svgEl("svg", { width: w, height: h });
  svg.appendChild(svgEl("polyline", { points: pts.join(" "), fill: "none", stroke: "var(--accent)", "stroke-width": 1.5 }));
  return svg;
}

const ACTION_GLYPH = { click: "👆", type: "⌨️", pressKey: "🔑", scroll: "↕️", hover: "🖱️", goto: "🔗", goBack: "⬅️", screenshot: "📷" };
const ACTION_COLOR = { click: "var(--accent)", type: "var(--ok)", pressKey: "var(--minor)", scroll: "var(--muted)", hover: "var(--muted)", goto: "var(--goal)", goBack: "var(--goal)", screenshot: "var(--border)" };

function shortUrl(u) {
  if (!u) return "(same page)";
  try { const x = new URL(u, "http://x"); return x.pathname + x.search + x.hash || "/"; } catch { return String(u).slice(0, 30); }
}

/** The app under test, named the way a human would: host first, "/" is useless. */
function targetLabel(u) {
  if (!u) return "(unknown target)";
  try {
    const x = new URL(u);
    return x.host + (x.pathname === "/" ? "" : x.pathname);
  } catch {
    return String(u).slice(0, 40);
  }
}

/**
 * Artifact references inside rendered text (`shots/C-1.png`, `findings/x.json`)
 * become links into the Artifacts tab — evidence should always be one click away.
 */
function withArtifactLinks(html) {
  return String(html).replace(/\b((?:shots|findings)\/[\w.@-]+\.(?:png|jpe?g|webp|json))\b/g,
    (m) => `<a class="art-link" data-file="${m}">${m}</a>`);
}

function bindArtifactLinks(container) {

    a.addEventListener("click", (e) => {

/** Derive page nodes + transition edges from every persona's action log. */
function buildFlow(personas) {
  const nodes = new Map(); // page -> {visits, order}
  const edges = new Map(); // "a||b" -> {from,to,count}
  let order = 0;
  const touch = (page) => { if (!nodes.has(page)) nodes.set(page, { visits: 0, order: order++ }); nodes.get(page).visits++; };
  for (const p of personas) {
    let page = "(start)";
    touch(page);
    for (const a of p.actions || []) {
      let next = page;
      if (a.action === "goto") next = shortUrl(a.params && a.params.url);
      else if (a.action === "goBack") next = "(back)";
      if (next !== page) {
        const key = page + "||" + next;
        if (!edges.has(key)) edges.set(key, { from: page, to: next, count: 0 });
        edges.get(key).count++;
        touch(next);
        page = next;
      }
    }
  }
  return { nodes: [...nodes.entries()].sort((a, b) => a[1].order - b[1].order), edges: [...edges.values()] };
}

/** SVG flow graph: nodes in a grid, edges as curved paths, thickness ∝ count.
 *  byPage: optional map of page → findings, rendered as red flag badges. */
function flowGraph(personas, minW = 720, byPage = null) {
  const { nodes, edges } = buildFlow(personas);
  if (nodes.length === 0) return el("div", "empty", "No action data for this run");
  const perRow = Math.max(2, Math.ceil(Math.sqrt(nodes.length * 2)));
  const gx = 190, gy = 100, r = 26;
  const W = Math.max(minW, perRow * gx + 60), H = Math.ceil(nodes.length / perRow) * gy + 70;
  const pos = new Map();
  nodes.forEach(([name], i) => {
    const col = i % perRow, row = Math.floor(i / perRow);
    pos.set(name, { x: 60 + col * gx + (row % 2 ? gx / 3 : 0), y: 60 + row * gy });
  });
  const svg = svgEl("svg", { width: "100%", viewBox: `0 0 ${W} ${H}`, style: "min-width:" + minW + "px" });
  const maxCount = Math.max(...edges.map((e) => e.count), 1);
  const HIDDEN = new Set(["(start)", "(back)"]);
  for (const e of edges) {
    if (HIDDEN.has(e.from) || HIDDEN.has(e.to)) continue;
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) continue;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - 24;
    svg.appendChild(svgEl("path", {
      d: `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`, fill: "none", class: "edge-anim",
      stroke: "var(--accent)", opacity: 0.55, "stroke-width": 1.5 + (e.count / maxCount) * 5,
    }));
    const t = svgEl("text", { x: mx, y: my - 4, "text-anchor": "middle", fill: "var(--muted)", "font-size": 10 });
    t.textContent = "×" + e.count;
    svg.appendChild(t);
  }
  for (const [name, meta] of nodes) {
    if (HIDDEN.has(name)) continue;
    const { x, y } = pos.get(name);
    const pageFindings = byPage && name !== "(start)" && name !== "(back)"
      ? (byPage.get(name) || (name === "/" ? byPage.get("Home") : null) || [])
      : [];
    svg.appendChild(svgEl("circle", { cx: x, cy: y, r, fill: "var(--panel2)", stroke: pageFindings.length ? "var(--critical)" : "var(--accent)", "stroke-width": 1.5 }));
    const visits = svgEl("text", { x, y: y + 4, "text-anchor": "middle", fill: "var(--text)", "font-size": 13, "font-weight": 700 });
    visits.textContent = meta.visits;
    svg.appendChild(visits);
    const lbl = svgEl("text", { x, y: y + r + 14, "text-anchor": "middle", fill: "var(--muted)", "font-size": 10 });
    lbl.textContent = name.length > 22 ? name.slice(0, 21) + "…" : name;
    svg.appendChild(lbl);
    if (pageFindings.length > 0) {
      const badge = svgEl("circle", { cx: x + r - 4, cy: y - r + 4, r: 9, fill: "var(--critical)" });
      svg.appendChild(badge);
      const n = svgEl("text", { x: x + r - 4, y: y - r + 8, "text-anchor": "middle", fill: "#fff", "font-size": 10, "font-weight": 800 });
      n.textContent = pageFindings.length;
      svg.appendChild(n);
      const title = svgEl("title");
      title.textContent = "Problems found here:\n" + pageFindings.map((f) => "• " + f.title).join("\n");
      badge.appendChild(title);
    }
  }
  return svg;
}

// ------------------------------------------------------------- mind map ---
let mmCounter = 0;
function mmNode(kind, label, extra = {}) {
  return { id: "n" + ++mmCounter, kind, label, children: [], ...extra };
}
const SEV_MM = { critical: "var(--critical)", major: "var(--major)", minor: "var(--minor)" };

function buildMindMap(run, arch, archErr) {
  mmCounter = 0;
  const byPage = findingsByPage(run);
  const totalFindings = (run.findings || []).length;

  // --- runtime branches: pages → interactions → findings ------------------
  const pages = new Map(); // page -> {visits, personas:Set, interactions:Map(key->{n,personas:Set,steps[]})}
  for (const p of run.personas || []) {
    let page = "Home";
    const touch = (pg) => { if (!pages.has(pg)) pages.set(pg, { visits: 0, personas: new Set(), interactions: new Map() }); const m = pages.get(pg); m.visits++; m.personas.add(p.name || "tester"); };
    touch(page);
    for (const s of p.steps || []) {
      if (s.action === "goto") page = shortUrl(s.params && s.params.url);
      else if (s.action === "goBack") page = "(back)";
      if (s.action === "goto" || s.action === "goBack") touch(page);
      const sel = s.params && (s.params.selector || s.params.url);
      const slot = pages.get(page);
      if (!slot) continue;
      if ((s.action === "click" || s.action === "type" || s.action === "pressKey") && sel) {
        const key = `${ACTION_WORD[s.action] || s.action} ${sel}`;
        const it = slot.interactions.get(key) || { n: 0, personas: new Set(), steps: [] };
        it.n++; it.personas.add(p.name || "tester");
        if (it.steps.length < 6) it.steps.push(`${p.name || "tester"} · step ${s.step}`);
        slot.interactions.set(key, it);
      }
    }
  }
  const prettyPage = (name) => (name === "Home" || name === "/" ? "Home screen" : name);
  const pageNodes = [...pages.entries()]
    .filter(([name]) => name !== "(back)")
    .sort((a, b) => (byPage.get(b[0]) || []).length - (byPage.get(a[0]) || []).length || b[1].visits - a[1].visits)
    .slice(0, 12)
    .map(([name, meta]) => {
      const finds = byPage.get(name) || [];
      const node = mmNode("page", `${prettyPage(name)} · ${meta.visits} visit${meta.visits === 1 ? "" : "s"}`, { finds: finds.length, personas: [...meta.personas] });
      const top = [...meta.interactions.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 6);
      for (const [label, it] of top) {
        node.children.push(mmNode("act", it.n > 1 ? `${label} ×${it.n}` : label, { tip: "done by " + [...it.personas].join(", "), it: { n: it.n, personas: [...it.personas], steps: it.steps } }));
      }
      const rest = meta.interactions.size - top.length;
      if (rest > 0) node.children.push(mmNode("more", `+${rest} more interaction${rest === 1 ? "" : "s"}`));
      for (const f of finds.slice(0, 8)) {
        node.children.push(mmNode("finding", (f.code ? f.code + " — " : "") + f.title, {
          code: f.code, title: f.title, severity: f.severity, f,
          tip: (f.found_by ? "found by " + f.found_by.join(", ") : "finding") + (f.severity ? " · " + f.severity : "") + " — click to open",
        }));
      }
      if (finds.length > 8) node.children.push(mmNode("more", `+${finds.length - 8} more problem${finds.length - 8 === 1 ? "" : "s"} — see Findings tab`));
      return node;
    });

  const shownFindings = pageNodes.reduce((a, nd) => a + (nd.finds || 0), 0);
  let host = "the app";
  try { host = new URL(run.target).host; } catch {}
  const root = mmNode("root",
    `${host} — ${totalFindings} problem${totalFindings === 1 ? "" : "s"} across ${pageNodes.length} screen${pageNodes.length === 1 ? "" : "s"}` +
    (totalFindings > shownFindings ? ` (${shownFindings} pinned on the map)` : ""));

  const screens = mmNode("section", "🖥 Screens the testers saw");
  screens.children = pageNodes;
  if (pageNodes.length) root.children.push(screens);
  else root.children.push(mmNode("more", "no page visits were recorded for this run"));

  // --- static branch: code surfaces from mapd -----------------------------
  // static branch hint when arch needs a repo pointer
  if (arch && (arch.nodes || []).length) {
    const sec = mmNode("section", "🧭 Code map (mapd static analysis)");
    const entries = (arch.nodes || []).filter((n) => n.entry && !n.grouped).slice(0, 8);
    for (const n of entries) {
      sec.children.push(mmNode("surface", `${n.entry}: ${n.path} · ${n.loc} lines`, { tip: "entry point — click to open the full Architecture graph" }));
    }
    if (!entries.length) sec.children.push(mmNode("more", "no entry points detected"));
    for (const w of (arch.workflows || []).slice(0, 5)) {
      sec.children.push(mmNode("wf", `${w.id} · ${w.files} files · confidence ${(w.confidence || 0).toFixed(2)}`));
    }
    root.children.push(sec);

    // untested territory: biggest files with no real automated tests
    const untested = (arch.nodes || [])
      .filter((n) => n.test && n.test !== "tested-real" && !n.grouped)
      .sort((a, b) => (b.loc || 0) - (a.loc || 0))
      .slice(0, 6);
    if (untested.length) {
      const gap = mmNode("section", `🔍 Untested territory — ${untested.length} biggest files with no real tests`);
      for (const u of untested) {
        gap.children.push(mmNode("gap", `${u.name} · ${(u.loc || 0).toLocaleString()} lines`, {
          tip: `${u.path} (${u.test}) — changing this has no automated safety net. Click to inspect in Architecture.`,
        }));
      }
      root.children.push(gap);
    }
  } else if (archErr && /didn't record its repo/.test(archErr)) {
    const sec = mmNode("section", "🧭 Code map (mapd static analysis)");
    sec.children.push(mmNode("surface", "🧭 Code map — click here, then point Architecture at your repo", { tip: "this older run didn't record its repo path — the Architecture tab will ask for it" }));
    root.children.push(sec);
  }
  return root;
}

function layoutMindMap(root, collapsed) {
  const NW = 230, NH = 26, GX = 72, GY = 10;
  function measure(n, depth) {
    n.depth = depth;
    n.kids = (n.children || []).filter((c) => !collapsed.has(c.id));
    if (!n.kids.length) { n.h = NH; return; }
    for (const c of n.kids) measure(c, depth + 1);
    n.h = Math.max(NH, n.kids.reduce((a, c) => a + c.h + GY, 0) - GY);
  }
  function place(n, y) {
    n.x = 30 + n.depth * (NW + GX);
    n.y = y + n.h / 2;
    let cy = y;
    for (const c of n.kids) { place(c, cy); cy += c.h + GY; }
  }
  measure(root, 0);
  place(root, 20);
  let maxDepth = 0;
  (function walk(n) { maxDepth = Math.max(maxDepth, n.depth); for (const c of n.kids) walk(c); })(root);
  return { W: 60 + (maxDepth + 1) * (NW + GX), H: root.h + 60 };
}

const MM_STYLE = {
  root:    { fill: "rgba(110,168,255,.18)", stroke: "var(--accent)",  text: "var(--text)",  w: 300 },
  section: { fill: "rgba(154,110,255,.13)", stroke: "var(--accent2)", text: "var(--text)",  w: 250 },
  page:    { fill: "rgba(28,36,58,.95)",    stroke: "var(--accent)",  text: "var(--text)",  w: 230 },
  act:     { fill: "rgba(28,36,58,.75)",    stroke: "var(--border)",  text: "var(--muted)", w: 210 },
  more:    { fill: "rgba(28,36,58,.5)",     stroke: "var(--border)",  text: "var(--muted)", w: 190 },
  finding: { fill: "rgba(255,93,115,.14)",  stroke: "var(--critical)", text: "var(--text)", w: 250 },
  surface: { fill: "rgba(28,36,58,.75)",    stroke: "var(--goal)",    text: "var(--muted)", w: 250 },
  wf:      { fill: "rgba(28,36,58,.5)",     stroke: "var(--border)",  text: "var(--muted)", w: 250 },
  gap:     { fill: "rgba(255,161,77,.10)",  stroke: "var(--major)",   text: "var(--text)",  w: 250 },
};

function renderMindMapSvg(root, collapsed, onFinding, onPage, onInspect) {
  const { W, H } = layoutMindMap(root, collapsed);
  const svg = svgEl("svg", { width: "100%", viewBox: `0 0 ${W} ${H}`, style: "min-width:" + Math.min(W, 1300) + "px" });
  (function edges(n) {
    for (const c of n.kids || []) {
      const x1 = n.x + (MM_STYLE[n.kind]?.w ?? 200), y1 = n.y, x2 = c.x, y2 = c.y;
      const stroke = c.kind === "finding" ? (SEV_MM[c.severity] || SEV_MM.critical) : c.kind === "section" ? "var(--accent2)" : "var(--border-hi)";
      svg.appendChild(svgEl("path", {
        d: `M ${x1} ${y1} C ${x1 + 40} ${y1}, ${x2 - 40} ${y2}, ${x2} ${y2}`,
        fill: "none", stroke, opacity: c.kind === "finding" ? 0.85 : 0.6, "stroke-width": c.kind === "finding" ? 1.8 : 1.4,
      }));
      edges(c);
    }
  })(root);
  (function nodes(n) {
    const st = MM_STYLE[n.kind] || MM_STYLE.act;
    const g = svgEl("g");
    const w = st.w, h = 26;
    const clickable = n.kind === "page" || n.kind === "finding" || n.kind === "surface" || n.kind === "gap";
    if (clickable) g.setAttribute("style", "cursor:pointer");
    g.appendChild(svgEl("rect", {
      x: n.x, y: n.y - h / 2, width: w, height: h, rx: 9,
      fill: st.fill, stroke: st.stroke, "stroke-width": n.kind === "finding" ? 1.8 : 1.3,
      "stroke-dasharray": n.kind === "more" ? "4 3" : "",
      ...(n.kind === "finding" && n.severity === "critical" ? { class: "mm-pulse" } : {}),
    }));
    if (n.kind === "finding") {
      g.appendChild(svgEl("rect", { x: n.x, y: n.y - h / 2 + 3, width: 4, height: h - 6, rx: 2, fill: SEV_MM[n.severity] || SEV_MM.critical }));
    }
    const t = svgEl("text", { x: n.x + (n.kind === "finding" ? 14 : 10), y: n.y + 4, fill: st.text, "font-size": n.kind === "root" || n.kind === "section" ? 12 : 11, "font-weight": n.kind === "finding" || n.kind === "root" ? 700 : 500 });
    t.textContent = n.label.length > 44 ? n.label.slice(0, 43) + "…" : n.label;
    const title = svgEl("title");
    title.textContent = n.tip || n.label;
    g.append(title, t);
    // 🚩 problems badge on screens
    if (n.kind === "page" && n.finds) {
      const bx = n.x + w - (n.children && n.children.length ? 44 : 26);
      g.appendChild(svgEl("circle", { cx: bx, cy: n.y, r: 9.5, fill: "var(--critical)", opacity: 0.92 }));
      const bt = svgEl("text", { x: bx, y: n.y + 3.5, "text-anchor": "middle", fill: "#fff", "font-size": 9.5, "font-weight": 800 });
      bt.textContent = n.finds > 9 ? "9+" : n.finds;
      g.appendChild(bt);
    }
    if (n.kind === "page" && (n.children || []).length) {
      const c = svgEl("text", { x: n.x + w - 12, y: n.y + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 10 });
      c.textContent = collapsed.has(n.id) ? "▸" : "▾";
      g.appendChild(c);
    }
    if (clickable) {
      makeInteractive(g, n.tip || n.label, (e) => {
        e.stopPropagation();
        if (n.kind === "finding") onFinding(n);
        else if (n.kind === "page") onPage(n);
        else goTab("architecture");
      });
    }
    g.addEventListener("pointerenter", () => onInspect && onInspect(n));
    g.addEventListener("pointerleave", () => onInspect && onInspect(null));
    svg.appendChild(g);
    for (const c of n.kids || []) nodes(c);
  })(root);
  return svg;
}

  page:    ["🖥", "Screen", "One screen (URL) of the app. The testers navigated here, and any problems they filed while on it are pinned underneath. Click to fold/unfold."],
  act:     ["👆", "Recorded interaction", "Something a persona physically did — a click, typed text, or a key press on that selector. Repeated actions are counted (×N). This is raw Playwright evidence, not an interpretation."],
  more:    ["⋯", "Summary node", "Condensed view: more interactions or problems happened here than fit on the map. The Journey tab has the complete list."],
  finding: ["🚩", "Finding", "A problem a persona filed. The pin shows WHERE it was discovered (the screen the persona was on). Click to open the full finding with evidence and screenshot."],
  surface: ["⚡", "Code entry point", "Where the app starts, detected by static analysis (mapd) — not by the testers. Click to open the full Architecture graph."],
  gap:     ["🔍", "Untested file", "This file has no real automated tests (mapd checked for specs/imports). The testers exercised it manually at best — a change here ships without a safety net. Click to inspect it in the Architecture graph."],

function renderNodeInspect(panel, n, run) {
  if (!n) {
    panel.innerHTML = "<h2>🧭 Node guide</h2>";

    return;
  }
  const [icon, label, explain] = MM_KIND_INFO[n.kind] || ["•", "Node", ""];
  panel.innerHTML = `<h2>${icon} ${label}</h2><h3>${esc(n.label)}</h3>`;
  const body = el("div", "mm-inspect-body");
  body.appendChild(el("p", "muted-note", explain));

  if (n.kind === "page") {
    const meta = el("p", "", `<b>${esc((n.personas || []).join(", ") || "unknown persona")}</b> visited this screen.`);
    body.appendChild(meta);
    if (n.finds) body.appendChild(el("p", "", `🚩 <b style="color:var(--critical)">${n.finds} problem${n.finds === 1 ? "" : "s"}</b> pinned here${n.finds > 8 ? " (8 shown)" : ""}.`));
    else body.appendChild(el("p", "muted-note", "No problems were pinned to this screen."));
    body.appendChild(sectionAskBtn("💬 ask about this screen",
      `What happened on the "${n.label}" screen during the test? Which personas visited, what did they do there, and what problems were pinned to it?`,
      `Mind Map tab: hovering the "${n.label}" screen node (${(n.personas || []).join(", ") || "unknown persona"}, ${n.finds || 0} problems pinned).`));
  }
  if (n.kind === "act" && n.it) {
    body.appendChild(el("p", "", `Performed <b>${n.it.n}×</b> by <b>${esc(n.it.personas.join(", "))}</b>.`));
    if (n.it.steps && n.it.steps.length) {
      const ev = el("div", "mm-evidence");
      ev.appendChild(el("div", "mm-ev-head", "Recorded at"));
      for (const s of n.it.steps) ev.appendChild(el("div", "mm-ev-row", `<code>${esc(s)}</code>`));
      if (n.it.n > n.it.steps.length) ev.appendChild(el("div", "mm-ev-row muted-note", `+ ${n.it.n - n.it.steps.length} more occurrence${n.it.n - n.it.steps.length === 1 ? "" : "s"} — full log in Journey tab`));
      body.appendChild(ev);
    }
  }
  if (n.kind === "finding" && n.f) {
    const f = n.f;
    const tags = el("div", "chips");
    tags.appendChild(el("span", "pill " + (f.severity || "major"), f.severity || "?"));
    if (f.found_by && f.found_by.length) tags.appendChild(el("span", "chip", "found by " + esc(f.found_by.join(", "))));
    if (f.category) tags.appendChild(el("span", "chip", esc(f.category)));
    if (f.atStep != null) tags.appendChild(el("span", "chip", `filed at step ${f.atStep}`));
    body.appendChild(tags);
    if (f.expected) body.appendChild(el("p", "", `<b>Expected:</b> ${esc(String(f.expected).slice(0, 240))}`));
    if (f.actual) body.appendChild(el("p", "", `<b>Actually:</b> ${esc(String(f.actual).slice(0, 240))}`));
    if (f.code) {
      const b = el("button", "btn primary", "Open full finding →");
      b.style.marginTop = "8px";
      b.addEventListener("click", () => showFinding(f.code, f.title));
      body.appendChild(b);
      body.appendChild(sectionAskBtn("💬 discuss this finding",
        `Let's discuss ${f.code || "this finding"} — "${f.title}": how serious is it, what's the likely root cause in the code, and what should be fixed first?`,
        `Mind Map tab: hovering finding ${f.code || "?"} — "${f.title}" (${f.severity}).`));
    } else {
      body.appendChild(el("p", "muted-note", "This finding has no code (older run) — it opens by title match."));
    }
  }
  if (n.kind === "surface") {
    body.appendChild(el("p", "muted-note", "Detected from package.json scripts, HTML entries, or main-module resolution — the testers may never have touched it, which is exactly the kind of gap this dashboard surfaces."));
  }
  panel.appendChild(body);
}

  } catch (e) { archErr = e.message; }

  const root = buildMindMap(r, arch, archErr);

  panel.appendChild(el("div", "legend", `<span>Screens are sorted by number of problems. Hover any node for a plain-language explanation and the raw evidence behind it. Click a problem to open its full finding.</span>`));
}

const ACTION_WORD = { click: "clicked", type: "typed into", pressKey: "pressed", scroll: "scrolled", hover: "hovered", goto: "opened", goBack: "went back", screenshot: "looked at", wait: "waited", drag: "dragged" };

/** Map page (shortUrl form) → findings pinned there.
 *  Full runs: walk the source persona's steps up to atStep and take the page
 *  they were on. Older runs (sparse REPORT.md parse): attribute to the
 *  "found by" persona's most-visited page so the map still tells a story. */
function findingsByPage(run) {
  const map = new Map();
  const pin = (page, f) => { if (!page || page === "(back)" || page === "(start)") return; if (!map.has(page)) map.set(page, []); map.get(page).push(f); };
  const personaByName = new Map((run.personas || []).map((p) => [p.name, p]));
  const pageOfStep = (p, upto) => {
    let page = "Home";
    for (const s of p.steps || []) {
      if (upto != null && typeof s.step === "number" && s.step > upto) break;
      if (s.action === "goto") page = shortUrl(s.params && s.params.url);
      else if (s.action === "goBack") page = "(back)";
    }
    return page === "(back)" ? "Home" : page;
  };
  const busiestPage = (p) => {
    const counts = new Map();
    let page = "Home";
    for (const s of p.steps || []) {
      if (s.action === "goto") page = shortUrl(s.params && s.params.url);
      else if (s.action === "goBack") page = "(back)";
      if (page !== "(back)") counts.set(page, (counts.get(page) || 0) + 1);
    }
    let best = "Home", bestN = -1;
    for (const [pg, n] of counts) if (n > bestN) { best = pg; bestN = n; }
    return best;
  };
  for (const f of run.findings || []) {
    const personaName = f.source_persona || (f.found_by && f.found_by[0]);
    const p = personaName && personaByName.get(personaName);
    if (!p) continue;
    if (f.atStep != null) pin(pageOfStep(p, f.atStep), f);
    else pin(busiestPage(p), f);
  }
  return map;
}

function currentViewContext() {
  const r = S.run;

  for (const f of r.findings || []) if (f.section === "main" && sev[f.severity] != null) sev[f.severity]++;
  let ctx = `Dashboard tab: "${S.tab}". Run ${r.dir} targeting ${r.target}. ${(r.findings || []).length} findings (${sev.critical} critical / ${sev.major} major / ${sev.minor} minor). ${r.personas.length} personas, ${(r.stats && r.stats.llmCalls) || "?"} LLM calls.`;
  const a = S.lastArch;
  if (S.tab === "architecture" && a && a.stats) {
    ctx += ` Architecture graph on screen: ${a.stats.shown} files, ${(a.workflows || []).length} workflows, ${a.stats.totalLoc} LOC.`;
  }
  if (S.tab === "visual" && a && a.stats) {
    ctx += ` Interactive 3D repository blueprint on screen: ${a.stats.shown} files, ${(a.workflows || []).length} workflows, ${a.stats.totalLoc} LOC.`;
  }
  if (S.tab === "mindmap") ctx += " Mind map on screen: screens → interactions → pinned findings, plus code surfaces.";

  if (S.lastFinding) ctx += ` Last viewed finding: ${S.lastFinding.code || "?"} — ${S.lastFinding.title} (${S.lastFinding.severity}).`;
  return ctx;
}

function extractSummaryParagraph(report) {
  const m = String(report || "").match(/##\s*Summary([\s\S]*?)(?=\n##\s|\n###\s|$)/i);
  if (!m) return "";
  const para = m[1].split("\n").map((l) => l.trim()).filter((l) => l && !l.startsWith("#") && !l.startsWith("-")).join(" ");
  return para.replace(/\*\*/g, "").slice(0, 420);
}

function techFromNodes(nodes) {
  const exts = {};
  for (const n of nodes || []) {
    const ext = (n.name.match(/\.(\w+)$/) || [])[1];
    if (ext) exts[ext] = (exts[ext] || 0) + 1;
  }
  const label = { js: "JavaScript", mjs: "Node.js ESM", ts: "TypeScript", py: "Python", html: "HTML", css: "CSS", json: "JSON", css3: "CSS" };
  return Object.entries(exts).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([e, c]) => `${label[e] || e} ×${c}`);
}
