  });
  if (pairs.length > shown.length) chips.appendChild(el("span", "chip", `<span class="dot" style="background:var(--muted)"></span> +${pairs.length - shown.length} more (check/smoke tooling)`));
  p.appendChild(chips);
  return p;
}

// -------------------------------------------------------- dependency graph ---

const G = { COL_W: 268, ROW_H: 58, NW: 216, NH: 46, PAD_T: 76, PAD_L: 52 };

/** Column assignment: dependency layers, or one column per directory. */
function archLayout(model, mode) {
  const { nodes, depth, n } = model;
  const key = mode === "folders"
    ? (i) => (nodes[i].dir && nodes[i].dir !== "." ? nodes[i].dir : "(root)")
    : (i) => depth[i];
  const groups = new Map();
  for (let i = 0; i < n; i++) {
    const k = key(i);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(i);
  }
  const keys = [...groups.keys()].sort((a, b) =>
    mode === "folders" ? (groups.get(b).length - groups.get(a).length || String(a).localeCompare(String(b))) : a - b);
  const pos = new Array(n);
  const columns = [];
  keys.forEach((k, c) => {
    const list = groups.get(k);
    // heaviest / most-depended-on first so the eye lands on the load-bearing files
    list.sort((a, b) => model.blast[b] - model.blast[a] || (nodes[b].loc || 0) - (nodes[a].loc || 0) || nodes[a].path.localeCompare(nodes[b].path));
    list.forEach((idx, row) => { pos[idx] = { x: G.PAD_L + c * G.COL_W, y: G.PAD_T + row * G.ROW_H }; });
    const isDetached = mode !== "folders" && k === model.maxDepth && model.detached.length && list.every((i) => model.detached.includes(i));
    columns.push({
      x: G.PAD_L + c * G.COL_W - 14,
      label: mode === "folders" ? String(k) : isDetached ? "detached" : k === 0 ? "L0 · entry points" : "L" + k,
      sub: `${list.length} module${list.length === 1 ? "" : "s"} · ${list.reduce((a, i) => a + (nodes[i].loc || 0), 0).toLocaleString()} loc`,
      count: list.length,
      alt: c % 2 === 1,
    });
  });
  const rows = Math.max(1, ...keys.map((k) => groups.get(k).length));
  return { pos, columns, W: G.PAD_L * 2 + keys.length * G.COL_W, H: G.PAD_T + rows * G.ROW_H + 30 };
}

function archGraphPanel(ctx) {
  const { arch, model } = ctx;
  const p = panelWith(`Dependency graph`, `${model.n} modules · ${model.uniqEdges.length} edges · a → b means “a imports b”`);

  // --- toolbar ------------------------------------------------------------
  const bar = el("div", "arch-toolbar");
  const search = el("input");
  search.placeholder = "Filter modules… (name, path or directory)";
  search.value = S.archFilter || "";
  search.style.cssText = "flex:1;min-width:210px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:8px 12px;font-size:13px;outline:none";
  const layoutSeg = el("div", "seg");
  const mkSeg = (key, label, title) => {
    const b = el("button", S.archLayout === key || (!S.archLayout && key === "layers") ? "on" : "", label);
    b.title = title;
    b.addEventListener("click", () => { S.archLayout = key; renderArchitecture(); });
    return b;
  };
  layoutSeg.append(
    mkSeg("layers", "⌗ layers", "Column = import distance from the nearest entry point"),
    mkSeg("folders", "🗂 folders", "Column = source directory"));
  const untestedBtn = el("button", "btn" + (S.archUntestedOnly ? " primary" : ""), "🧪 untested only");
  untestedBtn.title = "Dim every module that has a real automated test";
  untestedBtn.style.cssText = S.archUntestedOnly ? "" : "background:var(--panel2);color:var(--muted);box-shadow:none;border:1px solid var(--border)";
  const zoomBox = el("div", "seg");
  const zOut = el("button", "", "−"), zFit = el("button", "", "fit"), zIn = el("button", "", "+");
  zoomBox.append(zOut, zFit, zIn);
  const refreshBtn = el("button", "btn", "↻ re-map");
  refreshBtn.title = "Re-run mapd, ignoring the cached arch.json";
  refreshBtn.style.cssText = "background:var(--panel2);color:var(--muted);box-shadow:none;border:1px solid var(--border)";
  bar.append(search, layoutSeg, untestedBtn, zoomBox, refreshBtn);
  p.appendChild(bar);

  // --- svg ----------------------------------------------------------------
  const mode = S.archLayout === "folders" ? "folders" : "layers";
  const { pos, columns, W, H } = archLayout(model, mode);
  const nodes = model.nodes;
  const host = el("div", "arch-graph-wrap");
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}` });
  const defs = svgEl("defs", {});
  defs.innerHTML =
    `<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(140,170,255,.55)"/></marker>` +
    `<marker id="arrUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffa14d"/></marker>` +
    `<marker id="arrDn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fd68f"/></marker>`;
  svg.appendChild(defs);

  // column bands + headers
  for (const c of columns) {
    if (c.alt) svg.appendChild(svgEl("rect", { x: c.x, y: 30, width: G.COL_W - 24, height: H - 46, rx: 14, fill: "rgba(110,168,255,.035)" }));
    const lab = svgEl("text", { x: c.x + 8, y: 46, fill: "var(--muted)", "font-size": 11, "font-weight": 800, "letter-spacing": ".8" });
    lab.textContent = c.label.length > 26 ? c.label.slice(0, 25) + "…" : c.label;
    const sub = svgEl("text", { x: c.x + 8, y: 60, fill: "rgba(139,150,184,.7)", "font-size": 9.5 });
    sub.textContent = c.sub;
    svg.append(lab, sub);
  }

  // edges
  const maxLoc = Math.max(1, ...nodes.map((x) => x.loc || 0));
  const edgeEls = [];
  for (const [a, b] of model.uniqEdges) {
    const p1 = pos[a], p2 = pos[b];
    if (!p1 || !p2) continue;
    const back = p2.x <= p1.x; // back-edge: points left, i.e. toward an earlier layer
    const x1 = p1.x + (back ? 0 : G.NW), y1 = p1.y, x2 = back ? p2.x + G.NW : p2.x, y2 = p2.y;
    const bow = back ? 90 : 48;
    const path = svgEl("path", {
      d: `M ${x1} ${y1} C ${x1 + (back ? -bow : bow)} ${y1 - (back ? 26 : 0)}, ${x2 + (back ? bow : -bow)} ${y2 - (back ? 26 : 0)}, ${x2 + (back ? 2 : -2)} ${y2}`,
      fill: "none", stroke: back ? "rgba(255,93,115,.5)" : hexA(wfColorOf(nodes[a]), 0.42),
      "stroke-width": back ? 1.6 : 1.25, "marker-end": "url(#arr)", class: "edge-anim",
    });
    if (back) { const t = svgEl("title"); t.textContent = `back-edge (cycle candidate): ${nodes[a].path} → ${nodes[b].path}`; path.appendChild(t); }
    svg.appendChild(path);
    edgeEls.push({ el: path, a, b, base: back ? "rgba(255,93,115,.5)" : hexA(wfColorOf(nodes[a]), 0.42), bw: back ? 1.6 : 1.25 });
  }

  // nodes
  const gEls = new Map(), rectEls = new Map();
  nodes.forEach((nd, i) => {
    const { x, y } = pos[i];
    const wf = wfColorOf(nd);
    const g = svgEl("g", { class: "arch-node", style: "cursor:pointer" });
    const rect = svgEl("rect", {
      x, y: y - G.NH / 2, width: G.NW, height: G.NH, rx: 11, class: "body",
      fill: "rgba(22,29,49,.94)", stroke: wf, "stroke-width": nd.entry ? 2.4 : 1.3,
      "stroke-dasharray": nd.test === "untested" || nd.test === "tested-nameonly" ? "5 4" : "",
      style: nd.entry ? `filter:drop-shadow(0 0 9px ${hexA(wf, 0.85)})` : "",
    });
    g.appendChild(rect);
    // workflow spine
    g.appendChild(svgEl("rect", { x: x + 1.5, y: y - G.NH / 2 + 7, width: 3, height: G.NH - 14, rx: 2, fill: wf, opacity: 0.85 }));
    const name = svgEl("text", { x: x + 12, y: y - 8, fill: "var(--text)", "font-size": 11.5, "font-weight": 700 });
    name.textContent = nd.name.length > 24 ? nd.name.slice(0, 23) + "…" : nd.name;
    const dirTxt = !nd.dir || nd.dir === "." ? "" : (nd.dir.length > 16 ? "…" + nd.dir.slice(-15) : nd.dir) + "/";
    const sub = svgEl("text", { x: x + 12, y: y + 5, fill: "var(--muted)", "font-size": 9.5 });
    sub.textContent = `${nd.entry ? "⚡ " : ""}${nd.test !== "tested-real" ? "🧪 " : ""}${dirTxt}${(nd.loc || 0).toLocaleString()} loc · ${(nd.fns || []).length} fn`;
    const deg = svgEl("text", { x: x + G.NW - 11, y: y + 5, fill: "rgba(139,150,184,.9)", "font-size": 9.5, "text-anchor": "end" });
    deg.textContent = `→${model.outDeg[i]} ←${model.inDeg[i]} ⌁${model.blast[i]}`;
    // size bar
    g.appendChild(svgEl("rect", { x: x + 12, y: y + 11, width: G.NW - 24, height: 3.5, rx: 2, fill: "rgba(7,11,20,.85)" }));
    g.appendChild(svgEl("rect", {
      x: x + 12, y: y + 11, width: Math.max(2, (G.NW - 24) * ((nd.loc || 0) / maxLoc)), height: 3.5, rx: 2,
      fill: wf, opacity: 0.75, class: "bar-anim",
    }));
    if (model.risk[i] >= 70) g.appendChild(svgEl("circle", { cx: x + G.NW - 8, cy: y - G.NH / 2 + 8, r: 3.6, fill: "var(--critical)", style: "filter:drop-shadow(0 0 5px var(--critical))" }));
    const title = svgEl("title");
    title.textContent =
      `${nd.path}\nrisk ${model.risk[i]}/100 · ${TEST_LABEL[nd.test] || nd.test || "unknown"}\n` +
      `${nd.loc} loc · ${(nd.fns || []).length} functions · layer L${model.depth[i]}\n` +
      `imports ${model.outDeg[i]} · imported by ${model.inDeg[i]} · blast radius ${model.blast[i]}`;
    g.append(title, name, sub, deg);
    svg.appendChild(g);
    gEls.set(nd.path, g);
    rectEls.set(nd.path, rect);

    makeInteractive(g, `Inspect module ${nd.path}, risk ${model.risk[i]} of 100`, () => ctx.select(nd.path, true));
    g.addEventListener("pointerenter", () => {
      if (S.archSel) return;
      for (const e of edgeEls) {
        const on = e.a === i || e.b === i;
        e.el.setAttribute("stroke", on ? "rgba(180,214,255,.95)" : e.base);
        e.el.setAttribute("stroke-width", on ? 2.5 : e.bw);
        e.el.setAttribute("opacity", on ? 1 : 0.14);
      }
    });
    g.addEventListener("pointerleave", () => { if (!S.archSel) resetEdges(); });
  });

  function resetEdges() {
    for (const e of edgeEls) {
      e.el.setAttribute("stroke", e.base);
      e.el.setAttribute("stroke-width", e.bw);
      e.el.setAttribute("opacity", 1);
      e.el.setAttribute("marker-end", "url(#arr)");
    }
  }

  host.appendChild(svg);
  p.appendChild(host);

  const statusBar = el("div", "note");
  statusBar.innerHTML = `Layout: <b>${mode === "folders" ? "one column per directory" : "dependency layers from the entry points"}</b>. ` +
    `Node subtitle reads <code>loc · functions</code>; the right side is <code>→ imports  ← imported-by  ⌁ blast radius</code>. ` +
    `Red curving edges point back toward an earlier layer — those are the cycle candidates.`;
  p.appendChild(statusBar);

  // --- zoom ---------------------------------------------------------------
  const applyZoom = () => {
    const z = S.archZoom || 1;
    svg.setAttribute("width", Math.round(W * z));
    svg.setAttribute("height", Math.round(H * z));
  };
  zIn.addEventListener("click", () => { S.archZoom = Math.min(2.2, (S.archZoom || 1) + 0.15); applyZoom(); });
  zOut.addEventListener("click", () => { S.archZoom = Math.max(0.4, (S.archZoom || 1) - 0.15); applyZoom(); });
  zFit.addEventListener("click", () => { S.archZoom = Math.max(0.4, Math.min(1, (host.clientWidth - 24) / W)); applyZoom(); });
  applyZoom();
  requestAnimationFrame(() => { if (S.archZoom == null && W > host.clientWidth * 1.6) { S.archZoom = Math.max(0.55, (host.clientWidth - 24) / W); applyZoom(); } });

  // --- selection + filtering ---------------------------------------------
  const byPath = new Map(nodes.map((nd, i) => [nd.path, i]));
  ctx.nodeEls = gEls;
  ctx.select = (path, scroll) => {
    const i = byPath.get(path);
    if (i == null) return;
    S.archSel = S.archSel === path ? null : path;
    ctx.applyFilter();
    if (S.archSel) {
      showArchDetail(nodes[i], ctx);
      if (scroll !== true) gEls.get(path).scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    }
  };

  ctx.applyFilter = () => {
    const q = (S.archFilter || "").trim().toLowerCase();
    const sel = S.archSel != null ? byPath.get(S.archSel) : null;
    const up = sel != null ? model.dependents[sel] : null;   // modules that import (transitively) the selection
    const down = sel != null ? model.deps[sel] : null;       // modules the selection depends on
    nodes.forEach((nd, i) => {
      const g = gEls.get(nd.path);
      const rect = rectEls.get(nd.path);
      const match = !q || nd.path.toLowerCase().includes(q) || nd.name.toLowerCase().includes(q);
      const keep = match
        && !(S.archUntestedOnly && nd.test === "tested-real")
        && (S.archWfHL == null || (nd.wfs || []).includes(S.archWfHL));
      let op = keep ? 1 : 0.1;
      if (sel != null && keep) op = i === sel || up.has(i) || down.has(i) ? 1 : 0.16;
      g.setAttribute("opacity", op);
      const isSel = i === sel;
      rect.setAttribute("stroke-width", isSel ? 3.4 : nd.entry ? 2.4 : 1.3);
      rect.setAttribute("stroke", isSel ? "#ffffff" : sel != null && up.has(i) ? "#ffa14d" : sel != null && down.has(i) ? "#3fd68f" : wfColorOf(nd));
    });
    if (sel == null) { resetEdges(); return; }
    for (const e of edgeEls) {
      const involved = (e.a === sel || e.b === sel)
        || (up.has(e.a) && (up.has(e.b) || e.b === sel))
        || (down.has(e.b) && (down.has(e.a) || e.a === sel));
      const upstream = e.b === sel || up.has(e.b);
      e.el.setAttribute("opacity", involved ? 1 : 0.07);
      e.el.setAttribute("stroke", involved ? (upstream ? "rgba(255,161,77,.9)" : "rgba(63,214,143,.9)") : e.base);
      e.el.setAttribute("stroke-width", involved ? 2.2 : e.bw);
      e.el.setAttribute("marker-end", involved ? (upstream ? "url(#arrUp)" : "url(#arrDn)") : "url(#arr)");
    }
  };

  search.addEventListener("input", () => { S.archFilter = search.value; ctx.applyFilter(); });
  untestedBtn.addEventListener("click", () => {
    S.archUntestedOnly = !S.archUntestedOnly;
    untestedBtn.className = "btn" + (S.archUntestedOnly ? " primary" : "");
    untestedBtn.style.cssText = S.archUntestedOnly ? "" : "background:var(--panel2);color:var(--muted);box-shadow:none;border:1px solid var(--border)";
    ctx.applyFilter();
  });
  refreshBtn.addEventListener("click", () => { S.archFresh = true; S.archSel = null; renderArchitecture(); });

  if (S.archSel && byPath.has(S.archSel)) showArchDetail(nodes[byPath.get(S.archSel)], ctx);
  return p;
}

// ------------------------------------------------------------ hotspots ---

const HOT_COLS = [
  { key: "path", label: "module", num: false },
  { key: "loc", label: "loc", num: true, bar: true },
  { key: "fns", label: "fns", num: true },
  { key: "out", label: "imports →", num: true },
  { key: "in", label: "← imported by", num: true },
  { key: "blast", label: "blast ⌁", num: true, bar: true },
  { key: "depth", label: "layer", num: true },
  { key: "test", label: "tests", num: false },
  { key: "risk", label: "risk", num: true, bar: true },
];

function hotRows(model) {
  return model.nodes.map((nd, i) => ({
    i, nd, path: nd.path, loc: nd.loc || 0, fns: (nd.fns || []).length,
    out: model.outDeg[i], in: model.inDeg[i], blast: model.blast[i],
    depth: model.depth[i], test: nd.test || "unknown", risk: model.risk[i],
  }));
}

function archHotspots(ctx) {
  const { model } = ctx;
  const p = panelWith("Module hotspots", "risk = size × blast radius × surface area × test gap — click a row to pin it in the graph");
  const sort = S.archSort || (S.archSort = { key: "risk", dir: -1 });
  const rows = hotRows(model).sort((a, b) => {
    const va = a[sort.key], vb = b[sort.key];
    return (typeof va === "string" ? String(va).localeCompare(String(vb)) : va - vb) * sort.dir;
  });
  const limit = S.archHotAll ? rows.length : Math.min(20, rows.length);
  const maxes = { loc: Math.max(1, ...rows.map((r) => r.loc)), blast: Math.max(1, ...rows.map((r) => r.blast)), risk: 100 };

  const scroll = el("div", "");
  scroll.style.cssText = "overflow-x:auto";
  const tbl = el("table", "dtable");
  const thead = el("thead");
  const tr = el("tr");
  for (const c of HOT_COLS) {
    const th = el("th", (sort.key === c.key ? "on " : "") + (c.num ? "num" : ""), esc(c.label) + (sort.key === c.key ? (sort.dir < 0 ? " ▾" : " ▴") : ""));
    if (c.num) th.style.textAlign = "right";
    th.addEventListener("click", () => {
      S.archSort = { key: c.key, dir: sort.key === c.key ? -sort.dir : c.num ? -1 : 1 };
      renderArchitecture();
    });
    tr.appendChild(th);
  }
  thead.appendChild(tr);
  tbl.appendChild(thead);
  const tbody = el("tbody");
  for (const r of rows.slice(0, limit)) {
    const row = el("tr");
    const wf = wfColorOf(r.nd);
    const bar = (v, max, cls) => `<span class="cellbar ${cls || ""}" style="width:${Math.max(3, (v / max) * 62)}px"></span>`;
    const dirPart = r.nd.dir && r.nd.dir !== "." ? `<span style="color:var(--muted)">${esc(r.nd.dir)}/</span>` : "";
    row.innerHTML =
      `<td class="mono" style="border-left:3px solid ${wf};padding-left:9px">${dirPart}<b>${esc(r.nd.name)}</b>${r.nd.entry ? ' <span class="minichip ok">⚡ entry</span>' : ""}</td>` +
      `<td class="num">${r.loc.toLocaleString()}<div>${bar(r.loc, maxes.loc)}</div></td>` +
      `<td class="num">${r.fns}</td>` +
      `<td class="num">${r.out}</td>` +
      `<td class="num">${r.in}</td>` +
      `<td class="num">${r.blast}<div>${bar(r.blast, maxes.blast)}</div></td>` +
      `<td class="num">L${r.depth}</td>` +
      `<td><span style="color:${TEST_COLOR[r.test] || "var(--muted)"};font-size:11.5px">${esc(TEST_LABEL[r.test] || r.test)}</span></td>` +
      `<td class="num">${riskBadge(r.risk)}<div>${bar(r.risk, maxes.risk, "risk")}</div></td>`;
    makeInteractive(row, `Inspect module ${r.path}, risk ${r.risk} of 100`, () => { ctx.select(r.path); ctx.detail.scrollIntoView({ behavior: "smooth", block: "center" }); });
    tbody.appendChild(row);
  }
  tbl.appendChild(tbody);
  scroll.appendChild(tbl);
  p.appendChild(scroll);
  if (rows.length > 20) {
    const more = el("button", "btn", S.archHotAll ? `▴ show top 20 only` : `▾ show all ${rows.length} modules`);
    more.style.cssText = "margin-top:12px;background:var(--panel2);color:var(--muted);box-shadow:none;border:1px solid var(--border)";
    more.addEventListener("click", () => { S.archHotAll = !S.archHotAll; renderArchitecture(); });
    p.appendChild(more);
  }
  p.appendChild(el("div", "note",
    `<b>Blast radius ⌁</b> counts every module that transitively imports this one — the number of places a breaking change here can surface. ` +
    `<b>Layer</b> is the shortest import distance from an entry point. Risk is a heuristic for triage, not a verdict.`));
  return p;
}

// ------------------------------------------------------------- risk map ---

function archRiskMap(ctx) {
  const { model } = ctx;
  const p = panelWith("Risk map", "blast radius × size, coloured by test status — the top-right quadrant is where bugs hurt most");
  const nodes = model.nodes;
  const W = 980, H = 420, L = 62, B = 52, T = 22, R = 24;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "min-width:640px" });
  const maxB = Math.max(1, ...model.blast), maxL = Math.max(1, ...nodes.map((n) => n.loc || 0));
  const PADX = 30, PADY = 24; // inset so bubbles on 0 don't get sliced by the axis
  const X = (v) => L + PADX + (lg(v) / lg(maxB)) * (W - L - R - PADX);
  const Y = (v) => H - B - PADY - (lg(v) / lg(maxL)) * (H - B - T - PADY);
  /** Decade-ish ticks that stay legible however wide the range is. */
  const ticks = (max) => {
    const all = [0, 1, 2, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 25000];
    const keep = all.filter((v) => v <= max);
    if (keep[keep.length - 1] !== max) keep.push(max);
    return keep.length > 7 ? keep.filter((_, i) => i % 2 === 0 || i === keep.length - 1) : keep;
  };

  // grid + quadrant shading
  const medB = median(model.blast), medL = median(nodes.map((n) => n.loc || 0));
  svg.appendChild(svgEl("rect", { x: X(medB), y: T, width: W - R - X(medB), height: Y(medL) - T, fill: "rgba(255,93,115,.06)", rx: 10 }));
  for (const t of ticks(maxB)) {
    svg.appendChild(svgEl("line", { x1: X(t), y1: T, x2: X(t), y2: H - B, stroke: "rgba(120,150,255,.10)" }));
    const tx = svgEl("text", { x: X(t), y: H - B + 16, fill: "var(--muted)", "font-size": 10, "text-anchor": "middle" });
    tx.textContent = t;
    svg.appendChild(tx);
  }
  for (const t of ticks(maxL)) {
    svg.appendChild(svgEl("line", { x1: L, y1: Y(t), x2: W - R, y2: Y(t), stroke: "rgba(120,150,255,.10)" }));
    const ty = svgEl("text", { x: L - 8, y: Y(t) + 3.5, fill: "var(--muted)", "font-size": 10, "text-anchor": "end" });
    ty.textContent = t.toLocaleString();
    svg.appendChild(ty);
  }
  const axX = svgEl("text", { x: (W + L) / 2, y: H - 14, fill: "var(--muted)", "font-size": 11, "text-anchor": "middle", "letter-spacing": ".6" });
  axX.textContent = "blast radius — modules transitively affected (log scale)";
  const axY = svgEl("text", { x: 16, y: (H - B + T) / 2, fill: "var(--muted)", "font-size": 11, "text-anchor": "middle", transform: `rotate(-90 16 ${(H - B + T) / 2})`, "letter-spacing": ".6" });
  axY.textContent = "lines of code (log scale)";
  const quad = svgEl("text", { x: W - R - 10, y: T + 16, fill: "rgba(255,93,115,.8)", "font-size": 10.5, "text-anchor": "end", "font-weight": 700, "letter-spacing": "1" });
  quad.textContent = "BIG + WIDELY DEPENDED ON";
  svg.append(axX, axY, quad);

  const maxFns = Math.max(1, ...nodes.map((n) => (n.fns || []).length));
  nodes.forEach((nd, i) => {
    const cx = X(model.blast[i]), cy = Y(nd.loc || 0);
    const rr = 4 + 9 * Math.sqrt((nd.fns || []).length / maxFns);
    const g = svgEl("g", { style: "cursor:pointer" });
    const c = svgEl("circle", {
      cx, cy, r: rr, fill: hexA(wfColorOf(nd), 0.35), stroke: TEST_COLOR[nd.test] || "var(--muted)",
      "stroke-width": nd.entry ? 2.4 : 1.4, "stroke-dasharray": nd.test === "untested" ? "3 2" : "",
      class: "grow-in",
    });
    const t = svgEl("title");
    t.textContent = `${nd.path}\n${nd.loc} loc · ${(nd.fns || []).length} fns · blast ${model.blast[i]} · risk ${model.risk[i]}\n${TEST_LABEL[nd.test] || nd.test}`;
    g.append(c, t);
    if (model.risk[i] >= 62 || rr > 10) {
      const flip = cx > W - R - 130; // near the right edge: label to the left instead
      const lbl = svgEl("text", {
        x: flip ? cx - rr - 5 : cx + rr + 5, y: cy + 3.5, fill: "rgba(238,242,255,.82)",
        "font-size": 9.5, "font-weight": 600, "text-anchor": flip ? "end" : "start",
      });
      lbl.textContent = nd.name.length > 20 ? nd.name.slice(0, 19) + "…" : nd.name;
      g.appendChild(lbl);
    }
    makeInteractive(g, `Inspect ${nd.path} on the risk map`, () => { ctx.select(nd.path); ctx.detail.scrollIntoView({ behavior: "smooth", block: "center" }); });
    svg.appendChild(g);
  });
  const wrap = el("div", "flow-wrap");
  wrap.appendChild(svg);
  p.appendChild(wrap);
  const lg2 = el("div", "chips");
  for (const k of ["tested-real", "tested-nameonly", "untested", "unknown"]) {
    if (!model.testCounts[k]) continue;
    lg2.appendChild(el("span", "chip", `<span class="dot" style="background:${TEST_COLOR[k]}"></span> ${TEST_LABEL[k]} · ${model.testCounts[k]}`));
  }
  lg2.appendChild(el("span", "chip", `bubble size = functions indexed · fill = workflow colour`));
  p.appendChild(lg2);
  p.appendChild(el("div", "note",
    `Both axes are log-scaled so the small files stay readable. The shaded quadrant is above the median on <i>both</i> axes: large modules that many other modules depend on. ` +
    `A red-stroked bubble in there is the single best argument for writing a test.`));
  return p;
}

// ------------------------------------------------------- coupling matrix ---

function archCoupling(ctx) {
  const { model } = ctx;
  const p = panelWith("Directory coupling", "how many imports cross from row → column");
  const dirs = model.dirList.slice(0, 9);
  if (dirs.length < 2) {
    p.appendChild(el("div", "empty", "Only one source directory in the mapped graph — nothing to couple."));
    return p;
  }
  const idx = new Map(model.dirList.map((d, i) => [d.dir, i]));
  const cells = dirs.map((ra) => dirs.map((rb) => model.coupling[idx.get(ra.dir)][idx.get(rb.dir)]));
  const max = Math.max(1, ...cells.flat());
  const CELL = 46, LEFT = 132, TOP = 86;
  const W = LEFT + dirs.length * CELL + 14, H = TOP + dirs.length * CELL + 16;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: `min-width:${Math.min(W, 520)}px` });
  dirs.forEach((d, c) => {
    const t = svgEl("text", {
      x: LEFT + c * CELL + CELL / 2, y: TOP - 10, fill: "var(--muted)", "font-size": 10,
      "text-anchor": "start", transform: `rotate(-52 ${LEFT + c * CELL + CELL / 2} ${TOP - 10})`,
    });
    t.textContent = d.dir.length > 14 ? "…" + d.dir.slice(-13) : d.dir;
    svg.appendChild(t);
  });
  dirs.forEach((d, r) => {
    const t = svgEl("text", { x: LEFT - 10, y: TOP + r * CELL + CELL / 2 + 4, fill: "var(--muted)", "font-size": 10.5, "text-anchor": "end" });
    t.textContent = d.dir.length > 18 ? "…" + d.dir.slice(-17) : d.dir;
    svg.appendChild(t);
    dirs.forEach((d2, c) => {
      const v = cells[r][c];
      const bucket = v === 0 ? 0 : Math.min(HEAT.length - 1, 1 + Math.floor((v / max) * (HEAT.length - 2)));
      const g = svgEl("g");
      g.appendChild(svgEl("rect", {
        x: LEFT + c * CELL + 2, y: TOP + r * CELL + 2, width: CELL - 4, height: CELL - 4, rx: 8,
        fill: r === c && v ? "rgba(63,214,143,.22)" : HEAT[bucket],
        stroke: r === c ? "rgba(63,214,143,.45)" : "rgba(120,150,255,.13)",
      }));
      if (v) {
        const tx = svgEl("text", { x: LEFT + c * CELL + CELL / 2, y: TOP + r * CELL + CELL / 2 + 4, fill: "var(--text)", "font-size": 11.5, "font-weight": 700, "text-anchor": "middle" });
        tx.textContent = v;
        g.appendChild(tx);
      }
      const t2 = svgEl("title");
      t2.textContent = `${d.dir} → ${d2.dir}: ${v} import${v === 1 ? "" : "s"}${r === c ? " (internal to the folder)" : ""}`;
      g.appendChild(t2);
      svg.appendChild(g);
    });
  });
  const wrap = el("div", "flow-wrap");
  wrap.appendChild(svg);
  p.appendChild(wrap);
  const offDiag = cells.reduce((a, row, r) => a + row.reduce((b, v, c) => b + (r === c ? 0 : v), 0), 0);
  const diag = cells.reduce((a, row, r) => a + row[r], 0);
  p.appendChild(el("div", "note",
    `<b>${diag}</b> imports stay inside their own folder, <b>${offDiag}</b> cross a folder boundary. ` +
    `A green diagonal with a sparse off-diagonal means the folders are real modules; a dense off-diagonal means the folder names are decoration.`));
  return p;
}

// -------------------------------------------------------------- treemap ---

function squarify(items, x, y, w, h) {
  const out = [];
  let i = 0;
  while (i < items.length && w > 0.5 && h > 0.5) {
    const horiz = w >= h;
    const side = horiz ? h : w;
    const area = w * h;
    const total = items.slice(i).reduce((a, b) => a + b.v, 0) || 1;
    const ratio = (row, sum) => {
      const thick = (area * (sum / total)) / side;
      let worst = 1;
      for (const it of row) {
        const len = side * (it.v / sum);
        if (len > 0 && thick > 0) worst = Math.max(worst, Math.max(thick / len, len / thick));
      }
      return worst;
    };
    let row = [], sum = 0, best = Infinity;
    while (i + row.length < items.length) {
      const it = items[i + row.length];
      const nSum = sum + it.v;
      const worst = ratio(row.concat([it]), nSum);
      if (worst > best) break;
      best = worst; row = row.concat([it]); sum = nSum;
    }
    if (!row.length) { row = [items[i]]; sum = items[i].v; }
    const thick = (area * (sum / total)) / side;
    let off = 0;
    for (const it of row) {
      const len = side * (it.v / sum);
      out.push(horiz ? { ...it, x, y: y + off, w: thick, h: len } : { ...it, x: x + off, y, w: len, h: thick });
      off += len;
    }
    if (horiz) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    i += row.length;
  }
  return out;
}

function archTreemap(ctx) {
  const { model } = ctx;
  const p = panelWith("Where the code lives", "area = lines of code · colour = share of the folder without real tests");
  const items = model.dirList.filter((d) => d.loc > 0).map((d) => ({ ...d, v: d.loc }));
  if (!items.length) { p.appendChild(el("div", "empty", "No directory data.")); return p; }
  const W = 640, H = 400;
  const laid = squarify(items, 0, 0, W, H);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "min-width:340px" });
  const totalLoc = items.reduce((a, b) => a + b.v, 0);
  for (const c of laid) {
    const gapFrac = c.files ? c.untested / c.files : 0;
    const g = svgEl("g", { style: "cursor:pointer" });
    g.appendChild(svgEl("rect", {
      x: c.x + 2, y: c.y + 2, width: Math.max(0, c.w - 4), height: Math.max(0, c.h - 4), rx: 10,
      fill: gapFrac > 0.66 ? "rgba(255,93,115,.22)" : gapFrac > 0.33 ? "rgba(255,161,77,.20)" : gapFrac > 0 ? "rgba(255,209,102,.16)" : "rgba(63,214,143,.16)",
      stroke: gapFrac > 0.66 ? "rgba(255,93,115,.55)" : gapFrac > 0.33 ? "rgba(255,161,77,.5)" : "rgba(63,214,143,.45)",
      "stroke-width": 1.2, class: "grow-in",
    }));
    if (c.w > 66 && c.h > 30) {
      const t1 = svgEl("text", { x: c.x + 12, y: c.y + 22, fill: "var(--text)", "font-size": Math.min(13, Math.max(10, c.w / 11)), "font-weight": 700 });
      t1.textContent = c.dir.length > Math.floor(c.w / 7.2) ? "…" + c.dir.slice(-Math.max(4, Math.floor(c.w / 7.2) - 1)) : c.dir;
      g.appendChild(t1);
      if (c.h > 48) {
        const t2 = svgEl("text", { x: c.x + 12, y: c.y + 38, fill: "var(--muted)", "font-size": 10 });
        t2.textContent = `${c.loc.toLocaleString()} loc · ${c.files} file${c.files === 1 ? "" : "s"} · ${Math.round((c.loc / totalLoc) * 100)}%`;
        g.appendChild(t2);
      }
      if (c.h > 66) {
        const t3 = svgEl("text", { x: c.x + 12, y: c.y + 53, fill: gapFrac ? "var(--major)" : "var(--ok)", "font-size": 10, "font-weight": 600 });
        t3.textContent = gapFrac ? `${c.untested}/${c.files} untested` : "all files tested";
        g.appendChild(t3);
      }
    }
    const t = svgEl("title");
    t.textContent = `${c.dir}\n${c.loc.toLocaleString()} loc across ${c.files} files · ${c.fns} functions\n${c.untested} without real tests · peak risk ${c.risk}`;
    g.appendChild(t);
    makeInteractive(g, `Filter architecture to folder ${c.dir}`, () => { S.archFilter = c.dir; renderArchitecture(); });
    svg.appendChild(g);
  }
  const wrap = el("div", "flow-wrap");
  wrap.appendChild(svg);
  p.appendChild(wrap);
  p.appendChild(el("div", "note", `Click a folder to filter the whole page down to it. Green = every file has a real test; red = almost none do.`));
  return p;
}

// --------------------------------------------------------------- cycles ---

function archCycles(ctx) {
  const { model } = ctx;
  const p = panelWith("Cycles & layering", "circular imports, back-edges and modules nothing reaches");
  const grid = el("div", "arch-grid-2");
  const left = el("div");
  left.appendChild(el("div", "sub-h", `Import cycles<span class="hint">strongly connected components of the import graph</span>`));
  if (!model.sccs.length && !model.selfLoops.length) {
    left.appendChild(el("div", "verdict ok",
      `✓ <b>No circular imports.</b> The graph is a directed acyclic graph, so every module can be loaded, reasoned about and unit-tested in dependency order.`));
  } else {
    for (const comp of model.sccs) {
      const names = comp.map((i) => model.nodes[i]);
      const row = el("div", "cycle-row",
        `<b>${comp.length}-module cycle</b> · ${names.reduce((a, x) => a + (x.loc || 0), 0).toLocaleString()} loc<br>` +
        names.map((x) => `<span class="minichip hot">${esc(x.path)}</span>`).join(" → ") + " → ↺");
      row.style.cursor = "pointer";
      makeInteractive(row, `Inspect import cycle beginning at ${names[0].path}`, () => { ctx.select(names[0].path); ctx.detail.scrollIntoView({ behavior: "smooth", block: "center" }); });
      left.appendChild(row);
    }
    for (const i of model.selfLoops) left.appendChild(el("div", "cycle-row", `<b>self-import</b> · <span class="minichip hot">${esc(model.nodes[i].path)}</span>`));
    left.appendChild(el("div", "note", `Modules in a cycle have to be loaded together: you cannot test, replace or lazy-load one without the rest.`));
  }

  const right = el("div");
  right.appendChild(el("div", "sub-h", `Layering<span class="hint">shortest import distance from an entry point</span>`));
  const byDepth = new Map();
  model.depth.forEach((d, i) => { byDepth.set(d, (byDepth.get(d) || 0) + 1); });
  const maxCount = Math.max(1, ...byDepth.values());
  for (const d of [...byDepth.keys()].sort((a, b) => a - b)) {
    const count = byDepth.get(d);
    const detached = d === model.maxDepth && model.detached.length;
    const loc = model.nodes.reduce((a, nd, i) => a + (model.depth[i] === d ? nd.loc || 0 : 0), 0);
    right.appendChild(meter(
      detached ? `detached — nothing imports these from an entry` : d === 0 ? "L0 · entry points" : `L${d} · ${d} hop${d === 1 ? "" : "s"} in`,
      count / maxCount, `${count} module${count === 1 ? "" : "s"} · ${loc.toLocaleString()} loc`, detached ? "warn" : ""));
  }
  const back = model.uniqEdges.filter(([a, b]) => model.depth[b] <= model.depth[a]).length;
  right.appendChild(el("div", "note",
    `<b>${back}</b> of ${model.uniqEdges.length} edges point sideways or backwards across layers (drawn in red on the graph). ` +
    `<b>${model.orphans}</b> module${model.orphans === 1 ? "" : "s"} have no import edges at all, and <b>${model.roots}</b> are imported by nothing.`));
  grid.append(left, right);
  p.appendChild(grid);
  return p;
}

// ------------------------------------------------------------ workflows ---

function archWorkflows(ctx) {
  const { arch, model } = ctx;
  const wfs = arch.workflows || [];
  const p = panelWith(`Workflows · ${wfs.length}`, "entry-rooted execution slices mapd inferred from scripts, servers and CLI entry points");
  if (!wfs.length) { p.appendChild(el("div", "empty", "mapd inferred no workflows for this repo.")); return p; }
  const grid = el("div", "wf-grid");
  wfs.forEach((w, idx) => {
    const color = WF_PALETTE[idx % WF_PALETTE.length];
    const card = el("div", "wf-card" + (S.archWfHL === idx ? " on" : ""));
    card.style.borderLeftColor = color;
    card.innerHTML =
      `<h4>${esc(String(w.id))}</h4>` +
      `<div class="wf-meta">${w.files} file${w.files === 1 ? "" : "s"} · ${w.functionCount} functions · ${(w.exportedSurface || []).length} exported symbols shown</div>`;
    card.appendChild(meter("inference confidence", w.confidence || 0, (w.confidence || 0).toFixed(2),
      (w.confidence || 0) > 0.7 ? "ok" : (w.confidence || 0) > 0.4 ? "warn" : "bad"));
    if (w.entry) card.appendChild(el("div", "", `<div class="sub-h" style="margin:8px 0 3px">entry</div><span class="minichip ok">${esc(w.entry)}</span>`));
    if ((w.fileList || []).length) {
      const files = el("div", "");
      files.innerHTML = `<div class="sub-h" style="margin:8px 0 3px">members</div>` +
        w.fileList.map((f) => `<span class="minichip">${esc(f)}</span>`).join("") +
        (w.files > w.fileList.length ? `<span class="minichip">+${w.files - w.fileList.length} more</span>` : "");
      card.appendChild(files);
    }
    if ((w.exportedSurface || []).length) {
      const ex = el("div", "");
      ex.innerHTML = `<div class="sub-h" style="margin:8px 0 3px">public surface</div>` +
        w.exportedSurface.map((s) => `<span class="minichip">${esc(s)}</span>`).join("");
      card.appendChild(ex);
    }
    makeInteractive(card, `Spotlight workflow ${String(w.id)}`, () => { S.archWfHL = S.archWfHL === idx ? null : idx; renderArchitecture(); });
    grid.appendChild(card);
  });
  p.appendChild(grid);
  p.appendChild(el("div", "note",
    `Confidence is mapd's own score for “these files really do run together”. Low-confidence workflows are usually a script that happens to share a helper. ` +
    `Click a card to spotlight that workflow in the graph, the risk map and the hotspot table.`));
  return p;
}

// -------------------------------------------------------- external deps ---

function archExternals(ctx) {
  const { model } = ctx;
  const p = panelWith("External surface", "bare import specifiers, by how many modules pull them in");
  const list = model.externals.slice(0, 14);
  if (!list.length) { p.appendChild(el("div", "empty", "No external or builtin imports in the mapped files — this graph is entirely self-contained.")); return p; }
  const max = Math.max(1, ...list.map((e) => e.count));
  const rows = el("div");
  for (const e of list) {
    const row = el("div");
    row.style.cssText = "display:flex;align-items:center;gap:10px;padding:5px 0";
    row.innerHTML =
      `<span class="mono" style="flex:0 0 150px;font-size:12px;color:${e.builtin ? "var(--ok)" : "var(--text)"};overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.files.join(", "))}">${esc(e.pkg)}</span>` +
      `<span style="flex:1;height:9px;border-radius:99px;background:rgba(7,11,20,.8);overflow:hidden;display:block">` +
      `<span style="display:block;height:100%;width:${(e.count / max) * 100}%;border-radius:99px;background:${e.builtin ? "linear-gradient(90deg,#2fbf7d,var(--ok))" : "linear-gradient(90deg,var(--accent),var(--accent2))"}" class="bar-anim"></span></span>` +
      `<span class="num mono" style="flex:0 0 34px;text-align:right;font-size:12px;color:var(--muted)">${e.count}</span>`;
    rows.appendChild(row);
  }
  p.appendChild(rows);
  const builtins = model.externals.filter((e) => e.builtin).length;
  p.appendChild(el("div", "note",
    `<b>${model.externals.length}</b> distinct external specifiers — <b>${builtins}</b> Node builtins (green) and <b>${model.externals.length - builtins}</b> third-party packages. ` +
    `A package imported by many modules is a de-facto part of your architecture: swapping it is a graph-wide change. Hover a name to see which files import it.`));
  return p;
}

// ------------------------------------------------- function distribution ---

function archFnDistribution(ctx) {
  const { model } = ctx;
  const p = panelWith("Function size distribution", "every function mapd indexed, bucketed by line count");
  const hist = model.fnHist;
  const max = Math.max(1, ...hist.map((h) => h.count));
  const W = 560, H = 240, L = 40, B = 46, T = 18;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "min-width:320px" });
  const bw = (W - L - 20) / hist.length;
  hist.forEach((h, i) => {
    const hh = (h.count / max) * (H - B - T);
    const x = L + i * bw + 8;
    const g = svgEl("g");
    g.appendChild(svgEl("rect", {
      x, y: H - B - hh, width: bw - 16, height: Math.max(1, hh), rx: 7,
      fill: h.hot ? "rgba(255,93,115,.35)" : "rgba(110,168,255,.32)",
      stroke: h.hot ? "rgba(255,93,115,.7)" : "rgba(110,168,255,.6)", class: "grow-in",
    }));
    const v = svgEl("text", { x: x + (bw - 16) / 2, y: H - B - hh - 7, fill: "var(--text)", "font-size": 11, "font-weight": 700, "text-anchor": "middle" });
    v.textContent = h.count;
    const l = svgEl("text", { x: x + (bw - 16) / 2, y: H - B + 17, fill: "var(--muted)", "font-size": 10.5, "text-anchor": "middle" });
    l.textContent = h.label;
    const l2 = svgEl("text", { x: x + (bw - 16) / 2, y: H - B + 31, fill: "rgba(139,150,184,.6)", "font-size": 9, "text-anchor": "middle" });
    l2.textContent = model.allFns.length ? Math.round((h.count / model.allFns.length) * 100) + "%" : "";
    g.append(v, l, l2);
    svg.appendChild(g);
  });
  const ax = svgEl("text", { x: W / 2, y: H - 6, fill: "var(--muted)", "font-size": 10.5, "text-anchor": "middle" });
  ax.textContent = "lines per function";
  svg.appendChild(ax);
  p.appendChild(svg);
  const big = model.allFns.filter((f) => (f.loc || 0) > 100).length;
  p.appendChild(el("div", "note",
    `<b>${model.allFns.length}</b> functions indexed · <b>${model.exportedFns}</b> exported · <b>${model.asyncFns}</b> async · <b>${model.anonFns}</b> anonymous. ` +
    `<b>${big}</b> run past 100 lines — those are the ones a persona is most likely to trip over and the hardest to unit-test. ` +
    `mapd keeps the 12 largest functions per file, so this is the heavy tail, not every function in the repo.`));
  return p;
}

function archFnTable(ctx) {
  const { model } = ctx;
  const p = panelWith("Largest functions in the repo", "the top of the heavy tail — click a row to open its module");
  const top = [...model.allFns].sort((a, b) => (b.loc || 0) - (a.loc || 0)).slice(0, 18);
  const max = Math.max(1, ...top.map((f) => f.loc || 0));
  const scroll = el("div");
  scroll.style.cssText = "overflow-x:auto";
  const tbl = el("table", "dtable");
  tbl.innerHTML = `<thead><tr><th>function</th><th>module</th><th class="num" style="text-align:right">loc</th><th class="num" style="text-align:right">params</th><th>flags</th><th>calls out to</th></tr></thead>`;
  const tb = el("tbody");
  for (const f of top) {
    const tr = el("tr");
    tr.innerHTML =
      `<td class="mono"><b>${esc(f.name || "(anonymous)")}</b><div><span class="cellbar" style="width:${Math.max(3, ((f.loc || 0) / max) * 90)}px"></span></div></td>` +
      `<td class="mono" style="font-size:11.5px;color:var(--muted)">${esc(f.file)}</td>` +
      `<td class="num">${f.loc || 0}</td>` +
      `<td class="num">${f.params ?? 0}</td>` +
      `<td>${f.exported ? '<span class="pill ok">exported</span> ' : ""}${f.async ? '<span class="pill appendix">async</span> ' : ""}${f.test !== "tested-real" ? '<span class="pill minor" title="the module this function lives in has no real automated test">module untested</span>' : ""}</td>` +
      `<td class="mono" style="font-size:11px;color:var(--muted)">${(f.calls || []).slice(0, 4).map(esc).join(", ") || "—"}${(f.calls || []).length > 4 ? ` +${f.calls.length - 4}` : ""}</td>`;
    tr.addEventListener("click", () => { ctx.select(f.file); ctx.detail.scrollIntoView({ behavior: "smooth", block: "center" }); });
    tb.appendChild(tr);
  }
  tbl.appendChild(tb);
  scroll.appendChild(tbl);
  p.appendChild(scroll);
  return p;
}

// ------------------------------------------------------ module inspector ---

function showArchDetail(nd, ctx) {
  const { arch, model, detail: panel } = ctx;
  const i = model.nodes.indexOf(nd);
  panel.innerHTML = `<h2>Module inspector<span class="hint" style="text-transform:none;letter-spacing:0;font-size:11px;opacity:.7;margin-left:10px">upstream in amber, downstream in green on the graph</span></h2>`;
  const dirPart = nd.dir && nd.dir !== "." ? `<span class="dirpart">${esc(nd.dir)}/</span>` : "";
  panel.appendChild(el("div", "pathline", `${dirPart}<b>${esc(nd.name)}</b> ${i >= 0 ? riskBadge(model.risk[i]) : ""}`));

  if (nd.grouped && nd.members) {
    panel.appendChild(el("div", "note",
      `${nd.members.length} standalone ${esc(nd.entry || "script")} files · ${(nd.loc || 0).toLocaleString()} lines total — validation/smoke tooling, grouped into one node so it doesn't drown the runtime graph.`));
    const list = el("div", "");
    list.style.marginTop = "8px";
    list.innerHTML = nd.members.map((m) => `<span class="minichip">${esc(m)}</span>`).join("");
    panel.appendChild(list);
    return;
  }

  // --- metrics ------------------------------------------------------------
  const kpi = el("div", "kpi-row");
  const totalLoc = arch.stats.totalLoc || 1;
  kpi.appendChild(astat((nd.loc || 0).toLocaleString(), "lines", `${((nd.loc || 0) / totalLoc * 100).toFixed(1)}% of the repo`));
  kpi.appendChild(astat((nd.fns || []).length, "functions indexed", `${(nd.fns || []).filter((f) => f.exported).length} exported · ${(nd.fns || []).filter((f) => f.async).length} async`));
  const plural = (k, word) => `${k} ${word}${k === 1 ? "" : "s"}`;
  if (i >= 0) {
    kpi.appendChild(astat(model.outDeg[i], "imports →", `${plural(model.deps[i].size, "module")} transitively`));
    kpi.appendChild(astat(model.inDeg[i], "← imported by", `${plural(model.blast[i], "module")} transitively`));
    kpi.appendChild(astat("L" + model.depth[i], "layer", model.depth[i] === 0 ? "this is an entry point" : `${model.depth[i]} import hop${model.depth[i] === 1 ? "" : "s"} from an entry`));
    kpi.appendChild(astat(model.risk[i], "risk score", "size × blast × surface × test gap"));
  }
  panel.appendChild(kpi);

  // --- tags ---------------------------------------------------------------
  const tags = el("div");
  tags.style.marginTop = "10px";
  if (nd.lang) tags.appendChild(el("span", "tag", esc(nd.lang)));
  if (nd.moduleType) tags.appendChild(el("span", "tag", esc(nd.moduleType)));
  if (nd.entry) tags.appendChild(el("span", "tag", `⚡ entry: ${esc(nd.entry)}`));
  const tt = nd.test || "unknown";
  const tspan = el("span", "tag", `${tt === "tested-real" ? "✓" : "🧪"} ${esc(TEST_LABEL[tt] || tt)}`);
  tspan.style.color = TEST_COLOR[tt] || "var(--muted)";
  tags.appendChild(tspan);
  if (i >= 0 && !model.reachable.has(i)) tags.appendChild(el("span", "tag", "⚠ not reachable from any entry point"));
  for (const w of nd.wfs || []) {
    const wf = (arch.workflows || [])[w];
    if (!wf) continue;
    const t = el("span", "tag", `⚙ ${esc(String(wf.id))} (${(wf.confidence || 0).toFixed(2)})`);
    t.style.borderColor = hexA(WF_PALETTE[w % WF_PALETTE.length], 0.6);
    tags.appendChild(t);
  }
  panel.appendChild(tags);

  panel.appendChild(sectionAskBtn("discuss this module",
    `Tell me about \`${nd.path}\` in this project: what it does, its main functions and what they call, which files import it, whether it has real automated tests, and whether the user-test personas actually exercised it.`,
    `Architecture tab: module "${nd.path}" pinned (${nd.loc} loc, ${(nd.fns || []).length} fns, tests: ${nd.test || "unknown"}${i >= 0 ? `, blast radius ${model.blast[i]}` : ""}).`));

  // --- neighbours ---------------------------------------------------------
  if (i >= 0) {
    const mk = (label, list, hint) => {
      if (!list.length) return null;
      const box = el("div");
      box.innerHTML = `<div class="sub-h">${label}<span class="hint">${hint}</span></div>` +
        list.map((j) => {
          const x = model.nodes[j];
          return `<button class="btn nb-link" data-path="${esc(x.path)}" style="margin:0 6px 6px 0;padding:4px 10px;font-size:12px;background:var(--panel2);color:var(--text);box-shadow:none;border:1px solid ${hexA(wfColorOf(x), 0.6)}">${esc(x.name)} <span style="color:var(--muted)">${x.loc} loc</span></button>`;
        }).join("");
      box.addEventListener("click", (e) => {
        const btn = e.target.closest(".nb-link");
        if (btn) { S.archSel = null; ctx.select(btn.dataset.path); }
      });
      return box;
    };
    const a = mk(`Imports → (${model.outDeg[i]})`, model.out[i], "this module pulls these in directly");
    const b = mk(`← Imported by (${model.inDeg[i]})`, model.inn[i], "breaking this module breaks these first");
    if (a) panel.appendChild(a);
    if (b) panel.appendChild(b);
    if (model.blast[i] > model.inDeg[i]) {
      panel.appendChild(el("div", "note",
        `Transitively, <b>${model.blast[i]}</b> module${model.blast[i] === 1 ? "" : "s"} depend on this file — ${model.blast[i] - model.inDeg[i]} of them indirectly. ` +
        (nd.test === "tested-real" ? "It does have real tests, which is what you want at this fan-in." : "It has no real automated test, so nothing catches a regression before those modules do.")));
    }
  }

  // --- specifiers ---------------------------------------------------------
  const specs = nd.imports || [];
  if (specs.length) {
    const externalSpecs = specs.filter(isBareSpec);
    const relSpecs = specs.filter((s) => !isBareSpec(s));
    const box = el("div");
    box.innerHTML = `<div class="sub-h">Import specifiers (${specs.length})<span class="hint">as written in the source</span></div>` +
      externalSpecs.map((s) => `<span class="minichip ${NODE_BUILTINS.has(pkgOf(s)) || String(s).startsWith("node:") ? "ok" : ""}">${esc(s)}</span>`).join("") +
      relSpecs.map((s) => `<span class="minichip">${esc(s)}</span>`).join("");
    panel.appendChild(box);
  }
  if ((nd.exports || []).length) {
    const box = el("div");
    box.innerHTML = `<div class="sub-h">Exported surface (${nd.exports.length})<span class="hint">what the rest of the repo can call</span></div>` +
      nd.exports.map((e) => `<span class="minichip">${esc(e)}</span>`).join("");
    panel.appendChild(box);
  }

  // --- functions ----------------------------------------------------------
  if ((nd.fns || []).length) {
    const maxFnLoc = Math.max(1, ...nd.fns.map((f) => f.loc || 0));
    panel.appendChild(el("div", "sub-h", `Functions by size<span class="hint">mapd keeps the 12 largest per file, with the calls each makes</span>`));
    const scroll = el("div");
    scroll.style.cssText = "overflow-x:auto";
    const tbl = el("table", "dtable");
    tbl.innerHTML = `<thead><tr><th>function</th><th class="num" style="text-align:right">loc</th><th class="num" style="text-align:right">params</th><th>flags</th></tr></thead>`;
    const tb = el("tbody");
    for (const f of nd.fns) {
      const tr = el("tr");
      tr.style.cursor = "default";
      const calls = (f.calls || []).length
        ? `<div style="font-size:10.5px;color:var(--muted);margin-top:3px">→ ${f.calls.map(esc).join(", ")}</div>` : "";
      tr.innerHTML =
        `<td class="mono"><b>${esc(f.name || "(anonymous)")}</b>${calls}</td>` +
        `<td class="num">${f.loc ?? 0}<div><span class="cellbar" style="width:${Math.max(3, ((f.loc || 0) / maxFnLoc) * 70)}px"></span></div></td>` +
        `<td class="num">${f.params ?? 0}</td>` +
        `<td>${f.exported ? '<span class="pill ok">exported</span> ' : ""}${f.async ? '<span class="pill appendix">async</span>' : ""}</td>`;
      tb.appendChild(tr);
    }
    tbl.appendChild(tb);
    scroll.appendChild(tbl);
    panel.appendChild(scroll);
  }

  // --- intra-file call graph ---------------------------------------------
  const named = (nd.fns || []).filter((f) => f.name && !String(f.name).startsWith("<")).slice(0, 10);
  const nameSet = new Set(named.map((f) => f.name));
  const callPairs = [];
  const seenPair = new Set();
  for (const f of named) {
    for (const c of f.calls || []) {
      const base = String(c).split(".").pop();
      const k = f.name + ">" + base;
      if (nameSet.has(base) && base !== f.name && !seenPair.has(k)) { seenPair.add(k); callPairs.push([f.name, base]); }
    }
  }
  if (named.length >= 2 && callPairs.length) {
    panel.appendChild(el("div", "sub-h", `Internal call graph<span class="hint">which of this file's own functions call which</span>`));
    panel.appendChild(miniCallGraph(named, callPairs));
  }
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/** Small layered SVG of fn→fn calls within one file. */
function miniCallGraph(fns, pairs) {
  const idx = new Map(fns.map((f, i) => [f.name, i]));
  const FN_W = 168, FN_H = 30, GAP_X = 118, GAP_Y = 40;
  const depth = new Array(fns.length).fill(0);
  for (let pass = 0; pass < 8; pass++) {
    for (const [a, b] of pairs) {
      const ia = idx.get(a), ib = idx.get(b);
      if (depth[ia] + 1 > depth[ib]) depth[ib] = depth[ia] + 1;
    }
  }
  const maxD = Math.max(...depth);
  const cols = new Map();
  fns.forEach((f, i) => { if (!cols.has(depth[i])) cols.set(depth[i], []); cols.get(depth[i]).push(i); });
  const posA = new Array(fns.length);
  for (const [d, list] of cols) list.forEach((fi, row) => { posA[fi] = { x: 14 + d * (FN_W + GAP_X), y: 20 + row * GAP_Y }; });
  const W = 28 + (maxD + 1) * (FN_W + GAP_X), H = Math.max(...[...cols.values()].map((l) => l.length)) * GAP_Y + 30;
  const maxLoc = Math.max(1, ...fns.map((f) => f.loc || 0));
  const svg = svgEl("svg", {
    width: "100%", viewBox: `0 0 ${W} ${Math.max(H, 70)}`,
    style: "max-width:" + Math.min(W, 960) + "px;background:radial-gradient(110% 110% at 0% 0%,rgba(110,168,255,.07),transparent 60%),rgba(7,11,20,.55);border-radius:12px;border:1px solid var(--border);margin-top:6px",
  });
  const defs = svgEl("defs", {});
  defs.innerHTML = `<marker id="carr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(140,220,255,.75)"/></marker>`;
  svg.appendChild(defs);
  for (const [a, b] of pairs) {
    const p1 = posA[idx.get(a)], p2 = posA[idx.get(b)];
    if (!p1 || !p2) continue;
    svg.appendChild(svgEl("path", {
      d: `M ${p1.x + FN_W} ${p1.y} C ${p1.x + FN_W + 40} ${p1.y}, ${p2.x - 40} ${p2.y}, ${p2.x - 2} ${p2.y}`,
      fill: "none", stroke: "rgba(140,220,255,.5)", "stroke-width": 1.3, "marker-end": "url(#carr)", class: "edge-anim",
    }));
  }
  fns.forEach((f, i) => {
    const { x, y } = posA[i];
    const g = svgEl("g");
    g.appendChild(svgEl("rect", {
      x, y: y - FN_H / 2, width: FN_W, height: FN_H, rx: 9,
      fill: "rgba(24,31,52,.96)", stroke: f.exported ? "var(--accent)" : "var(--border-hi)", "stroke-width": f.exported ? 1.9 : 1.2,
    }));
    g.appendChild(svgEl("rect", { x: x + 9, y: y + 7, width: Math.max(2, (FN_W - 18) * ((f.loc || 0) / maxLoc)), height: 2.5, rx: 2, fill: f.exported ? "var(--accent)" : "var(--border-hi)", opacity: 0.7 }));
    const t = svgEl("text", { x: x + 9, y: y + 1, fill: "var(--text)", "font-size": 10.5, "font-weight": 600 });
    t.textContent = (f.name.length > 21 ? f.name.slice(0, 20) + "…" : f.name) + (f.async ? " ⟳" : "");
    const l = svgEl("text", { x: x + FN_W - 9, y: y + 1, fill: "var(--muted)", "font-size": 9.5, "text-anchor": "end" });
    l.textContent = `${f.loc ?? 0} loc`;
    const ti = svgEl("title");
    ti.textContent = `${f.name} — ${f.loc ?? 0} lines, ${f.params ?? 0} params${f.async ? ", async" : ""}${f.exported ? ", exported" : ""}`;
    g.append(ti, t, l);
    svg.appendChild(g);
  });
  return svg;
}


// -------------------------------------------- visual 3D architecture sheet ---
// A dependency-accurate architectural blueprint. Every coordinate has meaning:
// elevation = dependency tier (entry surface on the top plate, one plate down
// per import hop), each plate is divided into rectangular source-folder bays,
// block footprint = lines of code, block extrusion = risk. Third-party packages
// sit on a vendor rail outside the building footprint.

const VIS_DIR_COLORS = ["#6ea8ff", "#9a6eff", "#4dd0e1", "#3fd68f", "#ffa14d", "#ff7aa8", "#c99aff", "#ffd166", "#61dafb", "#8bd17c"];

function visualRiskColor(score) {
  return score >= 70 ? "#ff5d73" : score >= 45 ? "#ffa14d" : score >= 25 ? "#ffd166" : "#3fd68f";
}

function visualWorld(model) {
  const nodes = model.nodes;
  const dirOfNode = (nd) => (nd.dir && nd.dir !== "." ? nd.dir : "(root)");
  const dirs = [...new Set(nodes.map(dirOfNode))].sort();
  const dirColor = new Map(dirs.map((d, i) => [d, VIS_DIR_COLORS[i % VIS_DIR_COLORS.length]]));

  // Drafting grid. Every dimension is a multiple of CELL so the drawing reads
  // as a surveyed plan rather than a scatter plot, and so two runs of the same
  // repository produce pixel-identical sheets.
  const CELL = 66;          // module pitch inside a bay
  const BAY_PAD = 24;       // clear space inside a bay border
  const BAY_HEADER = 28;    // label strip along a bay's front edge
  const BAY_GAP = 54;       // clear space between bays
  const TIER_GAP = 200;     // floor-to-floor height between dependency tiers
  const PLATE = 6;          // tier plate thickness

  const tiers = [];
  const bays = [];
  const modules = new Array(nodes.length);
  const detachedSet = new Set(model.detached);

  // Pass one sizes every bay, so the sheet width can be derived from the real
  // drawing area instead of a constant. A fixed wrap makes a 300-module tier a
  // long strip and leaves every lighter tier stranded in one corner of it.
  const tierDefs = [];
  for (let depth = 0; depth <= model.maxDepth; depth++) {
    const here = [];
    nodes.forEach((nd, i) => { if (model.depth[i] === depth) here.push(i); });
    if (!here.length) continue;

    const byDir = new Map();
    for (const i of here) {
      const dir = dirOfNode(nodes[i]);
      if (!byDir.has(dir)) byDir.set(dir, []);
      byDir.get(dir).push(i);
    }
    // Largest bay first keeps the wrap tight; the alphabetical tie-break keeps
    // a folder in a comparable place on every tier it appears on.
    const defs = [...byDir.entries()]
      .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]))
      .map(([dir, list]) => {
        list.sort((a, b) => model.risk[b] - model.risk[a] || (nodes[b].loc || 0) - (nodes[a].loc || 0));
        const cols = Math.max(1, Math.min(6, Math.ceil(Math.sqrt(list.length * 1.25))));
        const rows = Math.ceil(list.length / cols);
        return { dir, list, cols, rows, w: cols * CELL + BAY_PAD * 2, d: rows * CELL + BAY_PAD * 2 + BAY_HEADER };
      });
    tierDefs.push({ depth, here, defs });
  }

  // A landscape sheet the busiest tier fills comfortably; every other tier is
  // packed against the same width, so the plates stay proportionate to it.
  const busiestArea = Math.max(...tierDefs.map((t) => t.defs.reduce((sum, b) => sum + (b.w + BAY_GAP) * (b.d + BAY_GAP), 0)));
  const ROW_TARGET = Math.max(900, Math.min(3400, Math.round(Math.sqrt(busiestArea * 1.7))));

  for (const { depth, here, defs } of tierDefs) {
    const packed = [];
    let row = [], rowW = 0;
    for (const def of defs) {
      if (row.length && rowW + BAY_GAP + def.w > ROW_TARGET) { packed.push({ list: row, w: rowW }); row = []; rowW = 0; }
      rowW += (row.length ? BAY_GAP : 0) + def.w;
      row.push(def);
    }
    if (row.length) packed.push({ list: row, w: rowW });

    const tierW = Math.max(...packed.map((r) => r.w));
    const tierD = packed.reduce((sum, r) => sum + Math.max(...r.list.map((b) => b.d)), 0) + BAY_GAP * (packed.length - 1);
    // Entry surface on the top plate, one plate down per import hop.
    const tierY = (model.maxDepth - depth) * TIER_GAP;

    let z = -tierD / 2;
    for (const r of packed) {
      const rowD = Math.max(...r.list.map((b) => b.d));
      let x = -r.w / 2;
      for (const def of r.list) {
        const bay = {
          dir: def.dir, depth, color: dirColor.get(def.dir), count: def.list.length,
          x1: x, x2: x + def.w, z1: z, z2: z + def.d, y: tierY,
          cx: x + def.w / 2, cz: z + def.d / 2,
          loc: def.list.reduce((sum, i) => sum + (nodes[i].loc || 0), 0),
        };
        bays.push(bay);
        def.list.forEach((idx, slot) => {
          const nd = nodes[idx];
          const col = slot % def.cols, line = Math.floor(slot / def.cols);
          // Footprint encodes size, extrusion encodes risk — one meaning each.
          const size = Math.max(17, Math.min(CELL - 22, 14 + Math.sqrt(Math.max(1, nd.loc || 0)) * 1.15));
          modules[idx] = {
            kind: "module", idx, nd,
            x: bay.x1 + BAY_PAD + col * CELL + CELL / 2,
            z: bay.z1 + BAY_HEADER + BAY_PAD + line * CELL + CELL / 2,
            y: tierY + PLATE,
            w: size, d: size,
            h: 10 + model.risk[idx] * .48,
            tier: depth, directory: def.dir, bay, cell: CELL,
          };
        });
        x += def.w + BAY_GAP;
      }
      z += rowD + BAY_GAP;
    }

    tiers.push({
      depth, y: tierY, plate: PLATE, count: here.length,
      x1: -tierW / 2 - BAY_GAP, x2: tierW / 2 + BAY_GAP,
      z1: -tierD / 2 - BAY_GAP, z2: tierD / 2 + BAY_GAP,
      w: tierW + BAY_GAP * 2, d: tierD + BAY_GAP * 2,
      loc: here.reduce((sum, i) => sum + (nodes[i].loc || 0), 0),
      tested: here.filter((i) => nodes[i].test === "tested-real").length,
      entries: here.filter((i) => nodes[i].entry).length,
      highRisk: here.filter((i) => model.risk[i] >= 70).length,
      detached: depth === model.maxDepth && detachedSet.size > 0 && here.every((i) => detachedSet.has(i)),
      label: depth === 0 ? "ENTRY SURFACE" : `+${depth} IMPORT HOP${depth === 1 ? "" : "S"}`,
      // Filled in below once the detached flag above is known for the whole tier.

    });
  }

  for (const tier of tiers) {
    if (tier.detached) tier.label = "DETACHED · NOT REACHED FROM AN ENTRY";
  }

  // Every plate is squared off to the largest, so the tiers stack like the
  // floors of one building instead of a pile of differently-sized slabs. A
  // sparsely occupied plate is information, not a layout failure.
  const plateW = Math.max(...tiers.map((t) => t.w));
  const plateD = Math.max(...tiers.map((t) => t.d));
  for (const tier of tiers) {
    tier.x1 = -plateW / 2; tier.x2 = plateW / 2;
    tier.z1 = -plateD / 2; tier.z2 = plateD / 2;
    tier.w = plateW; tier.d = plateD;
  }

  // Floor-to-floor height scales with the plate: a wide repository drawn with a
  // short storey reads as two floating slabs, not as a stacked architecture.
  const tierGap = Math.round(Math.max(190, Math.min(470, Math.max(plateW, plateD) * .34)));
  if (tierGap !== TIER_GAP) {
    const byDepth = new Map(tiers.map((t) => [t.depth, t]));
    for (const tier of tiers) {
      const shift = (model.maxDepth - tier.depth) * tierGap - tier.y;
      tier.y += shift;
      tier.shift = shift;
    }
    for (const bay of bays) bay.y += byDepth.get(bay.depth).shift;
    for (const m of modules) if (m) m.y += byDepth.get(m.tier).shift;
  }

  const sheet = {
    x1: Math.min(...tiers.map((t) => t.x1)) - 90,
    x2: Math.max(...tiers.map((t) => t.x2)) + 90,
    z1: Math.min(...tiers.map((t) => t.z1)) - 90,
    z2: Math.max(...tiers.map((t) => t.z2)) + 90,
  };
  const topY = Math.max(...tiers.map((t) => t.y));

  // --- vendor boundary: a flat rail outside the building footprint ---------
  const extList = model.externals.slice(0, 36);
  // A shallow, wide strip reads as a boundary; a square block reads as a second
  // campus. Three rows at most, however many packages there are.
  const railPitchX = 112, railPitchZ = 62;
  const railRows = Math.max(1, Math.min(3, Math.ceil(extList.length / 10)));
  const railCols = Math.max(1, Math.ceil(extList.length / railRows));
  const railW = railCols * railPitchX;
  const rail = {
    y: 0,
    z1: plateD / 2 + 96,
    z2: plateD / 2 + 96 + railRows * railPitchZ,
    x1: -railW / 2, x2: railW / 2,
    count: extList.length,
  };
  const extItems = extList.map((external, i) => {
    const col = i % railCols, line = Math.floor(i / railCols);
    return {
      kind: "external", external,
      x: rail.x1 + col * railPitchX + railPitchX / 2,
      z: rail.z1 + line * railPitchZ + railPitchZ / 2,
      y: rail.y,
      w: 22 + Math.min(16, external.count * 2), d: 20, h: 9,
      color: external.builtin ? "#4dd0e1" : "#c99aff",
    };
  });

  // --- directory rollup, kept for the legend and the 2D fallback -----------
  const dirZones = dirs.map((dir) => {
    const mine = bays.filter((b) => b.dir === dir);
    const items = modules.filter((m) => m && m.directory === dir);
    return {
      dir, color: dirColor.get(dir), count: items.length,
      tiers: [...new Set(mine.map((b) => b.depth))].sort((a, b) => a - b),
      loc: items.reduce((sum, m) => sum + (m.nd.loc || 0), 0),
      x1: Math.min(...mine.map((b) => b.x1)), x2: Math.max(...mine.map((b) => b.x2)),
      z1: Math.min(...mine.map((b) => b.z1)), z2: Math.max(...mine.map((b) => b.z2)),
    };
  });

  const pathItem = new Map(modules.filter(Boolean).map((m) => [m.nd.path, m]));
  const extEdges = [];
  for (const ext of extItems) {
    for (const file of ext.external.files || []) {
      const from = pathItem.get(file);
      if (from) extEdges.push({ a: from, b: ext, kind: "external" });
    }
  }
  const importEdges = model.uniqEdges.map(([a, b]) => ({ a: modules[a], b: modules[b], kind: "import", ai: a, bi: b }));
  // Workflow rails are not imports. They connect files mapd inferred participate
  // in the same execution slice — an operational layer drawn above the plates.
  const flowPairs = new Set();
  const workflowEdges = [];
  for (let wi = 0; wi < (model.arch.workflows || []).length; wi++) {
    const members = modules.filter((m) => m && (m.nd.wfs || []).includes(wi))
      .sort((a, b) => model.depth[a.idx] - model.depth[b.idx] || a.x - b.x || a.z - b.z);
    for (let i = 1; i < members.length; i++) {
      const a = members[i - 1], b = members[i];
      const key = a.idx < b.idx ? `${a.idx}:${b.idx}` : `${b.idx}:${a.idx}`;
      if (flowPairs.has(`${wi}:${key}`)) continue;
      flowPairs.add(`${wi}:${key}`);
      workflowEdges.push({ a, b, kind: "workflow", ai: a.idx, bi: b.idx, wi });
    }
  }

  const all = [...modules.filter(Boolean), ...extItems];
  return {
    modules, externals: extItems, items: all, zones: dirZones, bays, tiers, sheet, rail,
    // Bays replace the old per-folder rails: the rectangle already says
    // "stored together", so no invented edge has to say it.
    districtEdges: [], importEdges, workflowEdges, extEdges,
    bounds: {
      x1: Math.min(sheet.x1, rail.x1, ...all.map((m) => m.x - m.w)),
      x2: Math.max(sheet.x2, rail.x2, ...all.map((m) => m.x + m.w)),
      z1: Math.min(sheet.z1, ...all.map((m) => m.z - m.d)),
      z2: Math.max(sheet.z2, rail.z2, ...all.map((m) => m.z + m.d)),
    },
    pathItem, center: { x: 0, z: 0 }, topY,
    geom: { CELL, BAY_PAD, BAY_HEADER, BAY_GAP, TIER_GAP: tierGap, PLATE },
  };
}

function visualNodeColor(item, model, mode) {
  if (item.kind === "external") return item.color;
  if (mode === "risk") return visualRiskColor(model.risk[item.idx]);
  if (mode === "tests") return item.nd.test === "tested-real" ? "#3fd68f" : item.nd.test === "untested" ? "#ff5d73" : "#ffd166";
  if (mode === "folders") {
    const dir = item.nd.dir && item.nd.dir !== "." ? item.nd.dir : "(root)";
    let h = 0; for (let i = 0; i < dir.length; i++) h = (h * 31 + dir.charCodeAt(i)) >>> 0;
    return VIS_DIR_COLORS[h % VIS_DIR_COLORS.length];
  }
  return wfColorOf(item.nd);
}

async function renderVisual() {
  if (S.visualCleanup) { S.visualCleanup(); S.visualCleanup = null; }
  const r = S.run, main = $("#main");
  main.innerHTML = "";
  if (!r) { main.appendChild(el("div", "empty", "No run selected.")); return; }

  const loading = el("div", "panel", "<h2>Visual · 3D architecture blueprint</h2>");
  loading.appendChild(el("div", "empty", "Drafting the architecture sheet from the static code map…"));
  main.appendChild(loading);

// ------------------------------------------------------------- findings ---
function findingCard(f) {
  const card = el("div", `finding-card ${f.severity || ""} ${f.section === "goal-gap" ? "goal-gap" : f.section === "appendix" ? "appendix" : ""}`);
  card.id = "finding-" + f.code;
  const sevPill = f.section === "main" ? `<span class="pill ${f.severity}">${f.severity}</span>` : `<span class="pill ${f.section === "goal-gap" ? "goal" : "appendix"}">${f.section}</span>`;
  const repro = f.section === "appendix" ? `<span class="pill appendix">unverified</span>`
    : f.repro === "confirmed" ? `<span class="pill ok">repro ✓</span>` : `<span class="pill appendix">${esc(f.repro || "unverified")}</span>`;
  card.appendChild(el("h3", "", `${sevPill} <span class="pill" style="color:var(--accent);border-color:var(--accent)">${f.code}</span> ${esc(f.title)}`));
  const foundBy = (f.found_by || []).join(", ") || "unknown";
  card.appendChild(el("div", "meta", `found by <b>${esc(foundBy)}</b> ${f.found_by && f.found_by.length > 1 ? "· ✓ corroborated" : "· ⚠ single persona"} ${repro}`));
  if (f.screenshot) card.appendChild(el("img", "", "")).src = `/shots/${S.run.dir}/${String(f.screenshot).replace(/^shots\//, "")}`;
  if (f.steps && f.steps.length) {
    const ol = el("ol");
    for (const s of f.steps) ol.appendChild(el("li", "", esc(String(s).replace(/^\d+\.\s*/, ""))));
    card.appendChild(ol);
  }
  if (f.expected || f.actual) {
    card.appendChild(el("div", "expact", `<div><b>Expected</b>${esc(f.expected || "—")}</div><div><b>Actual</b>${esc(f.actual || "—")}</div>`));
  }
  if (f.section === "main") {
    const btnRow = el("div", "", "");
    btnRow.style.marginTop = "10px";
    const btn = el("button", "btn", "✨ Explain this finding");
    btn.addEventListener("click", () => explain(f.code, btn));
    btnRow.appendChild(btn);
    const discuss = el("button", "btn", "💬 Discuss");
    discuss.title = "Ask the analyst about this finding";
    discuss.addEventListener("click", () => askAnalyst(`Let's discuss ${f.code || "this finding"} — "${f.title}". How serious is it really, what's the likely root cause in the code, and what would you fix first?`, `Findings tab: user is looking at finding ${f.code || "?"} — "${f.title}" (${f.severity}${f.found_by && f.found_by.length ? ", found by " + f.found_by.join(", ") : ""}).`));
    btnRow.appendChild(discuss);
    card.appendChild(btnRow);
  }
  return card;
}

async function explain(code, btn) {
  const card = btn.closest(".finding-card");
  let box = card.querySelector(".explain");
  if (box) { box.remove(); return; }
  btn.disabled = true;
  btn.textContent = "Thinking…";
  box = el("div", "explain", "");
  card.appendChild(box);
  try {
    const { text } = await api("/api/explain", { dir: S.run.dir, code });
    box.innerHTML = `<div class="md">${md(text)}</div>`;
  } catch (e) {
    box.textContent = "Explain failed: " + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "✨ Explain this finding";
  }
}

function renderFindings() {
  const r = S.run, main = $("#main");
  main.innerHTML = "";
  if (!r) { main.appendChild(el("div", "empty", "No run selected.")); return; }
  const headPanel = el("div", "panel", "<h2>Findings</h2>");
  headPanel.appendChild(sectionAskBtn("discuss these findings", "Discuss the findings in this run as a whole: the patterns across them, which matter most and why, and what you'd fix first.", `Findings tab: full ranked list in view (${(r.findings || []).length} findings).`));
  headPanel.appendChild(artifactStrip([
    { file: "findings-merged.json", hint: "the chair's verified output" },
    { file: "REPORT.md", hint: "the same findings, written up" },
  ], "source of truth →"));
  main.appendChild(headPanel);
  const groups = [["critical", "Critical"], ["major", "Major"], ["minor", "Minor"], ["goal-gap", "Goal gaps"], ["appendix", "Appendix (unverified)"]];
  let any = false;
  for (const [key, label] of groups) {
    const list = r.findings.filter((f) => (f.section === "main" ? f.severity : f.section) === key);
    if (!list.length) continue;
    any = true;
    const p = el("div", "panel", `<h2>${label} (${list.length})</h2>`);
    for (const f of list) p.appendChild(findingCard(f));
    main.appendChild(p);
  }
  if (!any) main.appendChild(el("div", "empty", "No findings in this run — clean report 🎉"));
}

function showFinding(code, titleHint) {
  const f = (S.run.findings || []).find((x) => x.code === code);
  if (f) S.lastFinding = f;
  S.tab = "findings";
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === "findings"));
  renderFindings();
  let card = code ? $("#finding-" + code) : null;
  if (!card && titleHint) {
    card = [...document.querySelectorAll(".finding-card h3")].find((h) => h.textContent.includes(titleHint.slice(0, 30)))?.closest(".finding-card");
  }
  if (card) { card.scrollIntoView({ behavior: "smooth", block: "center" }); card.style.boxShadow = "0 0 0 2px var(--accent)"; setTimeout(() => (card.style.boxShadow = ""), 1600); }
}

// -------------------------------------------------------------- history ---
function renderHistory() {
  const main = $("#main");
  main.innerHTML = "";
  const p = el("div", "panel", "<h2>All runs — newest first</h2>");
  p.appendChild(sectionAskBtn("compare runs", "Compare the runs in this history: is the product improving or regressing? Call out trends in critical/major counts and cost.", `History tab: table of ${S.runs.length} runs in view.`));
  if (!S.runs.length) { p.appendChild(el("div", "empty", "No completed runs yet.")); main.appendChild(p); return; }
  const tableWrap = el("div", "flow-wrap");

  table.innerHTML = `<tr><th></th><th>Run</th><th>Target</th><th>C</th><th>M</th><th>m</th><th>Goals</th><th>Cost</th><th title="Successful responses / total API attempts">Responses / attempts</th><th></th></tr>`;

    const tr = el("tr", "clickable");
    tr.innerHTML = `
      <td>${r.dir === (S.run && S.run.dir) ? "●" : ""}</td>
      <td>${esc(r.dir.replace("T", " ").replace(/\.\d+Z$/, "Z"))}</td>

      <td style="color:var(--major)">${r.major || ""}</td>
      <td style="color:var(--minor)">${r.minor || ""}</td>
      <td>${r.goalGaps || ""}</td>
      <td>${fmt$(r.costUsd)}</td>
      <td style="color:var(--muted)">${r.llmCalls} / ${r.llmAttempts ?? r.llmCalls}</td>
      <td>${r.newCount != null && r.newCount > 0 ? `<span class="pill" style="color:var(--accent);border-color:var(--accent)">+${r.newCount} new</span>` : ""}${r.partial ? '<span class="pill major">partial</span>' : ""}</td>`;
    tr.addEventListener("click", () => selectRun(r.dir));
    tr.tabIndex = 0;
